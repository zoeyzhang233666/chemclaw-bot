<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ChemClaw macOS app icon">
  <!-- Scheme A: the existing ChemClaw orange cloud on a warm-paper macOS tile. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="0.58" stop-color="#FBF4E9"/>
      <stop offset="1" stop-color="#F4E8D6"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0.93" y2="1">
      <stop offset="0" stop-color="#FF9639"/>
      <stop offset="0.45" stop-color="#FF7D2D"/>
      <stop offset="1" stop-color="#FF671F"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cloudShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="paperTexture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="76" y="75" width="872" height="872" rx="223"/>
    </clipPath>
  </defs>
  <!-- Transparent exterior; macOS sees the rounded tile, not a gray canvas. -->
  <rect x="76" y="88" width="872" height="872" rx="223" fill="#443626" opacity="0.19" filter="url(#tileShadow)"/>
  <rect x="76" y="75" width="872" height="872" rx="223" fill="url(#paper)" stroke="#EBDCCA" stroke-width="1.5"/>
  <g clip-path="url(#tileClip)">
    <rect x="76" y="75" width="872" height="872" fill="#F8F0E4" filter="url(#paperTexture)" opacity="0.045"/>
  </g>
  <path d="M8.5 23.5h15.2c2.9 0 5.3-2.2 5.3-5.1 0-2.7-2-4.9-4.6-5.2-.6-3.8-3.9-6.7-7.9-6.7-3.2 0-6 1.9-7.3 4.6C6.6 11.4 4 14 4 17.2c0 3.5 2.7 6.3 4.5 6.3Z"
        transform="translate(82 112) scale(27.5)" fill="none" stroke="#AA652D" stroke-opacity="0.15" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#cloudShadow)"/>
  <path d="M8.5 23.5h15.2c2.9 0 5.3-2.2 5.3-5.1 0-2.7-2-4.9-4.6-5.2-.6-3.8-3.9-6.7-7.9-6.7-3.2 0-6 1.9-7.3 4.6C6.6 11.4 4 14 4 17.2c0 3.5 2.7 6.3 4.5 6.3Z"
        transform="translate(82 108) scale(27.5)" fill="none" stroke="url(#cloud)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
