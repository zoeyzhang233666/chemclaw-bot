<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#fffaf6"/>
      <stop offset="0.50" stop-color="#fdf8f4"/>
      <stop offset="1" stop-color="#faf4ef"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7ad8c" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#f9a07d" stop-opacity="0.65"/>
      <stop offset="0.83" stop-color="#f36d43"/>
      <stop offset="1" stop-color="#f3663e"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7c5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f9ad87" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="540" height="380" fill="url(#paper)"/>
  <rect width="540" height="380" filter="url(#grain)" opacity="0.026"/>
  <!-- Light, warm paper background from the approved first design. -->
  <path d="M 440 -20 C 450 12 466 35 488 35 C 501 35 501 55 518 59 C 532 62 539 70 560 69 L 560 -25 Z" fill="url(#peach)"/>
  <path d="M 485 -8 C 496 11 507 20 522 20 C 537 21 546 37 553 50 L 560 -12 Z" fill="#f5b99f" opacity="0.12"/>
  <path d="M -25 285 C 34 274 62 306 91 329 C 119 328 145 352 167 387 L -25 387 Z" fill="url(#peach)"/>
  <path d="M -22 326 C 44 312 82 338 117 357 C 135 369 159 369 184 390 L -22 390 Z" fill="#f5c1aa" opacity="0.18"/>
  <text x="270" y="64" text-anchor="middle" fill="#292929"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="-0.4">Drag ChemClaw to Applications</text>
  <text x="270" y="89" text-anchor="middle" fill="#5a5757"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
        font-size="12.3" font-weight="400">将 ChemClaw 拖到 Applications 文件夹中完成安装</text>
  <!-- Native Finder icons at (140,180) and (400,180); do not paint icons into the background. -->
  <g fill="#f9b497" opacity="0.68">
    <circle cx="223" cy="189" r="1.6"/>
    <circle cx="234" cy="183" r="1.7"/>
    <circle cx="245" cy="178" r="1.8"/>
    <circle cx="256" cy="173" r="1.9"/>
    <circle cx="267" cy="170" r="2.0"/>
    <circle cx="278" cy="167" r="2.1"/>
    <circle cx="289" cy="166" r="2.0"/>
    <circle cx="301" cy="165" r="2.1"/>
    <circle cx="313" cy="166" r="1.9"/>
  </g>
  <path d="M 212 201 C 244 181 291 174 333 182 L 333 173 L 362 194 L 333 211 L 333 202 C 286 190 249 185 212 201 Z" fill="url(#swoosh)"/>
</svg>
