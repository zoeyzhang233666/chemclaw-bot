<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBS 产业链知识图谱</title>
<style>/* chain.css — 产业链图谱样式（深色专业风，离线自包含，无外链字体） */
:root{
  --bg:#070b14; --bg2:#0b1120; --panel:#0f1729; --panel2:#131d33;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --txt:#e9eefb; --txt2:#9fb0cf; --txt3:#6b7a99;
  --acc:#4d8dff; --ok:#39d0a6; --warn:#ffab5b; --bad:#ff6b6b;
  --chem:#4d8dff; --mat:#39d0a6; --app:#f2c14e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(77,141,255,.13), transparent 60%),
    radial-gradient(900px 500px at 88% 4%, rgba(57,208,166,.10), transparent 55%),
    var(--bg);
  color:var(--txt);
  font:13px/1.55 "Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100vh;max-height:100vh;
  padding:12px 14px 10px;gap:9px;overflow:hidden}
#app.scrollable{overflow:auto;height:auto;max-height:none}

/* ---------------- 顶部 ---------------- */
.topbar{display:flex;align-items:flex-start;gap:16px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,#4d8dff,#39d0a6);color:#06101f;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;
  box-shadow:0 6px 20px rgba(77,141,255,.35)}
.brandtxt{min-width:0}
h1{margin:0;font-size:19px;font-weight:750;letter-spacing:.2px}
.sub{font-size:11.5px;color:var(--txt2);margin-top:2px}
.stamp{font-size:11px;color:var(--txt3);text-align:right;line-height:1.65;white-space:nowrap;margin-left:auto}

/* ---------------- 覆盖面板 ---------------- */
.coverage{flex:0 0 auto;display:grid;max-height:220px;
  grid-template-columns:auto 1fr 320px;
  grid-template-areas:"gauge cards gaps" "scope scope scope";
  gap:10px 14px;padding:10px 12px;
  border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,rgba(19,29,51,.72),rgba(11,17,32,.72));
  transition:max-height .25s,opacity .2s;overflow:hidden}
.coverage.collapsed{max-height:0;padding:0;border-width:0;opacity:0;margin-top:-9px}
.cov-gauge{grid-area:gauge;display:flex;align-items:center;gap:11px}
.gauge{width:92px;height:92px;flex:0 0 auto}
.gauge-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9}
.gauge-fg{fill:none;stroke-width:9;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:60px 60px;
  transition:stroke-dashoffset .7s cubic-bezier(.3,.9,.3,1)}
.gauge-fg.good{stroke:#39d0a6}
.gauge-fg.mid{stroke:#ffab5b}
.gauge-fg.bad{stroke:#ff6b6b}
.gauge-num{fill:#fff;font-size:23px;font-weight:800;text-anchor:middle;
  font-family:"Segoe UI",system-ui,sans-serif}
.gauge-cap{fill:#7d8ba8;font-size:9.5px;text-anchor:middle;
  font-family:"Segoe UI",system-ui,sans-serif}
.cov-note{font-size:11px;color:var(--txt2);max-width:190px;line-height:1.6}
.cov-note b{color:#fff;font-size:14px}
.cov-cards{grid-area:cards;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;align-content:start}
.cov-card{background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:9px;padding:6px 9px;min-width:0}
.cov-card .k{font-size:10px;color:var(--txt3);letter-spacing:.3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cov-card .v{font-size:15px;font-weight:750;color:#fff;line-height:1.35;
  display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.cov-card .v small{font-size:10px;color:var(--txt3);font-weight:600}
.cov-gaps{grid-area:gaps;font-size:11px;color:var(--txt2);
  max-height:96px;overflow:auto;line-height:1.65}
.gap-h{color:var(--txt3);font-size:10.5px;margin-bottom:2px;letter-spacing:.3px}
.gap-i{padding:1px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.gap-i.ok{color:var(--ok)}
.cov-scope{grid-area:scope;font-size:10.5px;color:var(--txt3);line-height:1.6;
  border-top:1px dashed var(--line);padding-top:7px}
.cov-scope b{color:var(--txt2)}

/* ---------------- 工具条 ---------------- */
.toolbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:34px}
.tb-group{display:flex;gap:6px;align-items:center;min-width:0}
.tb-group.right{margin-left:auto}
.tb-label{font-size:11px;color:var(--txt3);white-space:nowrap}
.search{background:rgba(0,0,0,.30);border:1px solid var(--line2);color:var(--txt);
  border-radius:9px;padding:6px 11px;font-size:12px;width:250px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.search:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,141,255,.15)}
.search::placeholder{color:var(--txt3)}
.search-drop{position:absolute;z-index:60;margin-top:4px;background:#0d1526;
  border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.66);
  display:none;min-width:250px;max-width:340px;overflow:hidden}
.sr-item{padding:7px 11px;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.sr-item:hover{background:rgba(77,141,255,.16)}
.sr-item .meta{color:var(--txt3);font-size:10.5px;margin-left:auto;white-space:nowrap}
.sr-item.empty{color:var(--txt3);cursor:default}
.chip{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);
  color:var(--txt2);cursor:pointer;background:transparent;transition:.15s;white-space:nowrap}
.chip:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.chip.active{background:rgba(77,141,255,.18);border-color:var(--acc);color:#fff}
.sel{background:rgba(0,0,0,.30);border:1px solid var(--line2);color:var(--txt2);
  border-radius:8px;padding:5px 8px;font-size:11.5px;outline:none;max-width:170px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--txt2);
  padding:6px 11px;border-radius:8px;font-size:11.5px;cursor:pointer;transition:.15s;
  white-space:nowrap;font-family:inherit}
.btn:hover{border-color:var(--line2);color:#fff;background:var(--panel2)}
.btn.active{background:rgba(77,141,255,.2);border-color:var(--acc);color:#fff}
.btn.primary{background:linear-gradient(140deg,rgba(77,141,255,.28),rgba(57,208,166,.22));
  border-color:rgba(77,141,255,.5);color:#fff}
.selbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;font-size:11.5px;
  color:var(--txt3);padding:0 3px;flex-wrap:wrap}
.sel-hint b{color:var(--txt2)}
.sel-chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip-sel{background:rgba(77,141,255,.16);border:1px solid rgba(77,141,255,.45);
  color:#dce8ff;border-radius:99px;padding:2px 10px;font-size:11px;cursor:pointer}
.chip-sel .x{color:var(--txt3);margin-left:5px}
.chip-sel:hover .x{color:var(--bad)}

/* ---------------- 舞台 ---------------- */
.stage{flex:1 1 auto;display:flex;gap:9px;min-height:280px;position:relative;overflow:hidden}
.canvas-wrap{flex:1 1 auto;position:relative;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;min-height:420px;
  background:
    radial-gradient(900px 400px at 50% 0%, rgba(77,141,255,.06), transparent 60%),
    rgba(7,11,20,.55)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg:active{cursor:grabbing}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:8px;font-size:10.5px;
  color:var(--txt3);background:rgba(7,11,20,.80);border:1px solid var(--line);
  border-radius:99px;padding:3.5px 13px;pointer-events:none;z-index:3;max-width:70%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-legend{position:absolute;left:10px;bottom:10px;display:flex;gap:9px;flex-wrap:wrap;
  font-size:10px;color:var(--txt2);background:rgba(7,11,20,.78);
  border:1px solid var(--line);border-radius:9px;padding:5px 9px;max-width:calc(100% - 230px);z-index:3}
.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block;background:#8899aa}
.lg i.lg-solid{background:var(--chem)}
.lg i.lg-mat{background:var(--mat)}
.lg i.lg-app{background:var(--app)}

/* 泳道 */
.lane-band{fill:rgba(255,255,255,.014)}
.lane-band.odd{fill:rgba(255,255,255,.032)}
.lane-title{fill:#8fa2c4;font-size:12px;font-weight:620;letter-spacing:.4px;
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.lane-sub{fill:#5b6a86;font-size:9.5px;
  font-family:"Segoe UI",system-ui,sans-serif}

/* 边 */
.edge{fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke-width .13s,opacity .18s,filter .13s;cursor:pointer}
.edge:hover,.edge.edge-hi{stroke-width:2.8;filter:drop-shadow(0 0 5px currentColor)}
.edge.up{stroke-width:2.1;opacity:1}
.edge.down{stroke-width:2.1;opacity:1}
.edge.dim{opacity:.16}
.edge.filtered{opacity:.07;pointer-events:none}
.edge-label{fill:#8ea2c0;font-size:9.5px;font-weight:600;
  font-family:"Segoe UI",system-ui,sans-serif;pointer-events:none;
  paint-order:stroke;stroke:rgba(7,11,20,.92);stroke-width:3px;stroke-linejoin:round}
.tip{position:fixed;z-index:9999;display:none;max-width:330px;font-size:11.5px;
  background:#0d1526;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;
  color:var(--txt2);box-shadow:0 14px 40px rgba(0,0,0,.7);pointer-events:none;line-height:1.6}
.tip b{color:#fff}

/* 节点 */
.node{cursor:pointer}
.node .node-bg{fill:rgba(19,29,51,.96);stroke:rgba(255,255,255,.13);stroke-width:1;
  transition:stroke .15s,fill .15s}
.node .node-strip{fill:var(--chem);opacity:.9}
.node.k-material .node-strip{fill:var(--mat)}
.node.k-application .node-strip{fill:var(--app)}
.node .node-title{fill:#eef3ff;font-weight:640;
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.node .node-sub{fill:#7b8aa8;font-family:"Segoe UI",system-ui,sans-serif}
.node .node-flag{fill:var(--warn);text-anchor:end;font-family:"Segoe UI",system-ui,sans-serif}
.node .node-ok{fill:rgba(57,208,166,.55);text-anchor:end;font-family:"Segoe UI",system-ui,sans-serif}
.node:hover .node-bg{stroke:rgba(255,255,255,.42);fill:rgba(24,37,63,.99)}
.node.role-target .node-bg{fill:rgba(32,52,96,.99);stroke:rgba(122,170,255,.72);stroke-width:1.6}
.node.role-substitute .node-bg{stroke-dasharray:5 3;stroke:rgba(255,138,91,.5)}
.node.k-application .node-bg{fill:rgba(33,30,20,.95)}
.node.selected .node-bg{stroke:#fff;stroke-width:2.2;fill:rgba(38,60,110,1);
  filter:drop-shadow(0 0 12px rgba(122,170,255,.55))}
.node.up .node-bg{stroke:rgba(77,141,255,.85);stroke-width:1.7}
.node.down .node-bg{stroke:rgba(57,208,166,.85);stroke-width:1.7}
.node.dim{opacity:.26}
.node.filtered{opacity:.09;pointer-events:none}

/* 小地图 */
.minimap-wrap{position:absolute;right:9px;bottom:9px;width:190px;height:64px;
  border:1px solid var(--line);border-radius:9px;background:rgba(7,11,20,.85);
  overflow:hidden;z-index:3}
#minimap{width:100%;height:100%}
.mini-n{fill:rgba(120,150,200,.55)}
.mini-n.mini-material{fill:rgba(57,208,166,.6)}
.mini-n.mini-application{fill:rgba(242,193,78,.6)}
.mini-view{fill:rgba(77,141,255,.14);stroke:rgba(122,170,255,.85);stroke-width:2;
  vector-effect:non-scaling-stroke}

/* ---------------- 侧栏 ---------------- */
.sidebar{flex:0 0 372px;display:none;flex-direction:column;min-height:0;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  overflow:hidden}
.sidebar.open{display:flex}
.sb-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);flex:0 0 auto}
.sb-tabs{display:flex;gap:3px;flex:1 1 auto}
.sb-tab{background:transparent;border:1px solid transparent;color:var(--txt3);
  font-size:11.5px;padding:4px 11px;border-radius:7px;cursor:pointer;font-family:inherit}
.sb-tab:hover{color:#fff}
.sb-tab.active{background:rgba(77,141,255,.18);border-color:rgba(77,141,255,.45);color:#fff}
.sb-close{background:transparent;border:1px solid var(--line);color:var(--txt3);
  border-radius:7px;width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1}
.sb-close:hover{color:#fff;border-color:var(--line2)}
.sb-body{flex:1 1 auto;overflow:auto;padding:11px 12px 20px;min-height:0}
.sb-open{display:none;position:absolute;right:0;top:12px;z-index:20;
  background:var(--panel);border:1px solid var(--line2);border-right:0;
  border-radius:9px 0 0 9px;color:var(--txt2);padding:9px 5px;cursor:pointer;font-size:12px}
.sb-open.show{display:block}
.sb-title{font-size:15px;font-weight:720;color:#fff;line-height:1.45}
.sb-badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 9px}
.bd{font-size:10px;border:1px solid var(--line2);border-radius:99px;padding:1.5px 8px;color:var(--txt2)}
.bd-commodity{border-color:rgba(77,141,255,.55);color:#9dc0ff}
.bd-material{border-color:rgba(57,208,166,.55);color:#8ee6cc}
.bd-application{border-color:rgba(242,193,78,.55);color:#ffe09a}
.kv{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 8px}
.kv th{text-align:left;color:var(--txt3);font-weight:500;padding:3px 8px 3px 0;
  white-space:nowrap;vertical-align:top;width:1%}
.kv td{color:var(--txt);padding:3px 0;word-break:break-word}
.tiny{color:var(--txt3);font-size:10px}
.warn{color:var(--warn)}
.sb-note{font-size:11.5px;color:var(--txt2);line-height:1.65;background:rgba(255,255,255,.03);
  border-left:2px solid rgba(77,141,255,.5);border-radius:0 7px 7px 0;padding:7px 9px;margin:6px 0}
.sb-sec{font-size:11px;color:var(--txt3);letter-spacing:.4px;margin:14px 0 6px;
  padding-bottom:4px;border-bottom:1px dashed var(--line);font-weight:600}
.spark-wrap{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:9px;
  padding:7px 8px 5px}
.spark{width:100%;height:60px;display:block}
.spark-area{fill:rgba(77,141,255,.16)}
.spark-line{fill:none;stroke:#6ea2ff;stroke-width:1.8;stroke-linejoin:round}
.spark-meta{display:flex;gap:7px;align-items:baseline;font-size:11px;margin-top:3px;flex-wrap:wrap}
.spark-last{color:#fff;font-weight:750;font-size:14px}
.spark-unit{color:var(--txt3);font-size:10px}
.spark-chg{font-weight:700;font-size:11px}
.spark-chg.up{color:#ff7676}
.spark-chg.dn{color:#4ddba0}
.spark-chg.fl{color:var(--txt3)}
.spark-date{color:var(--txt3);font-size:10px;margin-left:auto}
.mini-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:5px;
  max-height:120px;display:block;overflow:auto}
.mini-tbl th{color:var(--txt3);font-weight:500;text-align:left;padding:2px 6px 2px 0}
.mini-tbl td{padding:1.5px 6px 1.5px 0;color:var(--txt2)}
.no-data{font-size:11px;color:var(--txt3);background:rgba(255,171,91,.07);
  border:1px dashed rgba(255,171,91,.3);border-radius:8px;padding:8px 10px;line-height:1.6}
.grid{width:100%;border-collapse:collapse;font-size:11px}
.grid th{text-align:left;color:var(--txt3);font-weight:500;padding:4px 6px 4px 0;
  border-bottom:1px solid var(--line);white-space:nowrap}
.grid td{padding:4px 6px 4px 0;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.proj,.event{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
.proj-t{color:var(--txt);font-weight:600;line-height:1.5}
.proj-m{color:var(--txt3);font-size:10.5px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.event{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.ev-date{color:var(--txt3);font-size:10.5px;font-variant-numeric:tabular-nums}
.ev-t{flex:1 1 auto;color:var(--txt2);line-height:1.55;min-width:120px}
.rel-list{list-style:none;margin:0;padding:0;font-size:11.5px}
.rel-item{display:flex;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;align-items:baseline}
.rel-item:hover{background:rgba(77,141,255,.12)}
.rel-item .rt{font-size:10px;font-weight:650;white-space:nowrap}
.rel-item .rd{color:var(--txt2);line-height:1.5}
.src-line{font-size:11px;color:var(--txt2);padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.04);line-height:1.6}
.src-line a{color:#7aa9ff;text-decoration:none;font-size:10.5px}
.src-line a:hover{text-decoration:underline}
.src-note{font-size:10.5px;color:var(--txt3);line-height:1.6;margin-top:6px}
.quote{font-size:10.5px;color:var(--txt3);font-style:italic;margin-top:3px;
  border-left:2px solid var(--line2);padding-left:7px}
.src-chip{display:inline-block;font-size:9.5px;border-radius:5px;padding:1px 5px;
  border:1px solid var(--line2);color:var(--txt2);white-space:nowrap;margin-right:3px;
  background:rgba(255,255,255,.03);cursor:help}
.src-chip.tier-A{border-color:rgba(57,208,166,.6);color:#8ee6cc}
.src-chip.tier-B{border-color:rgba(77,141,255,.55);color:#9dc0ff}
.src-chip.tier-C{border-color:rgba(242,193,78,.5);color:#ffdf9a}
.src-chip.tier-D{border-color:rgba(255,107,107,.45);color:#ffa3a3}
.formula{font-family:"Consolas","Cascadia Mono",monospace;font-size:11px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;color:#a8c4f0;line-height:1.7;word-break:break-word}
.rel-ends{display:flex;gap:7px;flex-wrap:wrap}
.end{font-size:11px;background:rgba(255,255,255,.045);border:1px solid var(--line2);
  border-radius:8px;padding:4px 9px;cursor:pointer;color:var(--txt2)}
.end:hover{border-color:var(--acc);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------------- 层级表 ---------------- */
.tablemode{display:none;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);padding:11px 13px;max-height:58vh;overflow:auto}
.tablemode.show{display:block}
.tm-head{display:flex;gap:12px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.tm-head h2{font-size:14px;margin:0;font-weight:700}
.tm-note{font-size:11px;color:var(--txt3);line-height:1.6}
.tm-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
table.tm{width:100%;border-collapse:collapse;font-size:11px}
table.tm thead th{position:sticky;top:0;background:var(--panel2);color:var(--txt2);
  font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);
  white-space:nowrap;z-index:2}
table.tm td{padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.05);
  vertical-align:top;color:var(--txt2);line-height:1.6}
table.tm tr[data-node]{cursor:pointer}
table.tm tr[data-node]:hover td{background:rgba(77,141,255,.10)}
table.tm .tm-col{background:rgba(255,255,255,.025);color:var(--txt3);white-space:nowrap;
  border-right:1px solid var(--line);font-size:10.5px}
table.tm .tm-node{color:#eef3ff;font-weight:600}

/* ---------------- 页脚 ---------------- */
.foot{flex:0 0 auto;font-size:10.5px;color:var(--txt3);line-height:1.6;
  border-top:1px dashed var(--line);padding-top:7px}

/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
</style>

底体系替代", "required_criteria": ["node_present", "direction_verified", "evidence_linked"], "priority": "P2"}]}, "forbidden": [{"id": "F01", "from": "N_PRIMARY", "to": "N_APP_FOOTWEAR", "wrong_types": ["conversion", "blend"], "why": "SBS 不会直接变成『鞋』。正确链条是 SBS →(blend) TPR 鞋底料 →(processing) 鞋底 →(application) 鞋。把终端用途写成转化产品是最常见的错误。", "worksheet": "终端用途只能通过 material→application 的 application 边呈现"}, {"id": "F02", "from": "N_PRIMARY", "to": "N_APP_ROAD", "wrong_types": ["conversion", "blend", "processing"], "why": "SBS→公路不是直接关系；必须经改性沥青与路面材料两层材料节点。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F03", "from": "N_SM", "to": "N_PRIMARY", "wrong_types": ["substitution"], "why": "苯乙烯是 SBS 的组成单体，不是替代品；替代关系只允许发生在用途层（如 SIS/SEBS/TPU 与 SBS 争夺同一应用）。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F04", "from": "N_BD", "to": "N_PRIMARY", "wrong_types": ["byproduct", "coproduction"], "why": "丁二烯进入 SBS 是主原料转化；把主原料写成副产会误导成本归因。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F05", "from": "N_PYREXTRACT", "to": "N_PRIMARY", "wrong_types": ["conversion"], "why": "裂解汽油不能直接制 SBS；C8 抽提只能得到苯乙烯，仍需聚合。不得把不同工艺路线揉成一条链。", "worksheet": "C8 抽提路线需经 N_SM 节点"}, {"id": "F06", "from": "N_SEBS", "to": "N_PRIMARY", "wrong_types": ["conversion"], "why": "反向不成立：SBS 可以加氢制 SEBS，但 SEBS 不会脱氢回到 SBS（工业上无此路线）。方向必须 from=SBS to=SEBS。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F07", "from": "N_TPR", "to": "N_PRIMARY", "wrong_types": ["conversion", "processing"], "why": "TPR 料是 SBS 的配方复合物，不能反向被写成『TPR 转化制 SBS』。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F08", "from": "N_MODIFIED_ASPH", "to": "N_ASPHALT", "wrong_types": ["conversion"], "why": "改性沥青拆解回基质沥青不是生产工艺；若研究『废料回收/沥青再生』应另立 route 节点。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F09", "from": "N_BZ", "to": "N_SM", "wrong_types": ["conversion"], "why": "纯苯不能直接转化为苯乙烯；必须先经乙苯（烷基化+脱氢）。把两段合成一步是常见画法错误。", "worksheet": "必须经 N_EB 节点，且分段单耗不得合并成分段环。"}, {"id": "F11", "from": "N_HMPSA", "to": "N_APP_PACKAGING", "wrong_types": ["conversion", "blend"], "why": "热熔胶→包装是终端应用，不是转化；且部分包装用胶先制胶带再应用，节点口径须区分。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F12", "from": "N_TPR", "to": "N_APP_FOOTWEAR", "wrong_types": ["conversion", "blend", "processing"], "why": "TPR 料必须先成型为鞋底部件(starter)，再进入整鞋；跳到终端会把制品层抹掉。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F13", "from": "N_ASPHALT", "to": "N_APP_ROAD", "wrong_types": ["conversion", "blend", "processing"], "why": "未改性基质沥青不构成 SBS 链路的终端应用路径；SBS 的价值必须经由改性沥青体现。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F14", "from": "N_SEBS", "to": "N_HMPSA", "wrong_types": ["substitution"], "why": "SEBS 与 SBS 在热熔胶中主要为配方互补/替代同侪关系，且 SEBS 的市场替代点主要是鞋材/卫材与改性料；不能在热熔胶处无证据地建立替代边。", "worksheet": "按 references/02-relation-taxonomy.md 的判定树重建：先确认关系类型，再确认方向与列号。"}, {"id": "F10", "from": "N_C8A", "to": "N_BZ", "wrong_types": ["copy"], "why": "C8 芳烃（二甲苯）→ 纯苯 不是常规转化关系：TDA 单元进料为甲苯与 C9 芳烃，而不是 C8；苯的主链来源应是重整生成油/BTX 经抽提（N_BTX→N_BZ）。保留为疑点边并标 typical=false，禁止把它当作主链单耗使用。", "worksheet": "若研究甲苯歧化路线，请单独建立 Toluene / C9 芳烃节点，不要复用 C8 芳烃节点。"}], "layout": {"canvas": {"w": 3263.0, "h": 836.0}, "columns": [{"col": -6, "x": 26, "w": 192, "label_x": 122.0}, {"col": -5, "x": 290, "w": 200.0, "label_x": 390.0}, {"col": -4, "x": 562.0, "w": 268, "label_x": 696.0}, {"col": -2, "x": 902.0, "w": 192, "label_x": 998.0}, {"col": -1, "x": 1166.0, "w": 192, "label_x": 1262.0}, {"col": 0, "x": 1430.0, "w": 192, "label_x": 1526.0}, {"col": 1, "x": 1694.0, "w": 268, "label_x": 1828.0}, {"col": 2, "x": 2034.0, "w": 268, "label_x": 2168.0}, {"col": 3, "x": 2374.0, "w": 268, "label_x": 2508.0}, {"col": 4, "x": 2714.0, "w": 241.5, "label_x": 2834.8}, {"col": 5, "x": 3027.5, "w": 209.5, "label_x": 3132.2}], <script>/* chain_graph.js — 产业链图谱交互运行时
 * 约定：坐标全部来自 window.CHAIN_DATA.layout（Python 端 chain_layout.py 预算），
 *       本文件只负责绘制、交互与派生查询，不再自行推算行列，确保与校验端一致。
 * 暴露 window.CHAIN 供自动化测试与外部脚本调用。
 */
(function () {
  "use strict";

  var D = window.CHAIN_DATA || {};
  var LAY = D.layout || { canvas: { w: 1000, h: 600 }, nodes: [], edges: [], columns: [] };
  var NODES = D.nodes || [];
  var RELS = D.relations || [];
  var SRC = {};
  (D.sources || []).forEach(function (s) { SRC[s.id] = s; });
  var NODE_BY_ID = {};
  NODES.forEach(function (n) { NODE_BY_ID[n.id] = n; });
  var BOX = {};
  (LAY.nodes || []).forEach(function (b) { BOX[b.id] = b; });

  var SVGNS = "http://www.w3.org/2000/svg";
  var state = {
    k: 1, tx: 0, ty: 0,
    selected: null,
    selectedList: [],
    hovered: null,
    related: {},
    relFilter: "",
    routeFilter: "",
    typeFilter: "",
    tableMode: false,
    sbOpen: true,
    activeTab: "node",
    covCollapsed: false
  };

  // ---------------------------------------------------------------- 工具
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    return e;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function fmt(v, d) {
    if (v == null || v === "") return "—";
    if (typeof v !== "number") return String(v);
    var s = d == null ? 2 : d;
    return v.toFixed(s).replace(/\.?0+$/, "");
  }
  function val(v) {
    return v == null || v === "" ? "—" : String(v);
  }
  function pct(a, b) { return b ? (a / b * 100) : 0; }

  var TYPE_META = D.relTypeMeta || {};
  function typeZh(t) { return (TYPE_META[t] || {}).zh || t || "关系"; }
  function typeColor(t) { return (TYPE_META[t] || {}).color || "#8899aa"; }
  var QS = D.quantStatusZh || {};
  function quantZh(s) { return QS[s] || s || "—"; }

  // ---------------------------------------------------------------- 视图变换
  var viewport = document.getElementById("viewport");
  var svg = document.getElementById("svg");
  var wrap = document.getElementById("canvasWrap");
  var CW = LAY.canvas ? LAY.canvas.w : 1600;
  var CH = LAY.canvas ? LAY.canvas.h : 800;

  function applyView() {
    viewport.setAttribute("transform",
      "translate(" + state.tx + "," + state.ty + ") scale(" + state.k + ")");
    updateMinimapView();
    var z = document.getElementById("zoomLevel");
    if (z) z.textContent = Math.round(state.k * 100) + "%";
  }
  var MIN_READABLE_K = 0.74;    // 可读下限：低于此值文字会糊
  var FIT_PAD = 22;
  // 「适应」：整图完整落在视口内；只有当缩放低于可读下限时才改用可读比例（此时可横向拖拽）
  function fit() {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var kAll = Math.min((r.width - FIT_PAD * 2) / CW, (r.height - FIT_PAD * 2) / CH);
    if (kAll >= MIN_READABLE_K) {
      state.k = Math.min(kAll, 2.2);
      state.tx = (r.width - CW * state.k) / 2;
      state.ty = (r.height - CH * state.k) / 2;
    } else {
      state.k = MIN_READABLE_K;
      // 聚焦目标品种列，其余部分可拖拽查看
      var focus = (LAY.columns || []).filter(function (c) {
        return (D.nodes || []).some(function (n) { return n.column === c.col && n.node_role === "target"; });
      })[0];
      var fx = focus ? focus.label_x : CW / 2;
      state.tx = r.width / 2 - fx * state.k;
      state.ty = (r.height - CH * state.k) / 2;
    }
    clampView();
    applyView();
  }
  function clampView() {
    var r = svg.getBoundingClientRect();
    if (!r.width) return;
    var w = CW * state.k, h = CH * state.k;
    if (w <= r.width) state.tx = (r.width - w) / 2;
    else state.tx = Math.min(FIT_PAD * 0.5, Math.max(r.width - w - FIT_PAD * 0.5, state.tx));
    if (h <= r.height) state.ty = (r.height - h) / 2;
    else state.ty = Math.min(FIT_PAD * 0.5, Math.max(r.height - h - FIT_PAD * 0.5, state.ty));
  }
  function fitAll() {                            // 「总览」：强制缩到全部可见
    var r = svg.getBoundingClientRect();
    var k = Math.min((r.width - 36) / CW, (r.height - 36) / CH);
    state.k = Math.max(0.12, Math.min(k, 2.2));
    state.tx = (r.width - CW * state.k) / 2;
    state.ty = (r.height - CH * state.k) / 2;
    applyView();
  }
  function zoomAt(factor, cx, cy) {
    var r = svg.getBoundingClientRect();
    if (cx == null) { cx = r.width / 2; cy = r.height / 2; }
    var k2 = Math.max(0.12, Math.min(4, state.k * factor));
    var scale = k2 / state.k;
    state.tx = cx - (cx - state.tx) * scale;
    state.ty = cy - (cy - state.ty) * scale;
    state.k = k2;
    clampView();
    applyView();
  }

  // ---------------------------------------------------------------- 绘制：泳道
  function drawLanes() {
    var g = document.getElementById("laneLayer");
    g.innerHTML = "";
    (LAY.columns || []).forEach(function (c, i) {
      var colMeta = (D.columns || []).filter(function (x) { return x.col === c.col; })[0] || {};
      var band = sv("rect", {
        x: c.x - 12, y: 6, width: c.w + 24, height: CH - 12,
        rx: 14, class: "lane-band" + (i % 2 ? " odd" : "")
      });
      g.appendChild(band);
      var t = sv("text", {
        x: c.label_x, y: 26, class: "lane-title", "text-anchor": "middle"
      });
      t.textContent = colMeta.label || ("第 " + c.col + " 列");
      g.appendChild(t);
      var sub = sv("text", {
        x: c.label_x, y: 42, class: "lane-sub", "text-anchor": "middle"
      });
      var cnt = (LAY.nodes || []).filter(function (b) {
        var n = NODE_BY_ID[b.id];
        return n && n.column === c.col;
      }).length;
      sub.textContent = cnt + " 个节点";
      g.appendChild(sub);
    });
  }

  // ---------------------------------------------------------------- 绘制：箭头
  function drawDefs() {
    var defs = document.getElementById("defs");
    defs.innerHTML = "";
    var types = {};
    RELS.forEach(function (r) { types[r.relation_type] = typeColor(r.relation_type); });
    Object.keys(types).forEach(function (t) {
      var m = sv("marker", {
        id: "arw-" + t, viewBox: "0 0 10 10", refX: "9", refY: "5",
        markerWidth: "6.5", markerHeight: "6.5", orient: "auto-start-reverse"
      });
      m.appendChild(sv("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: types[t] }));
      defs.appendChild(m);
    });
    var m2 = sv("marker", {
      id: "arw-dim", viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "6.5", markerHeight: "6.5", orient: "auto-start-reverse"
    });
    m2.appendChild(sv("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#5a677d" }));
    defs.appendChild(m2);
  }

  // ---------------------------------------------------------------- 绘制：边
  var EDGE_ELS = {};
  function drawEdges() {
    var g = document.getElementById("edgeLayer");
    g.innerHTML = "";
    EDGE_ELS = {};
    (LAY.edges || []).forEach(function (e) {
      var rel = RELS.filter(function (r) { return r.id === e.id; })[0] || {};
      var typ = rel.relation_type || "conversion";
      var p = sv("path", {
        d: e.d, class: "edge", "data-id": e.id, "data-type": typ,
        stroke: typeColor(typ),
        "stroke-dasharray": dashFor(rel, typ),
        "marker-end": "url(#arw-" + typ + ")"
      });
      if (rel.relation_type === "substitution") p.setAttribute("marker-start", "url(#arw-" + typ + ")");
      p.addEventListener("click", function (ev) {
        ev.stopPropagation(); selectRelation(e.id);
      });
      p.addEventListener("mouseenter", function () {
        p.classList.add("edge-hi");
        showTip(ev0(ev0), rel, e);
      });
      p.addEventListener("mouseleave", function () {
        p.classList.remove("edge-hi"); hideTip();
      });
      g.appendChild(p);
      EDGE_ELS[e.id] = p;
    });
  }
  function ev0(e) { return e; }
  function dashFor(rel, typ) {
    if (typ === "substitution") return "7 5";
    if (typ === "blend" || typ === "processing") return "2 4";
    if (typ === "byproduct") return "10 4";
    if (typ === "route_option") return "5 4";
    return null;
  }

  // 标签：只在缩放足够大或高亮时显示，避免糊成一片
  function drawLabels() {
    var g = document.getElementById("labelLayer");
    g.innerHTML = "";
    (LAY.edges || []).forEach(function (e) {
      var rel = RELS.filter(function (r) { return r.id === e.id; })[0] || {};
      var q = rel.quant || {};
      var txt = q.from_per_to != null ? (fmt(q.from_per_to, 3) + " t/t") : "";
      if (!txt) return;
      var t = sv("text", {
        x: e.label_x, y: e.label_y - 3, class: "edge-label", "text-anchor": "middle",
        "data-for": e.id
      });
      t.textContent = txt;
      g.appendChild(t);
    });
  }

  // ---------------------------------------------------------------- 绘制：节点
  var NODE_ELS = {};
  function nodeClass(n) { return "node k-" + (n.node_class || "commodity") + " role-" + (n.node_role || "x"); }
  function drawNodes() {
    var g = document.getElementById("nodeLayer");
    g.innerHTML = "";
    NODE_ELS = {};
    (LAY.nodes || []).forEach(function (b) {
      var n = NODE_BY_ID[b.id];
      if (!n) return;
      var grp = sv("g", { class: nodeClass(n), "data-id": n.id, transform: "translate(" + b.x + "," + b.y + ")" });
      grp.appendChild(sv("rect", { class: "node-bg", x: 0, y: 0, width: b.w, height: b.h, rx: 11 }));
      grp.appendChild(sv("rect", { class: "node-strip", x: 0, y: 0, width: 4.5, height: b.h, rx: 2 }));

      var title = n.name || n.id;
      var maxCh = Math.floor((b.w - 34) / 12.5);
      if (title.length > maxCh) {
        var cut = title.slice(0, maxCh - 1) + "…";
        grp.appendChild(mkText(13, 10, 22, cut, "node-title"));
        // 悬停走原生 title
        grp.appendChild(sv("title")).textContent = title;
      } else {
        grp.appendChild(mkText(13, 10, 22, title, "node-title"));
      }
      var sub = (n.cas && n.cas.value) ? ("CAS " + n.cas.value)
        : (n.node_class === "material" ? "材料" : n.node_class === "application" ? "终端应用" : "化学品");
      grp.appendChild(mkText(10.5, 10.5, 38, sub, "node-sub"));

      var flags = n.missing_flags || [];
      if (flags.length) {
        grp.appendChild(mkText(9.5, b.w - 10, b.h - 7, "⚠ " + flags.length, "node-flag"));
        var tt = sv("title");
        tt.textContent = "缺口：" + flags.join("、");
        grp.appendChild(tt);
      } else {
        grp.appendChild(mkText(9.5, b.w - 10, b.h - 7, "✓", "node-ok"));
      }

      grp.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (ev.ctrlKey || ev.metaKey || ev.shiftKey) addMulti(n.id);
        else selectNode(n.id);
      });
      grp.addEventListener("mouseenter", function () { state.hovered = n.id; highlightPath(n.id); });
      grp.addEventListener("mouseleave", function () { state.hovered = null; highlightPath(state.selected); });
      g.appendChild(grp);
      NODE_ELS[n.id] = grp;
    });
  }
  function mkText(size, x, y, txt, cls) {
    var t = sv("text", { x: x, y: y, class: cls, "font-size": size });
    t.textContent = txt;
    return t;
  }

  // ---------------------------------------------------------------- 上下游高亮
  function ancestors(id, seen, out) {
    seen = seen || {}; out = out || {};
    RELS.forEach(function (r) {
      if (r.to === id && r.relation_type !== "substitution" && !seen[r.from]) {
        seen[r.from] = 1; out[r.from] = 1;
        ancestors(r.from, seen, out);
      }
    });
    return out;
  }
  function descendants(id, seen, out) {
    seen = seen || {}; out = out || {};
    RELS.forEach(function (r) {
      if (r.from === id && r.relation_type !== "substitution" && !seen[r.to]) {
        seen[r.to] = 1; out[r.to] = 1;
        descendants(r.to, seen, out);
      }
    });
    return out;
  }
  function highlightPath(id) {
    Object.keys(NODE_ELS).forEach(function (k) {
      NODE_ELS[k].classList.remove("up", "down", "selected", "dim");
    });
    Object.keys(EDGE_ELS).forEach(function (k) {
      EDGE_ELS[k].classList.remove("up", "down", "edge-hi", "dim");
    });
    if (!id) return;
    var up = ancestors(id, {}, {});
    var dn = descendants(id, {}, {});
    state.related = { up: up, down: dn };
    Object.keys(NODE_ELS).forEach(function (k) {
      if (k === id) NODE_ELS[k].classList.add("selected");
      else if (up[k]) NODE_ELS[k].classList.add("up");
      else if (dn[k]) NODE_ELS[k].classList.add("down");
      else NODE_ELS[k].classList.add("dim");
    });
    RELS.forEach(function (r) {
      var p = EDGE_ELS[r.id];
      if (!p) return;
      if (r.from === id || r.to === id || (up[r.from] && up[r.to]) || (dn[r.from] && dn[r.to])) {
        p.classList.add(up[r.from] !== undefined || r.from === id ? "up" : "down");
      } else p.classList.add("dim");
    });
  }

  // ---------------------------------------------------------------- 侧栏
  function sbShow(tab) {
    state.sbOpen = true;
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sbOpen").classList.remove("show");
    document.querySelectorAll(".sb-tab").forEach(function (b) {
      b.classList.toggle("active", b.dataset.tab === tab);
    });
    state.activeTab = tab;
  }
  function sbHide() {
    state.sbOpen = false;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sbOpen").classList.add("show");
  }

  function priceSeriesFor(nodeId) {
    var ps = (D.prices && D.prices.series) || [];
    return ps.filter(function (s) { return s.node_id === nodeId; })[0] || null;
  }
  function entsFor(nodeId) {
    return (D.enterprises || []).filter(function (e) {
      return (e.nodes || []).indexOf(nodeId) >= 0 || e.node_id === nodeId;
    });
  }
  function projsFor(nodeId) {
    return (D.projects || []).filter(function (p) {
      return (p.node_ids || []).indexOf(nodeId) >= 0 || p.node_id === nodeId;
    });
  }
  function eventsFor(nodeId) {
    return (D.events || []).filter(function (e) {
      return (e.node_ids || []).indexOf(nodeId) >= 0 || e.node_id === nodeId;
    });
  }
  function relsFor(nodeId) {
    return RELS.filter(function (r) { return r.from === nodeId || r.to === nodeId; });
  }

  function sparkline(series, w, h) {
    if (!series || !series.points || !series.points.length) {
      return '<div class="no-data">该节点暂无公开价格序列（已登记为价格缺口，不做估算）</div>';
    }
    var pts = series.points;
    var vs = pts.map(function (p) { return p.price; });
    var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
    var span = (mx - mn) || 1;
    var dx = w / Math.max(1, pts.length - 1);
    var d = pts.map(function (p, i) {
      return (i ? "L" : "M") + (i * dx).toFixed(1) + " " + (h - (p.price - mn) / span * (h - 8) - 4).toFixed(1);
    }).join(" ");
    var area = d + " L " + w + " " + h + " L 0 " + h + " Z";
    var last = pts[pts.length - 1];
    var first = pts[0];
    var chg = first.price ? (last.price - first.price) / first.price * 100 : 0;
    var cls = chg > 0 ? "up" : chg < 0 ? "dn" : "fl";
    var html = '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      '<path class="spark-area" d="' + area + '"></path>' +
      '<path class="spark-line" d="' + d + '"></path></svg>' +
      '<div class="spark-meta">' +
      '<span class="spark-last">' + fmt(last.price, 2) + '</span>' +
      '<span class="spark-unit">' + esc(series.unit || "") + '</span>' +
      '<span class="spark-chg ' + cls + '">' + (chg >= 0 ? "+" : "") + chg.toFixed(2) + '%</span>' +
      '<span class="spark-date">' + esc(last.date) + '</span></div>';
    html += '<table class="mini-tbl"><thead><tr><th>日期</th><th>价格</th></tr></thead><tbody>' +
      pts.slice().reverse().map(function (p) {
        return "<tr><td>" + esc(p.date) + "</td><td>" + fmt(p.price, 2) + "</td></tr>";
      }).join("") + "</tbody></table>";
    if (series.basis) html += '<div class="src-note">口径：' + esc(series.basis) + '</div>';
    if (series.source_id && SRC[series.source_id]) html += srcChip(series.source_id);
    return html;
  }

  function srcChip(sid) {
    var s = SRC[sid] || {};
    var tier = s.evidence_tier || s.tier || "?";
    return '<span class="src-chip tier-' + esc(tier) + '" title="' + esc((s.title || "") + " " + (s.url || "")) +
      '">' + esc(sid) + " · " + esc(tier) + "级</span>";
  }

  function renderNode(nid) {
    var n = NODE_BY_ID[nid];
    if (!n) return;
    var ev = n.evidence || [];
    var h = [];
    h.push('<div class="sb-title">' + esc(n.name) + "</div>");
    h.push('<div class="sb-badges">' +
      '<span class="bd bd-' + esc(n.node_class) + '">' +
      ({ commodity: "化学品", material: "材料", application: "终端应用" }[n.node_class] || n.node_class) + "</span>" +
      '<span class="bd">' + esc(n.stage || ("第 " + n.column + " 列")) + "</span>" +
      (n.segment ? '<span class="bd">' + esc(n.segment) + "</span>" : "") +
      "</div>");
    h.push('<table class="kv">');
    h.push('<tr><th>CAS</th><td>' + esc((n.cas && n.cas.value) || "不适用") +
      ((n.cas && n.cas.status) ? ' <span class="tiny">[' + esc(n.cas.status) + "]</span>" : "") + "</td></tr>");
    if (n.hs_code) h.push("<tr><th>HS 编码</th><td>" + esc(n.hs_code) + "</td></tr>");
    if (n.aliases && n.aliases.length) h.push("<tr><th>常见名称</th><td>" + esc(n.aliases.join(" / ")) + "</td></tr>");
    if (n.specs && n.specs.length) h.push("<tr><th>规格</th><td>" + esc(n.specs.join("；")) + "</td></tr>");
    h.push("<tr><th>计量单位</th><td>" + esc(n.unit || "—") + "</td></tr>");
    if (n.missing_flags && n.missing_flags.length)
      h.push('<tr><th>缺口标记</th><td><span class="warn">' + esc(n.missing_flags.join("、")) + "</span></td></tr>");
    h.push("</table>");
    if (n.notes) h.push('<div class="sb-note">' + esc(n.notes) + "</div>");

    // 价格
    h.push('<div class="sb-sec">价格走势</div>');
    h.push('<div class="spark-wrap">' + sparkline(priceSeriesFor(nid), 300, 70) + "</div>");

    // 企业 / 产能
    var es = entsFor(nid);
    h.push('<div class="sb-sec">主要企业与公开产能（' + es.length + "）</div>");
    if (es.length) {
      h.push('<table class="grid"><thead><tr><th>企业</th><th>产能</th><th>地区</th><th>来源</th></tr></thead><tbody>');
      es.forEach(function (e) {
        h.push("<tr><td>" + esc(e.name) + "</td><td>" + val(e.capacity) + " " + esc(e.capacity_unit || "") +
          "</td><td>" + val(e.region) + "</td><td>" + (e.source_id ? srcChip(e.source_id) : "—") + "</td></tr>");
      });
      h.push("</tbody></table>");
      var tot = es.reduce(function (a, e) { return a + (typeof e.capacity === "number" ? e.capacity : 0); }, 0);
      if (tot) h.push('<div class="src-note">已核验产能合计：' + fmt(tot, 1) + " " + esc(es[0].capacity_unit || "") + "（仅统计有来源的条目）</div>");
    } else h.push('<div class="no-data">暂无已核验的企业产能条目</div>');

    // 项目
    var ps2 = projsFor(nid);
    h.push('<div class="sb-sec">相关公开项目（' + ps2.length + "）</div>");
    if (ps2.length) {
      ps2.forEach(function (p) {
        h.push('<div class="proj"><div class="proj-t">' + esc(p.name) + "</div>" +
          '<div class="proj-m">' + esc(p.company || "") + " · " + esc(p.region || "") +
          " · " + esc(p.capacity || "") + " · " + esc(p.status || "") + " " + (p.source_id ? srcChip(p.source_id) : "") + "</div></div>");
      });
    } else h.push('<div class="no-data">暂无公开项目记录</div>');

    // 事件
    var evs = eventsFor(nid);
    h.push('<div class="sb-sec">产业事件（' + evs.length + "）</div>");
    if (evs.length) {
      evs.forEach(function (e) {
        h.push('<div class="event"><span class="ev-date">' + esc(e.date || "") + "</span>" +
          '<span class="ev-t">' + esc(e.title || e.summary || "") + "</span>" +
          (e.source_id ? srcChip(e.source_id) : "") + "</div>");
      });
    } else h.push('<div class="no-data">暂无事件记录</div>');

    // 关系
    var rs = relsFor(nid);
    h.push('<div class="sb-sec">产业链关系（' + rs.length + "）</div>");
    h.push('<ul class="rel-list">');
    rs.forEach(function (r) {
      var other = r.from === nid ? r.to : r.from;
      var dirw = r.from === nid ? "下游" : "上游";
      var on = NODE_BY_ID[other] ? NODE_BY_ID[other].name : other;
      h.push('<li class="rel-item" data-rel="' + esc(r.id) + '"><span class="rt" style="color:' +
        typeColor(r.relation_type) + '">' + esc(typeZh(r.relation_type)) + "</span>" +
        '<span class="rd">' + dirw + " · " + esc(on) + "</span></li>");
    });
    h.push("</ul>");

    // 证据
    h.push('<div class="sb-sec">节点证据（' + ev.length + "）</div>");
    if (ev.length) {
      ev.forEach(function (sid) {
        var s = SRC[sid];
        if (!s) { h.push('<div class="src-line">' + esc(sid) + "（来源表未登记）</div>"); return; }
        h.push('<div class="src-line">' + srcChip(sid) + " " + esc(s.title || "") +
          (s.url ? ' <a href="' + esc(s.url) + '" target="_blank" rel="noopener">链接</a>' : "") +
          (s.date ? ' <span class="tiny">' + esc(s.date) + "</span>" : "") +
          (s.key_quote ? '<div class="quote">“' + esc(s.key_quote) + '”</div>' : "") + "</div>");
      });
    } else h.push('<div class="no-data">该节点未登记证据（属缺口，须补齐后才能用于结论）</div>');

    document.getElementById("sbBody").innerHTML = h.join("");
    bindRelItems();
  }

  function bindRelItems() {
    document.querySelectorAll(".rel-item").forEach(function (li) {
      li.addEventListener("click", function () { selectRelation(li.dataset.rel); });
    });
  }

  function renderRelation(rid) {
    var r = RELS.filter(function (x) { return x.id === rid; })[0];
    if (!r) return;
    var q = r.quant || {};
    var a = NODE_BY_ID[r.from] || { name: r.from }, b = NODE_BY_ID[r.to] || { name: r.to };
    var h = [];
    h.push('<div class="sb-title">' + esc(typeZh(r.relation_type)) + "：" + esc(a.name) + " → " + esc(b.name) + "</div>");
    h.push('<div class="sb-badges"><span class="bd" style="border-color:' + typeColor(r.relation_type) +
      ';color:' + typeColor(r.relation_type) + '">' + esc(typeZh(r.relation_type)) + "</span>" +
      '<span class="bd">' + esc(r.id) + "</span>" +
      (r.family ? '<span class="bd">' + esc(r.family) + "</span>" : "") +
      (r.typical ? '<span class="bd">主流路线</span>' : '<span class="bd">并列路线</span>') + "</div>");
    h.push('<table class="kv">');
    h.push("<tr><th>工艺</th><td>" + val(r.process) + "</td></tr>");
    h.push("<tr><th>单耗</th><td>" + (q.from_per_to != null ? "<b>" + fmt(q.from_per_to, 3) + "</b> " + esc(q.from_unit || "") : '<span class="warn">缺口</span>') + "</td></tr>");
    if (q.from_per_to_range) h.push("<tr><th>常见区间</th><td>" + q.from_per_to_range[0] + " ~ " + q.from_per_to_range[1] + "</td></tr>");
    if (q.yield != null) h.push("<tr><th>收率</th><td>" + fmt(q.yield, 3) + "</td></tr>");
    h.push("<tr><th>量化状态</th><td>" + esc(quantZh(r.quant_status)) + "</td></tr>");
    h.push("<tr><th>口径</th><td>" + val(q.basis) + "</td></tr>");
    if (q.range_note) h.push("<tr><th>区间说明</th><td>" + esc(q.range_note) + "</td></tr>");
    if (q.basis_grade) h.push("<tr><th>口径等级</th><td>" + esc(q.basis_grade) + "</td></tr>");
    h.push("</table>");
    if (r.notes) h.push('<div class="sb-note">' + esc(r.notes) + "</div>");

    // 单耗来源与计算式
    h.push('<div class="sb-sec">单耗来源与计算口径</div>');
    h.push('<div class="formula">' + (q.from_per_to != null
      ? "1 t " + esc(b.name) + " × " + fmt(q.from_per_to, 3) + " t/" + "t = " + fmt(q.from_per_to, 3) + " t " + esc(a.name)
      : "未取得公开口径 → 登记为缺口，不估算") + "</div>");
    var ev = r.evidence || [];
    if (ev.length) {
      ev.forEach(function (sid) {
        var s = SRC[sid] || {};
        h.push('<div class="src-line">' + srcChip(sid) + " " + esc(s.title || "") +
          (s.url ? ' <a href="' + esc(s.url) + '" target="_blank" rel="noopener">链接</a>' : "") +
          (s.key_quote ? '<div class="quote">“' + esc(s.key_quote) + '”</div>' : "") + "</div>");
      });
    } else h.push('<div class="no-data">该关系未登记证据（缺口）</div>');

    // 端点跳转
    h.push('<div class="sb-sec">端点</div>');
    h.push('<div class="rel-ends">' +
      '<span class="end" data-node="' + esc(r.from) + '">↑ ' + esc(a.name) + "</span>" +
      '<span class="end" data-node="' + esc(r.to) + '">↓ ' + esc(b.name) + "</span></div>");

    h.push('<div class="sb-sec">可追溯性</div>');
    h.push('<div class="src-note">关系 ID ' + esc(r.id) + "；证据 " + ev.length + " 条；" +
      (r.quant_status === "missing" ? "量化缺口已显式登记，未用推算值填充。" : "量化口径见上表。") + "</div>");

    document.getElementById("sbBody").innerHTML = h.join("");
    document.querySelectorAll(".end").forEach(function (s) {
      s.addEventListener("click", function () { selectNode(s.dataset.node); });
    });
  }

  // ---------------------------------------------------------------- 价格联动
  function renderLinkage() {
    var ids = state.selectedList;
    var h = [];
    if (ids.length < 2) {
      h.push('<div class="sb-title">价格联动研究</div>');
      h.push('<div class="sb-note">按住 <b>Ctrl/⌘</b> 依次点击两个节点（或勾选后点“价格联动”），' +
        "这里会并排给出两条价格序列、区间统计与相关性。缺口序列会明确标注，不做插值。</div>");
      h.push('<div class="sb-sec">当前已选</div>');
      h.push('<div class="chips">' + (ids.length ? ids.map(function (i) {
        return '<span class="chip-sel">' + esc((NODE_BY_ID[i] || {}).name || i) + "</span>";
      }).join("") : '<span class="no-data">尚未选择</span>') + "</div>");
      document.getElementById("sbBody").innerHTML = h.join("");
      return;
    }
    var A = ids[0], B = ids[1];
    var na = NODE_BY_ID[A] || {}, nb = NODE_BY_ID[B] || {};
    var pa = priceSeriesFor(A), pb = priceSeriesFor(B);
    h.push('<div class="sb-title">' + esc(na.name) + " × " + esc(nb.name) + "</div>");
    h.push('<div class="sb-badges"><span class="bd">价格联动</span><span class="bd">' + ids.length + " 个节点</span></div>");

    var rows = [];
    [[A, na, pa, "①"], [B, nb, pb, "②"]].forEach(function (t) {
      var id = t[0], n = t[1], p = t[2], tag = t[3];
      h.push('<div class="sb-sec">' + tag + " " + esc(n.name) + "（" + esc(n.stage || "") + "）</div>");
      h.push('<div class="spark-wrap">' + sparkline(p, 300, 64) + "</div>");
      if (p && p.points && p.points.length) {
        var vs = p.points.map(function (x) { return x.price; });
        rows.push({ id: id, name: n.name, pts: p.points, unit: p.unit });
        h.push('<table class="kv"><tr><th>区间高/低</th><td>' + fmt(Math.max.apply(null, vs), 2) + " / " +
          fmt(Math.min.apply(null, vs), 2) + " " + esc(p.unit || "") + "</td></tr>" +
          "<tr><th>样本点</th><td>" + vs.length + " 个</td></tr></table>");
      } else {
        rows.push({ id: id, name: n.name, pts: null, unit: null });
      }
    });

    if (rows.length === 2 && rows[0].pts && rows[1].pts) {
      // 按日期对齐求相关性
      var ma = {}, mb = {};
      rows[0].pts.forEach(function (p) { ma[p.date] = p.price; });
      rows[1].pts.forEach(function (p) { mb[p.date] = p.price; });
      var common = Object.keys(ma).filter(function (d) { return mb[d] != null; }).sort();
      h.push('<div class="sb-sec">对齐与相关性</div>');
      if (common.length >= 4) {
        var xs = common.map(function (d) { return Math.log(ma[d]); });
        var ys = common.map(function (d) { return Math.log(mb[d]); });
        var mx = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
        var my = ys.reduce(function (a, b) { return a + b; }, 0) / ys.length;
        var cov = 0, vx = 0, vy = 0;
        for (var i = 0; i < xs.length; i++) {
          cov += (xs[i] - mx) * (ys[i] - my); vx += Math.pow(xs[i] - mx, 2); vy += Math.pow(ys[i] - my, 2);
        }
        var corr = (vx && vy) ? cov / Math.sqrt(vx * vy) : 0;
        var el2 = Math.pow(ys[ys.length - 1] / ys[0], 1 / Math.max(1, common.length - 1)) - 1;
        h.push('<table class="kv">' +
          "<tr><th>共同交易日</th><td>" + common.length + " 个（" + common[0] + " ~ " + common[common.length - 1] + "）</td></tr>" +
          "<tr><th>对数价格相关系数</th><td><b>" + corr.toFixed(3) + "</b></td></tr>" +
          '<tr><th>估算弹性</th><td>' + (vx ? (cov / vx).toFixed(3) : "—") + "</td></tr>" +
          "<tr><th>口径说明</th><td>仅在共同交易日上计算；样本量 " + common.length +
          " 点，<b>不足以判定因果关系</b>，只能作为方向性参考。</td></tr></table>");
        h.push('<div class="src-note">本页不生成价差/价差率结论，也不做跨规格、跨区域的价格拼接；' +
          "如需价差研究请使用同一口径的现货序列。</div>");
      } else {
        h.push('<div class="no-data">共同交易日不足 4 个，无法计算相关性。</div>');
      }
    }

    h.push('<div class="sb-sec">缺口说明</div>');
    var missing = [];
    if (!pa) missing.push(na.name + "：无价格序列");
    // 保持简洁
    h.push('<div class="src-note">' + (missing.length ? missing.join("；") + "，已按缺口登记。" :
      "两条序列均有公开数据；如需更长历史请按 sources 中的入口自行补充，本图不回溯补值。") + "</div>");

    document.getElementById("sbBody").innerHTML = h.join("");
  }

  // ---------------------------------------------------------------- 覆盖面板
  function renderCoverage() {
    var cov = D.coverage || {};
    var ov = cov.overall || {};
    var rate = ov.rate || 0;
    var C = 2 * Math.PI * 50;
    var fg = document.getElementById("gaugeFg");
    fg.setAttribute("stroke-dasharray", C);
    fg.setAttribute("stroke-dashoffset", C * (1 - rate / 100));
    fg.setAttribute("class", "gauge-fg " + (rate >= 90 ? "good" : rate >= 70 ? "mid" : "bad"));
    document.getElementById("gaugeTxt").textContent = rate.toFixed(1) + "%";
    document.getElementById("gaugeNote").innerHTML =
      "按开工前冻结的核心清单计算：<b>" + (ov.passed || 0) + "/" + (ov.total || 0) + "</b> 项达标";

    var cards = [];
    function card(k, v, s) {
      return '<div class="cov-card"><div class="k">' + k + '</div><div class="v">' +
        v + (s ? "<small>" + s + "</small>" : "") + "</div></div>";
    }
    var nodesC = cov.nodes || {}, relsC = cov.relations || {};
    cards.push(card("核心节点", (nodesC.passed || 0) + "/" + (nodesC.total || 0),
      (nodesC.rate != null ? nodesC.rate.toFixed(0) + "%" : "")));
    cards.push(card("核心关系", (relsC.passed || 0) + "/" + (relsC.total || 0),
      (relsC.rate != null ? relsC.rate.toFixed(0) + "%" : "")));
    var byP = nodesC.by_priority || {};
    var pTxt = Object.keys(byP).sort().map(function (p) {
      return p + " " + byP[p].passed + "/" + byP[p].total;
    }).join("  ");
    cards.push(card("节点优先级", pTxt || "—", ""));
    var gaps = (D.nodes || []).reduce(function (a, n) { return a + ((n.missing_flags || []).length ? 1 : 0); }, 0);
    cards.push(card("带缺口标记节点", gaps, "/ " + (D.nodes || []).length));
    cards.push(card("价格序列", ((D.prices && D.prices.series) || []).length, "条"));
    cards.push(card("证据来源", (D.sources || []).length, "条"));
    document.getElementById("covCards").innerHTML = cards.join("");

    // 缺口列表
    var fail = [];
    (nodesC.detail || []).forEach(function (d) {
      if (!d.pass) fail.push('<div class="gap-i">节点 ' + esc(d.core_id || "") + " " + esc(d.label || "") +
        "：缺 " + esc((d.failed || []).join("/")) + "</div>");
    });
    (relsC.detail || []).forEach(function (d) {
      if (!d.pass) fail.push('<div class="gap-i">关系 ' + esc(d.core_id || "") + " " + esc(d.label || "") +
        "：" + esc((d.failed || []).join("/")) + "</div>");
    });
    document.getElementById("covGaps").innerHTML =
      '<div class="gap-h">未达标项（' + fail.length + "）：</div>" +
      (fail.length ? fail.slice(0, 8).join("") : '<div class="gap-i ok">全部达标</div>') +
      (fail.length > 8 ? '<div class="gap-i">… 其余 ' + (fail.length - 8) + " 项见 Excel 报告页</div>" : "");

    var core = D.core && D.core.meta ? D.core.meta : {};
    document.getElementById("covScope").innerHTML =
      "<b>计算口径：</b>" + esc(core.scope_statement || "覆盖完整度仅对预先冻结的核心节点/关系清单有效，不代表产业链全部可能节点。") +
      (core.frozen_at ? "<br><b>清单冻结时间：</b>" + esc(core.frozen_at) : "");
  }

  // ---------------------------------------------------------------- 筛选
  function applyFilters() {
    var t = state.typeFilter, fam = state.routeFilter, q = (document.getElementById("search").value || "").trim().toLowerCase();
    var keepNodes = {}, keepEdges = {};
    (LAY.edges || []).forEach(function (e) {
      var r = RELS.filter(function (x) { return x.id === e.id; })[0] || {};
      var okT = !t || r.relation_type === t;
      var okF = !fam || r.family === fam;
      if (okT && okF) { keepEdges[e.id] = 1; keepNodes[r.from] = 1; keepNodes[r.to] = 1; }
    });
    if (q) {
      var hit = {};
      NODES.forEach(function (n) {
        var hay = (n.name + " " + (n.aliases || []).join(" ") + " " + ((n.cas || {}).value || " ")).toLowerCase();
        if (hay.indexOf(q) >= 0) hit[n.id] = 1;
      });
      keepNodes = hit;
      keepEdges = {};
      (LAY.edges || []).forEach(function (e) {
        if (hit[e.from] || hit[e.to]) keepEdges[e.id] = 1;
      });
    }
    // 替代边没有方向，两端都要保留
    Object.keys(NODE_ELS).forEach(function (id) {
      var on = !Object.keys(keepNodes).length ? true : !!keepNodes[id];
      if (Object.keys(keepNodes).length) NODE_ELS[id].classList.toggle("filtered", !on);
      else NODE_ELS[id].classList.remove("filtered");
    });
    Object.keys(EDGE_ELS).forEach(function (id) {
      var on = !Object.keys(keepEdges).length ? true : !!keepEdges[id];
      if (Object.keys(keepEdges).length) EDGE_ELS[id].classList.toggle("filtered", !on);
      else EDGE_ELS[id].classList.remove("filtered");
    });
    document.getElementById("hint").textContent =
      (t || fam || q) ? ("筛选中：显示 " + Object.keys(keepEdges).length + " 条关系 / " + Object.keys(keepNodes).length + " 个节点（点“重置”清除）") :
        "滚轮缩放 · 拖拽平移 · 双击空白处复位";
  }

      }).slice(0, 8);
      drop.innerHTML = hits.length ? hits.map(function (n) {

      }).join("") : '<div class="sr-item empty">无匹配节点</div>';

  function focusNode(id) {
    var b = BOX[id];
    if (!b) return;
    var r = svg.getBoundingClientRect();
    state.k = Math.max(state.k, 0.85);
    state.tx = r.width / 2 - (b.x + b.w / 2) * state.k;
    state.ty = r.height / 2 - (b.y + b.h / 2) * state.k;
    applyView();
  }

  // ---------------------------------------------------------------- 缩放/平移
  function bindPanZoom() {
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    wrap.addEventListener("mousedown", function (e) {
      if (e.button !== 0) return;
      var t = e.target;
      if (t && t.closest && (t.closest(".node") || t.closest(".minimap-wrap") ||
          t.closest(".canvas-legend") || t.closest(".hint"))) return;
      dragging = true; sx = e.clientX; sy = e.clientY; ox = state.tx; oy = state.ty;
      svg.style.cursor = "grabbing";
      e.preventDefault();
    });
    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      state.tx = ox + (e.clientX - sx);
      state.ty = oy + (e.clientY - sy);
      clampView();
      applyView();
    });
    window.addEventListener("mouseup", function () { dragging = false; svg.style.cursor = "grab"; });
    svg.addEventListener("wheel", function (e) {
      e.preventDefault();
      var r = svg.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    svg.addEventListener("dblclick", function (e) {
      if (e.target.closest(".node")) return;
      fitAll();
    });
    svg.addEventListener("click", function (e) {
      if (e.target.closest(".node") || e.target.closest(".edge")) return;
    });
    document.getElementById("btnZoomIn").addEventListener("click", function () { zoomAt(1.2); });
    document.getElementById("btnZoomOut").addEventListener("click", function () { zoomAt(1 / 1.2); });
    document.getElementById("btnFit").addEventListener("click", fit);
    var bAll = document.getElementById("btnFitAll");
    if (bAll) bAll.addEventListener("click", fitAll);
    document.getElementById("btnReset").addEventListener("click", function () {
      state.typeFilter = ""; state.routeFilter = "";
      document.getElementById("search").value = "";
      document.getElementById("relSel").value = "";
      document.getElementById("routeSel").value = "";
      document.querySelectorAll("#typeChips .chip").forEach(function (c, i) { c.classList.toggle("active", i === 0); });
      applyFilters(); fit();
    });
  }

      "节点 " + NODES.length + " · 关系 " + RELS.length + " · 来源 " + (D.sources || []).length +
      "<br>离线单文件，无外链依赖";
    document.getElementById("foot").innerHTML =
      "数据口径：单耗与收率均标注化学计量/工业级/配方比等级；缺口一律登记不估算。" +
      " 覆盖完整度仅对预先冻结的核心清单有效，不代表该产业链全部可能节点与关系。";
  }

  // ---------------------------------------------------------------- 事件绑定
  function bindUI() {
    document.querySelectorAll(".sb-tab").forEach(function (b) {
      b.addEventListener("click", function () {
        var t = b.dataset.tab;
        sbShow(t);
        if (t === "node" && state.selected) renderNode(state.selected);
        else if (t === "rel") {
          var first = RELS[0];
          if (state.selected) {
            var rs = relsFor(state.selected);
            if (rs.length) renderRelation(rs[0].id);
            else if (first) renderRelation(first.id);
          } else if (first) renderRelation(first.id);
        } else renderLinkage();
      });
    });
    document.getElementById("sbClose").addEventListener("click", sbHide);
    document.getElementById("sbOpen").addEventListener("click", function () { sbShow(state.activeTab); });
    document.getElementById("btnTableMode").addEventListener("click", function () { setTableMode(!state.tableMode); });
    document.getElementById("btnCovToggle").addEventListener("click", function () {
      state.covCollapsed = !state.covCollapsed;
      document.getElementById("coverageBar").classList.toggle("collapsed", state.covCollapsed);
      setTimeout(fit, 240);
    });
    document.getElementById("btnPriceLink").addEventListener("click", function () {
      if (state.selectedList.length < 2) {
        // 若只选了一个，提示如何选第二个
        renderLinkage(); sbShow("link");
        return;
      }
      renderLinkage(); sbShow("link");
    });
    document.getElementById("relSel").addEventListener("change", function () {
      state.typeFilter = this.value; applyFilters();
    });
    document.getElementById("routeSel").addEventListener("change", function () {
      state.routeFilter = this.value; applyFilters();
    });
  }

  // ---------------------------------------------------------------- 初始化
  function init() {
    drawDefs();
    drawLanes();
    drawEdges();
    drawLabels();
    drawNodes();
    drawMinimap();
    drawLegend();
    renderCoverage();
    renderToolbar();
    renderTableMode();
    bindSearch();
    bindPanZoom();
    bindUI();
    renderHead();
    sbShow("node");
    // 默认子视图
    var firstNode = NODES.filter(function (n) { return n.node_role === "target"; })[0] || NODES[0];
    if (firstNode) { renderNode(firstNode.id); state.selected = firstNode.id; highlightPath(firstNode.id); }
    updateSelbar();
    setTimeout(fit, 60);
    window.addEventListener("resize", function () { setTimeout(fit, 80); });
    applyFilters();

    // 布局失败 → 主动降级
    if (D.layoutStatus && !D.layoutStatus.ok) {
      setTableMode(true);
      document.getElementById("tmNote").insertAdjacentHTML("beforeend",
        '<div class="warn">已自动切换到层级表：图谱仍可查看，但请先修复布局问题。</div>');
    }
  }

  // ---------------------------------------------------------------- 对外 API
  window.CHAIN = {
    selectNode: selectNode,
    selectRelation: selectRelation,
    addMulti: addMulti,
    setTableMode: setTableMode,
    fit: fit,
    fitAll: fitAll,
    zoom: zoomAt,
    focusNode: focusNode,
    state: state,
    counts: function () {
      return {
        nodes: Object.keys(NODE_ELS).length,
        edges: Object.keys(EDGE_ELS).length,
        dimmed: document.querySelectorAll(".node.dim").length,
        filtered: document.querySelectorAll(".node.filtered").length,
        filteredEdges: document.querySelectorAll(".edge.filtered").length
      };
    }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
