.note-box{border-left:4px solid var(--teal);background:#f0fdfa;padding:14px 16px;border-radius:0 12px 12px 0;font-size:13px;color:#134e4a}

.hr{height:1px;background:var(--line);margin:18px 0}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:12px}
.nowrap{white-space:nowrap}
.center{text-align:center}
.right{text-align:right}

}

/* ================= checklist ================= */
function allObligations(){
  const out = [];
  [["seller","销售方"],["buyer","买方"],["joint","双方"]].forEach(([k,label])=>{
    (CASE.obligations[k]||[]).forEach(o=>out.push({...o, group:label, groupKey:k}));
  });
  return out;
}
function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function renderChecklist(){
  const items = allObligations();
  const state = loadState();
  const groups = ["销售方","买方","双方"];
  let html = "";
  groups.forEach(g=>{
    const rows = items.filter(i=>i.group===g);
    if(!rows.length) return;
    html += `<div class="grp">${esc(g)} · ${rows.length} 项</div>`;
    rows.forEach(o=>{
      const s = state[o.id] || {};
      const status = s.status || "未开始";
      html += `
      <div class="ck ${status==="已完成"?"done":""}" data-id="${esc(o.id)}">
        <div class="box" role="checkbox" tabindex="0" aria-label="标记完成"></div>
        <div class="id">${esc(o.id)}</div>
        <div class="body">
          <div class="t">${esc(o.item)}</div>
          <div class="m"><b>依据</b> ${esc(o.basis)}　<b>留存</b> ${esc(o.retention)}　<b>备案</b> ${esc(o.filing)}　<b>时点</b> ${esc(o.timing)}</div>
        </div>
        <select class="st">${CK_STATES.map(x=>`<option ${x===status?"selected":""}>${x}</option>`).join("")}</select>
        <input class="note" placeholder="完成日期 / 备注" value="${esc(s.note||"")}">
      </div>`;
    });
  });
  return `
  <section id="checklist">
    ${secHead("Step 04","本单合规检查清单","可勾选、可保存（本机浏览器）、可导出；勾选结果可归入客户档案。")}
    <div class="card pad">
      <div class="prog"><div class="bar"><i id="bar"></i></div><div class="pct" id="pct">0%</div><div class="tiny" id="progText">0 / 0</div></div>
      <div id="ckList">${html}</div>
      <div class="actions">
        <button class="btn primary" id="exportJson">导出勾选结果（JSON）</button>
        <button class="btn" id="exportCsv">导出清单（CSV）</button>
        <button class="btn" id="copyPending">复制未完成项</button>
        <button class="btn ghost" id="resetCk">重置</button>
        <button class="btn ghost" id="printPage">打印 / 存 PDF</button>
      </div>
      <div class="tiny mt">勾选结果保存在本机浏览器（localStorage），不会上传；换电脑或清理缓存会丢失，重要节点请导出 JSON 归档。</div>
    </div>
  </section>`;
}
function refreshProgress(){
  const items = allObligations();
  const state = loadState();
  const done = items.filter(o=>(state[o.id]||{}).status==="已完成").length;
  const na = items.filter(o=>(state[o.id]||{}).status==="不适用").length;
  const total = items.length;
  const eff = Math.max(total-na,1);
  const pct = Math.round(done/eff*100);
  const bar = $("#bar"); if(bar) bar.style.width = pct+"%";
  const p1=$("#pct"); if(p1) p1.textContent = pct+"%";
  const p2=$("#progText"); if(p2) p2.textContent = `${done} / ${total} 已完成${na?`（不适用 ${na} 项）`:""}`;
  const tp=$("#topProg"); if(tp) tp.textContent = `${done}/${total}`;
}

function renderManual(){
  const rows = CASE.manual_confirm.map(m=>`
    <tr><td><b>${esc(m.item)}</b></td><td>${esc(m.why)}</td><td>${esc(m.who)}</td><td class="nowrap">${esc(m.deadline)}</td><td><span class="tag gray">☐ 待确认</span></td></tr>`).join("");
  return `
  <section id="manual">
    ${secHead("Step 10","必须由人确认的事项","以下 6 项机器不能替代。确认后才可对外出具判定或承诺。")}
    <div class="card pad"><div class="tbl-wrap"><table>
      <thead><tr><th>确认项</th><th>为什么必须人工确认</th><th>谁确认</th><th>截止</th><th>状态</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
  </section>`;
}

/* ================= app ================= */
function renderApp(){
  $("#app").innerHTML = renderHero() + renderIdentity() + renderVerdict() + renderBuyer()    + renderChecklist() + renderDocs() + renderRetention() + renderGaps()
    + renderCompare() + renderSources() + renderManual()
    + `<footer>
        <b>版本</b> v1.0 · 判定日 ${esc(CASE.meta.as_of)} · 案例 ${esc(CASE.meta.case_no)}<br>
        ${esc(CASE.meta.disclaimer)}<br>
        <span class="tiny">本页由 chem-sales-compliance 生成；数据源与条文见「法规索引」。PDF/打印：Ctrl/Cmd + P。</span>
      </footer>`;
  const bc = $("#brandCase"); if(bc) bc.textContent = CASE.meta.case_no;
  bind();
  refreshProgress();
}

/* ================= interactions ================= */
function bind(){
  // nav
  const secs = [
    ["top","概览"],["identity","产品身份"],["verdict","判定卡"],["buyer","买方资质"],
    ["checklist","合规清单"],["docs","证照"],["retention","留存备案"],["gaps","缺口话术"],
    ["compare","对照"],["sources","法规"],["manual","人工确认"]
  ];
  $("#navLinks").innerHTML = secs.map(([id,label])=>`<a href="#${id}" data-id="${id}">${label}</a>`).join("");
  const links = $$("#navLinks a");
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(a=>a.classList.toggle("active", a.dataset.id===e.target.id));
      }
    });
  }, {rootMargin:"-45% 0px -50% 0px", threshold:0.01});
  secs.forEach(([id])=>{ const el=document.getElementById(id); if(el) io.observe(el); });

  // product chips
  $$("#productChips .pchip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      $$("#productChips .pchip").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      const cp = CASE.cross_products.find(x=>x.cas===btn.dataset.cas);
      const panel = $("#altPanel");
      if(!cp){ panel.innerHTML=""; return; }
      if(cp.cas === CASE.product.cas){
        panel.innerHTML = `<div class="note-box mt"><b>已回到本单：</b>${esc(cp.name)}，CAS ${esc(cp.cas)}，判定为<b>${esc(cp.verdict)}</b>。本页结论对当前交易有效。</div>`;
        return;
      }
      panel.innerHTML = `
        <div class="preview">
          <h4>对照预览：${esc(cp.name)}（CAS ${esc(cp.cas)}）</h4>
          <div class="row"><b>判定</b><span>${esc(cp.verdict)}</span></div>
          <div class="row"><b>特殊名录</b><span>${esc(cp.flags)}</span></div>
          <div class="row"><b>买方要求</b><span>${esc(cp.buyer_req)}</span></div>
          <div class="row"><b>销售方要求</b><span>${esc(cp.seller_req)}</span></div>
          <div class="row"><b>运输</b><span>${esc(cp.transport)}</span></div>
          <div class="row"><b>备注</b><span>${esc(cp.note)}</span></div>
          <div class="mt"><span class="tag amber">仅对照预览，不改写本单《纯碱》结论</span></div>
        </div>`;
    });
  });

  // manual product check
  $("#manualCheck").addEventListener("click", ()=>{
    const name = $("#qName").value.trim() || "（未填名称）";
    const cas = $("#qCas").value.trim() || "（未填 CAS）";
    const form = $("#qForm").value.trim() || "（未填浓度/形态）";
    $("#manualOut").innerHTML = `
      <div class="warn-box">
        <b>自查提示（${esc(name)} / ${esc(cas)} / ${esc(form)}）：</b>
        该产品不在本页预置库中，<b>不能直接给出判定</b>。请按以下顺序核验：
        ① 在《危险化学品目录（2015 版）》按品名、别名、CAS 三路检索，留存截图；
        ② 核对是否列入剧毒、易制爆、易制毒、重点监管、特别管控名录；
        ③ 调取本批 SDS，按 GHS 分类比对危化品确定原则；
        ④ 若危险特性不确定，按 60 号令做鉴定分类后再交易；
        ⑤ 结论齐备前，不报价、不承诺交期。
      </div>`;
  });

  // buyer filters
  $$("#buyerFilters .fbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      $$("#buyerFilters .fbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      const f = b.dataset.f;
      $$("#buyerList .bcard").forEach(card=>{
        card.style.display = (f==="all" || card.dataset.status===f) ? "" : "none";
      });
    });
  });

  // checklist
  const state = loadState();
  $$("#ckList .ck").forEach(row=>{
    const id = row.dataset.id;
    const sel = row.querySelector("select.st");
    const note = row.querySelector("input.note");
    const box = row.querySelector(".box");
    const cur = state[id] || {};
    sel.value = cur.status || "未开始";
    note.value = cur.note || "";
    const sync = ()=>{
      state[id] = {status: sel.value, note: note.value};
      saveState(state);
      row.classList.toggle("done", sel.value==="已完成");
      refreshProgress();
    };
    sel.addEventListener("change", sync);
    note.addEventListener("change", sync);
    const toggle = ()=>{
      sel.value = (sel.value==="已完成") ? "未开始" : "已完成";
      sync();
    };
    box.addEventListener("click", toggle);
    box.addEventListener("keydown", (e)=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); }});
  });

  $("#exportJson").addEventListener("click", ()=>{
    const payload = {case_no: CASE.meta.case_no, exported_at: new Date().toISOString(), items: loadState()};
    download(`合规清单_${CASE.meta.case_no}.json`, JSON.stringify(payload, null, 2), "application/json");
  });
  $("#exportCsv").addEventListener("click", ()=>{
    const items = allObligations();
    const s = loadState();
    const head = ["编号","责任方","事项","依据","留存年限","是否备案","状态","备注"];
    const lines = [head.join(",")].concat(items.map(o=>{
      const v = s[o.id]||{};
      return [o.id,o.group,o.item,o.basis,o.retention,o.filing,v.status||"未开始",v.note||""]
        .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",");
    }));
    download(`合规清单_${CASE.meta.case_no}.csv`, "\ufeff"+lines.join("\n"), "text/csv");
  });
  $("#copyPending").addEventListener("click", async ()=>{
    const s = loadState();
    const items = allObligations().filter(o=>(s[o.id]||{}).status!=="已完成" && (s[o.id]||{}).status!=="不适用");
    const text = items.map((o,i)=>`${i+1}. [${o.group}] ${o.item}（留存：${o.retention}）`).join("\n");
    await copyText(text || "全部已完成");
    toast("未完成项已复制");
  });
  $("#resetCk").addEventListener("click", ()=>{
    if(!confirm("确定重置本机保存的勾选状态？")) return;
    localStorage.removeItem(STORE_KEY);
    renderApp();
    toast("已重置");
  });
  $("#printPage").addEventListener("click", ()=>window.print());

  // draft
  let tone = "formal";
  const boxEl = $("#draftBox");
  const setDraft = ()=>{
    boxEl.value = buildDraft(tone);
    $("#draftCount").textContent = boxEl.value.length + " 字";
  };
  $$("#draftTabs .tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      $$("#draftTabs .tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      tone = t.dataset.tone;
      setDraft();
    });
  });
  boxEl.addEventListener("input", ()=>{ $("#draftCount").textContent = boxEl.value.length + " 字"; });
  $("#regenDraft").addEventListener("click", ()=>{ setDraft(); toast("已重新生成"); });
  $("#copyDraft").addEventListener("click", async ()=>{ await copyText(boxEl.value); toast("草稿已复制"); });
  setDraft();
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}
function download(name, content, mime){
  const blob = new Blob([content], {type: mime+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

renderApp();
</script>
</body>
</html>
