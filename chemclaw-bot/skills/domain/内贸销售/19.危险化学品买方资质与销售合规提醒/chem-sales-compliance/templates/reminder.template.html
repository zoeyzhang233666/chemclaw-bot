<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --ink:#111827; --ink-2:#334155; --muted:#64748b; --line:#e2e8f0; --line-2:#cbd5e1;
  --paper:#ffffff; --bg:#eef2f6; --navy:#0b2b3f; --navy-2:#123c55; --teal:#0f766e;
  --teal-2:#14b8a6; --amber:#b45309; --amber-bg:#fef3c7; --green:#15803d; --green-bg:#e8f7ee;
  --red:#b91c1c; --red-bg:#fee7e7; --gray-bg:#eef1f4; --gray:#475569;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 55%),
    radial-gradient(900px 500px at 95% 0%, #d1fae5 0%, transparent 50%),
    var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(15,118,110,.25)}
a:hover{border-bottom-color:var(--teal)}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(12px);
  background:rgba(255,255,255,.86);border-bottom:1px solid rgba(148,163,184,.35)}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(180deg,var(--teal-2),var(--teal));box-shadow:0 0 0 4px rgba(20,184,166,.15)}
.brand small{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.navlinks{display:flex;gap:4px;overflow:auto;scrollbar-width:none;margin-left:auto}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{border:0;color:var(--ink-2);font-size:13px;font-weight:600;padding:7px 10px;border-radius:9px;white-space:nowrap}
.navlinks a:hover{background:#eef6f5;color:var(--teal)}
.navlinks a.active{background:var(--navy);color:#fff}
.chip-progress{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.chip-progress b{color:var(--teal)}

/* ---------- hero ---------- */
.hero{padding:34px 0 8px}
.hero-card{background:linear-gradient(135deg,var(--navy) 0%,#0d3a52 55%,#0f4f5c 100%);
  border-radius:22px;padding:34px 36px 28px;color:#e8f1f6;box-shadow:0 30px 60px -30px rgba(8,47,73,.65);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.28),transparent 65%);pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9fd3cf;font-weight:700}
.eyebrow::before{content:"";width:26px;height:1px;background:#5eead4}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:start;margin-top:14px}
h1{margin:6px 0 6px;font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;font-weight:900;
  font-size:clamp(28px,3.6vw,42px);line-height:1.2;letter-spacing:.01em;color:#fff}
.hero-sub{color:#c7dbe6;font-size:15px;margin:0 0 18px}
.hero-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin-top:16px}
.hero-meta div{display:flex;gap:10px;font-size:13px;color:#d6e5ee;border-top:1px solid rgba(255,255,255,.12);padding-top:9px}
.hero-meta span{color:#8fb3c6;min-width:56px}
.verdict-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:20px}
.verdict-badge{display:inline-flex;align-items:center;gap:8px;background:#e8f7ee;color:#14532d;font-weight:900;
  border-radius:999px;padding:7px 14px;font-size:13px;letter-spacing:.02em}
.verdict-badge .ic{width:18px;height:18px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:12px}
.verdict-box h2{margin:12px 0 6px;font-size:19px;color:#fff;line-height:1.45}
.verdict-box p{margin:0;color:#b9d2df;font-size:13px}
.verdict-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.vchip{font-size:12px;font-weight:700;border-radius:8px;padding:5px 9px;background:rgba(255,255,255,.1);color:#d9ecf3;border:1px solid rgba(255,255,255,.14)}
.vchip.ok{background:rgba(22,163,74,.22);color:#bbf7d0;border-color:rgba(34,197,94,.35)}

/* ---------- sections ---------- */
section{margin:26px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 14px;padding-left:14px;border-left:4px solid var(--teal)}
.sec-head h2{margin:0;font-size:21px;letter-spacing:.01em}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec-no{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--teal);text-transform:uppercase}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mt{margin-top:16px}
.small{font-size:12.5px;color:var(--muted)}
.tiny{font-size:11.5px;color:var(--muted)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:#f1f5f9;color:var(--ink-2);font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line-2)}
tbody tr:hover td{background:#f8fbfc}
td.num{white-space:nowrap;color:var(--muted)}
.tbl-wrap{max-height:none;overflow:auto;border-radius:12px;border:1px solid var(--line)}
.tbl-wrap table{margin:0}
.tbl-wrap th{background:#eef4f8}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.tag.green{background:var(--green-bg);color:#166534}
.tag.amber{background:var(--amber-bg);color:#92400e}
.tag.red{background:var(--red-bg);color:#991b1b}
.tag.gray{background:var(--gray-bg);color:var(--gray)}
.tag.teal{background:#e6f4f1;color:#0f766e}
.tag.navy{background:#e7eef6;color:#123c55}

/* ---------- identity ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
.pchip:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
.pchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pchip small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.pchip.on small{color:#a9c8d8}
.qa{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfdfe}
.qa h4{margin:0 0 6px;font-size:14px;color:var(--ink)}
.qa p{margin:0;font-size:13px;color:var(--ink-2)}
.qa .impact{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:3px 8px}
.preview{border:1px dashed var(--line-2);border-radius:12px;background:#f8fafc;padding:16px 18px;margin-top:16px}
.preview h4{margin:0 0 8px;font-size:14px}
.preview .row{display:flex;gap:10px;font-size:12.5px;margin-top:6px;color:var(--ink-2)}
.preview .row b{min-width:76px;color:var(--muted);font-weight:700}
.notice{background:var(--amber-bg);border:1px solid #fcd34d;color:#78350f;border-radius:12px;padding:12px 14px;font-size:12.5px}

/* ---------- verdict ---------- */
.flags{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.flag{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.flag .t{font-size:12px;font-weight:800;color:var(--ink-2);line-height:1.4}
.flag .v{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:800;color:var(--green)}
.flag .v .ic{width:18px;height:18px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:11px}
.flag .n{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5}
.cons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cons .item{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(180deg,#fff,#f8fafc)}
.cons .item .k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--teal);text-transform:uppercase}
.cons .item .v{margin-top:6px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.basis details{border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;background:#fff;overflow:hidden}
.basis summary{cursor:pointer;padding:13px 16px;font-weight:700;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;list-style:none}
.basis summary::-webkit-details-marker{display:none}
.basis summary .idx{flex:0 0 22px;height:22px;border-radius:6px;background:#e7eef6;color:#123c55;display:grid;place-items:center;font-size:11px;font-weight:800}
.basis .body{padding:0 16px 14px 48px;font-size:12.5px;color:var(--ink-2)}
.basis .body .src{margin-top:8px;font-size:11.5px;color:var(--muted)}
.ghs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ghs .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.ghs .item b{display:block;font-size:12.5px}
.ghs .item span{font-size:11px;color:var(--muted)}

/* ---------- buyer ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.stat.a::before{background:#16a34a}.stat.b::before{background:#d97706}.stat.c::before{background:#dc2626}.stat.n::before{background:#94a3b8}
.stat .n{font-size:28px;font-weight:900;line-height:1;letter-spacing:-.02em}
.stat .l{margin-top:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
.stat .d{margin-top:3px;font-size:11px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.fbtn{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#fff;margin-bottom:12px}
.bcard .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bcard .h b{font-size:14.5px}
.bcard .finding{margin:9px 0 0;font-size:13px;color:var(--ink-2)}
.bcard .ask{margin-top:10px;font-size:12.5px;background:#f1f7ff;border-left:3px solid #3b82f6;padding:8px 12px;border-radius:0 8px 8px 0;color:#1e3a5f}
.bcard .ask b{color:#1d4ed8}
.bcard .ev{margin-top:8px;font-size:11.5px;color:var(--muted)}
.bcard .ev a{font-size:11.5px}
.bcard .note{margin-top:8px;font-size:11.5px;color:var(--muted);font-style:italic}

/* ---------- checklist ---------- */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.bar{flex:1;height:10px;border-radius:999px;background:#e6ebf1;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal-2));transition:width .4s}
.prog .pct{font-size:13px;font-weight:800;color:var(--teal);min-width:92px;text-align:right}
.grp{margin:16px 0 6px;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ck{display:grid;grid-template-columns:30px 86px 1fr 150px 130px;gap:10px;align-items:start;
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:8px;transition:.15s}
.ck:hover{border-color:var(--line-2);box-shadow:0 4px 14px -10px rgba(15,23,42,.35)}
.ck.done{background:#f7fdf9;border-color:#bbf7d0}
.ck .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.ck.done .box{background:var(--green);border-color:var(--green);color:#fff}
.ck .box::after{content:"";font-size:13px;font-weight:900;color:#fff}
.ck.done .box::after{content:"✓"}
.ck .id{font-size:11.5px;font-weight:800;color:var(--teal);letter-spacing:.04em}
.ck .body .t{font-size:13px;font-weight:700;color:var(--ink)}
.ck .body .m{margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.6}
.ck .body .m b{color:var(--ink-2);font-weight:700}
.ck select{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:var(--ink-2);font-weight:700;width:100%}
.ck input.note{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;width:100%;color:var(--ink-2);background:#fbfdff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#123c55;color:#fff}
.btn.ghost{background:transparent}

/* ---------- docs ---------- */
.doc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.doc .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.doc .id{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}
.doc h4{margin:8px 0 6px;font-size:13.5px}
.doc p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.doc .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.mini{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;background:#f1f5f9;color:var(--ink-2)}

/* ---------- draft ---------- */
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tab{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
textarea.draft{width:100%;min-height:300px;border:1px solid var(--line-2);border-radius:12px;padding:16px 18px;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;line-height:1.85;color:var(--ink-2);
  background:#fbfdff;resize:vertical}
.textarea-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--navy);color:#fff;
  border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.note-box{border-left:4px solid var(--teal);background:#f0fdfa;padding:14px 16px;border-radius:0 12px 12px 0;font-size:13px;color:#134e4a}
.warn-box{border-left:4px solid var(--amber);background:#fffbeb;padding:14px 16px;border-radius:0 12px 12px 0;font-size:13px;color:#78350f}
.danger-box{border-left:4px solid var(--red);background:#fef2f2;padding:14px 16px;border-radius:0 12px 12px 0;font-size:13px;color:#7f1d1d}
footer{margin:40px 0 60px;padding:22px 0 0;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:18px 0}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:12px}
.nowrap{white-space:nowrap}
.center{text-align:center}
.right{text-align:right}

@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .flags,.cons{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}
  .ck{grid-template-columns:28px 1fr;grid-auto-rows:auto}
  .ck .id{grid-column:2}
  .ck .body{grid-column:2}
  .ck select,.ck input.note{grid-column:2}
  .navlinks{display:none}
}
@media print{
  body{background:#fff}
  .topbar,.actions,.filters,.tabs,.btn,.toast{display:none!important}
  .card,.hero-card{box-shadow:none;border:1px solid #cbd5e1}
  section{break-inside:avoid}
  .tbl-wrap{overflow:visible}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>销售合规提醒 <small id="brandCase">CASE</small></div>
    <nav class="navlinks" id="navLinks"></nav>
    <div class="chip-progress">清单 <b id="topProg">0/0</b></div>
  </div>
</div>

<main class="wrap" id="app"></main>

<div class="toast" id="toast">已复制</div>

<script>
const CASE = /*__CASE__*/ null;
</script>
<script>
/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nl2br = (s) => esc(s).replace(/\n/g,"<br>");
const money = (n) => Number(n||0).toLocaleString("zh-CN");
const STATUS = {
  A:{label:"公开可见",cls:"green"}, B:{label:"需核对原件",cls:"amber"},
  C:{label:"无公开信息",cls:"red"}, NA:{label:"不适用",cls:"gray"}
};
const CK_STATES = ["未开始","进行中","已完成","不适用"];
const STORE_KEY = "hzcheck:" + (CASE.meta.case_no || "case");

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("on"), 1600);
}
function badge(code){
  const m = STATUS[code] || STATUS.NA;
  return `<span class="tag ${m.cls}">${m.label}</span>`;
}
function secHead(no, title, desc){
  return `<div class="sec-head"><div><div class="sec-no">${esc(no)}</div><h2>${esc(title)}</h2><p>${esc(desc||"")}</p></div></div>`;
}

/* ================= hero ================= */
function renderHero(){
  const m = CASE.meta, d = CASE.determination, p = CASE.product;
  const chips = [
    ["危险化学品经营许可", "不适用"],
    ["买方危化品资质", "不适用"],
    ["公安备案", "无需"],
    ["运输", "普通货物"]
  ];
  return `
  <section class="hero" id="top">
    <div class="hero-card">
      <div class="eyebrow">内贸销售 · 客户准入 · 销售合规</div>
      <div class="hero-grid">
        <div>
          <h1>${esc(p.name)}</h1>
          <p class="hero-sub">${esc(m.buyer.name)} · ${esc(m.deal.qty)} · ${esc(m.deal.delivery)}</p>
          <div class="hero-meta">
            <div><span>案例编号</span>${esc(m.case_no)}</div>
            <div><span>判定日</span>${esc(m.as_of)}</div>
            <div><span>CAS</span>${esc(p.cas)}</div>
            <div><span>用途</span>${esc(m.deal.use_type)}（${esc(m.deal.use_detail)}）</div>
            <div><span>卖方</span>${esc(m.seller.name)}</div>

function allObligations(){
  const out = [];
  [["seller","销售方"],["buyer","买方"],["joint","双方"]].forEach(([k,label])=>{
    (CASE.obligations[k]||[]).forEach(o=>out.push({...o, group:label, groupKey:k}));
  });
  return out;
}
function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

function renderChecklist(){
  const items = allObligations();
  const state = loadState();
  const groups = ["销售方","买方","双方"];
  let html = "";
  groups.forEach(g=>{
    const rows = items.filter(i=>i.group===g);
    if(!rows.length) return;
    html += `<div class="grp">${esc(g)} · ${rows.length} 项</div>`;
    rows.forEach(o=>{
      const s = state[o.id] || {};
      const status = s.status || "未开始";
      html += `
      <div class="ck ${status==="已完成"?"done":""}" data-id="${esc(o.id)}">
        <div class="box" role="checkbox" tabindex="0" aria-label="标记完成"></div>
        <div class="id">${esc(o.id)}</div>

          <div class="t">${esc(o.item)}</div>

        </div>
        <select class="st">${CK_STATES.map(x=>`<option ${x===status?"selected":""}>${x}</option>`).join("")}</select>
        <input class="note" placeholder="完成日期 / 备注" value="${esc(s.note||"")}">
      </div>`;
    });
  });
  return `
  <section id="checklist">
    ${secHead("Step 04","本单合规检查清单","可勾选、可保存（本机浏览器）、可导出；勾选结果可归入客户档案。")}
    <div class="card pad">
      <div class="prog"><div class="bar"><i id="bar"></i></div><div class="pct" id="pct">0%</div><div class="tiny" id="progText">0 / 0</div></div>
      <div id="ckList">${html}</div>
      <div class="actions">
        <button class="btn primary" id="exportJson">导出勾选结果（JSON）</button>
        <button class="btn" id="exportCsv">导出清单（CSV）</button>
        <button class="btn" id="copyPending">复制未完成项</button>
        <button class="btn ghost" id="resetCk">重置</button>
        <button class="btn ghost" id="printPage">打印 / 存 PDF</button>
      </div>
      <div class="tiny mt">勾选结果保存在本机浏览器（localStorage），不会上传；换电脑或清理缓存会丢失，重要节点请导出 JSON 归档。</div>
    </div>
  </section>`;
}
function refreshProgress(){
  const items = allObligations();
  const state = loadState();
  const done = items.filter(o=>(state[o.id]||{}).status==="已完成").length;
  const na = items.filter(o=>(state[o.id]||{}).status==="不适用").length;
  const total = items.length;
  const eff = Math.max(total-na,1);
  const pct = Math.round(done/eff*100);
  const bar = $("#bar"); if(bar) bar.style.width = pct+"%";
  const p1=$("#pct"); if(p1) p1.textContent = pct+"%";
  const p2=$("#progText"); if(p2) p2.textContent = `${done} / ${total} 已完成${na?`（不适用 ${na} 项）`:""}`;
  const tp=$("#topProg"); if(tp) tp.textContent = `${done}/${total}`;
}

/* ================= sources + manual + footer ================= */
function renderSources(){
  const rows = CASE.sources.map((s,i)=>`
    <tr><td class="num">${i+1}</td><td><span class="tag gray">${esc(s.type)}</span></td>
    <td><b>${esc(s.title)}</b><div class="tiny">${esc(s.used_for)}</div></td>
    <td class="small">${esc(s.publisher)}</td><td class="small nowrap">${esc(s.date)}</td>
    <td>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">打开</a>`:"—"}</td></tr>`).join("");
  return `
  <section id="sources">
    ${secHead("Step 09","法规索引与版本",`检索时点 ${CASE.meta.as_of}。法规更新、目录调整后，本卡结论需重跑。`)}
    <div class="card pad"><div class="tbl-wrap"><table>
      <thead><tr><th>#</th><th>类型</th><th>名称 / 用途</th><th>发布机构</th><th>日期</th><th>链接</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
  </section>`;
}
function renderManual(){
  const rows = CASE.manual_confirm.map(m=>`
    <tr><td><b>${esc(m.item)}</b></td><td>${esc(m.why)}</td><td>${esc(m.who)}</td><td class="nowrap">${esc(m.deadline)}</td><td><span class="tag gray">☐ 待确认</span></td></tr>`).join("");
  return `
  <section id="manual">
    ${secHead("Step 10","必须由人确认的事项","以下 6 项机器不能替代。确认后才可对外出具判定或承诺。")}
    <div class="card pad"><div class="tbl-wrap"><table>
      <thead><tr><th>确认项</th><th>为什么必须人工确认</th><th>谁确认</th><th>截止</th><th>状态</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
  </section>`;
}

/* ================= app ================= */
function renderApp(){
  $("#app").innerHTML = renderHero() + renderIdentity() + renderVerdict() + renderBuyer()    + renderChecklist() + renderDocs() + renderRetention() + renderGaps()
    + renderCompare() + renderSources() + renderManual()
    + `<footer>
        <b>版本</b> v1.0 · 判定日 ${esc(CASE.meta.as_of)} · 案例 ${esc(CASE.meta.case_no)}<br>
        ${esc(CASE.meta.disclaimer)}<br>
        <span class="tiny">本页由 chem-sales-compliance 生成；数据源与条文见「法规索引」。PDF/打印：Ctrl/Cmd + P。</span>
      </footer>`;
  const bc = $("#brandCase"); if(bc) bc.textContent = CASE.meta.case_no;
  bind();
  refreshProgress();
}

/* ================= interactions ================= */
function bind(){
  // nav
  const secs = [
    ["top","概览"],["identity","产品身份"],["verdict","判定卡"],["buyer","买方资质"],
    ["checklist","合规清单"],["docs","证照"],["retention","留存备案"],["gaps","缺口话术"],
    ["compare","对照"],["sources","法规"],["manual","人工确认"]
  ];
  $("#navLinks").innerHTML = secs.map(([id,label])=>`<a href="#${id}" data-id="${id}">${label}</a>`).join("");
  const links = $$("#navLinks a");
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(a=>a.classList.toggle("active", a.dataset.id===e.target.id));
      }
    });
  }, {rootMargin:"-45% 0px -50% 0px", threshold:0.01});
  secs.forEach(([id])=>{ const el=document.getElementById(id); if(el) io.observe(el); });

  // product chips
  $$("#productChips .pchip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      $$("#productChips .pchip").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      const cp = CASE.cross_products.find(x=>x.cas===btn.dataset.cas);
      const panel = $("#altPanel");
      if(!cp){ panel.innerHTML=""; return; }
      if(cp.cas === CASE.product.cas){
        panel.innerHTML = `<div class="note-box mt"><b>已回到本单：</b>${esc(cp.name)}，CAS ${esc(cp.cas)}，判定为<b>${esc(cp.verdict)}</b>。本页结论对当前交易有效。</div>`;
        return;
      }
      panel.innerHTML = `
        <div class="preview">
          <h4>对照预览：${esc(cp.name)}（CAS ${esc(cp.cas)}）</h4>
          <div class="row"><b>判定</b><span>${esc(cp.verdict)}</span></div>
          <div class="row"><b>特殊名录</b><span>${esc(cp.flags)}</span></div>
          <div class="row"><b>买方要求</b><span>${esc(cp.buyer_req)}</span></div>
          <div class="row"><b>销售方要求</b><span>${esc(cp.seller_req)}</span></div>
          <div class="row"><b>运输</b><span>${esc(cp.transport)}</span></div>
          <div class="row"><b>备注</b><span>${esc(cp.note)}</span></div>
          <div class="mt"><span class="tag amber">仅对照预览，不改写本单《纯碱》结论</span></div>
        </div>`;
    });
  });

  // manual product check
  $("#manualCheck").addEventListener("click", ()=>{
    const name = $("#qName").value.trim() || "（未填名称）";
    const cas = $("#qCas").value.trim() || "（未填 CAS）";
    const form = $("#qForm").value.trim() || "（未填浓度/形态）";
    $("#manualOut").innerHTML = `
      <div class="warn-box">
        <b>自查提示（${esc(name)} / ${esc(cas)} / ${esc(form)}）：</b>
        该产品不在本页预置库中，<b>不能直接给出判定</b>。请按以下顺序核验：
        ① 在《危险化学品目录（2015 版）》按品名、别名、CAS 三路检索，留存截图；
        ② 核对是否列入剧毒、易制爆、易制毒、重点监管、特别管控名录；
        ③ 调取本批 SDS，按 GHS 分类比对危化品确定原则；
        ④ 若危险特性不确定，按 60 号令做鉴定分类后再交易；
        ⑤ 结论齐备前，不报价、不承诺交期。
      </div>`;
  });

  // buyer filters
  $$("#buyerFilters .fbtn").forEach(b=>{
    b.addEventListener("click", ()=>{
      $$("#buyerFilters .fbtn").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      const f = b.dataset.f;
      $$("#buyerList .bcard").forEach(card=>{
        card.style.display = (f==="all" || card.dataset.status===f) ? "" : "none";
      });
    });
  });

  // checklist
  const state = loadState();
  $$("#ckList .ck").forEach(row=>{
    const id = row.dataset.id;
    const sel = row.querySelector("select.st");
    const note = row.querySelector("input.note");
    const box = row.querySelector(".box");
    const cur = state[id] || {};
    sel.value = cur.status || "未开始";
    note.value = cur.note || "";
    const sync = ()=>{
      state[id] = {status: sel.value, note: note.value};
      saveState(state);
      row.classList.toggle("done", sel.value==="已完成");
      refreshProgress();
    };
    sel.addEventListener("change", sync);
    note.addEventListener("change", sync);
    const toggle = ()=>{
      sel.value = (sel.value==="已完成") ? "未开始" : "已完成";
      sync();
    };
    box.addEventListener("click", toggle);
    box.addEventListener("keydown", (e)=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(); }});
  });

  $("#exportJson").addEventListener("click", ()=>{
    const payload = {case_no: CASE.meta.case_no, exported_at: new Date().toISOString(), items: loadState()};
    download(`合规清单_${CASE.meta.case_no}.json`, JSON.stringify(payload, null, 2), "application/json");
  });
  $("#exportCsv").addEventListener("click", ()=>{
    const items = allObligations();
    const s = loadState();
    const head = ["编号","责任方","事项","依据","留存年限","是否备案","状态","备注"];
    const lines = [head.join(",")].concat(items.map(o=>{
      const v = s[o.id]||{};
      return [o.id,o.group,o.item,o.basis,o.retention,o.filing,v.status||"未开始",v.note||""]
        .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",");
    }));
    download(`合规清单_${CASE.meta.case_no}.csv`, "\ufeff"+lines.join("\n"), "text/csv");
  });
  $("#copyPending").addEventListener("click", async ()=>{
    const s = loadState();
    const items = allObligations().filter(o=>(s[o.id]||{}).status!=="已完成" && (s[o.id]||{}).status!=="不适用");
    const text = items.map((o,i)=>`${i+1}. [${o.group}] ${o.item}（留存：${o.retention}）`).join("\n");
    await copyText(text || "全部已完成");
    toast("未完成项已复制");
  });
  $("#resetCk").addEventListener("click", ()=>{
    if(!confirm("确定重置本机保存的勾选状态？")) return;
    localStorage.removeItem(STORE_KEY);
    renderApp();
    toast("已重置");
  });
  $("#printPage").addEventListener("click", ()=>window.print());

  // draft
  let tone = "formal";
  const boxEl = $("#draftBox");
  const setDraft = ()=>{
    boxEl.value = buildDraft(tone);
    $("#draftCount").textContent = boxEl.value.length + " 字";
  };
  $$("#draftTabs .tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      $$("#draftTabs .tab").forEach(x=>x.classList.remove("on"));
      t.classList.add("on");
      tone = t.dataset.tone;
      setDraft();
    });
  });
  boxEl.addEventListener("input", ()=>{ $("#draftCount").textContent = boxEl.value.length + " 字"; });
  $("#regenDraft").addEventListener("click", ()=>{ setDraft(); toast("已重新生成"); });
  $("#copyDraft").addEventListener("click", async ()=>{ await copyText(boxEl.value); toast("草稿已复制"); });
  setDraft();
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
}
function download(name, content, mime){
  const blob = new Blob([content], {type: mime+";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

renderApp();
</script>
</body>
</html>
