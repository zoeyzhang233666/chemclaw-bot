<style>
  :root{
    --ink:#17233a; --ink-2:#3b4a63; --ink-3:#6b7a93; --line:#dfe6ef; --line-2:#eef2f7;
    --bg:#f3f6fa; --card:#ffffff;
    --brand:#123a5f; --brand-2:#0d2b46; --accent:#0e7c7b; --gold:#b7791f;
    --p1:#b42318; --p1-bg:#fdecea; --p2:#c2620a; --p2-bg:#fef3e2; --p3:#8a6d1a; --p3-bg:#faf5e0;
    --warn-bg:#fff8e6; --warn-line:#f2d98c; --warn-ink:#7a5b0e;
    --radius:14px; --shadow:0 1px 2px rgba(16,32,56,.05),0 8px 28px rgba(16,32,56,.07);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:var(--bg); color:var(--ink); line-height:1.7; font-size:15px;}
  a{color:#1156c8; text-decoration:none;} a:hover{text-decoration:underline;}

  .hero{background:linear-gradient(135deg,var(--brand-2) 0%,var(--brand) 55%,#1d5a8a 100%); color:#fff; padding:34px 28px 30px;}
  .hero-inner{max-width:1180px; margin:0 auto;}
  .hero .kicker{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; letter-spacing:2px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); padding:4px 12px; border-radius:999px; margin-bottom:14px;}
  .hero h1{font-size:26px; font-weight:700; letter-spacing:.5px;}
  .hero h1 small{font-size:15px; font-weight:400; opacity:.88; display:block; margin-top:6px; letter-spacing:0;}
  .hero .meta{display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:16px; font-size:13px; opacity:.92;}
  .hero .meta span{display:inline-flex; gap:6px;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 28px 60px;}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:-24px auto 26px; max-width:1180px; padding:0 28px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
  .kpi .num{font-size:26px; font-weight:700; color:var(--brand);}
  .kpi.pri .num{color:var(--p1);}
  .kpi .lab{font-size:12.5px; color:var(--ink-3); margin-top:2px; letter-spacing:.5px;}

  .snapshot{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:22px;}
  .snapshot h2, .sec h2{font-size:17px; color:var(--brand-2); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .snapshot h2::before, .sec h2::before{content:""; width:4px; height:18px; background:var(--accent); border-radius:2px; display:inline-block;}
  .snap-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px 26px; font-size:14px;}
  .snap-grid .k{color:var(--ink-3);}
  .snap-note{margin-top:12px; font-size:13px; color:var(--ink-3); border-top:1px dashed var(--line); padding-top:10px;}

  .toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:26px 0 16px; position:sticky; top:0; z-index:30; background:var(--bg); padding:10px 0;}
  .chip{border:1px solid var(--line); background:#fff; color:var(--ink-2); border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; transition:.15s;}
  .chip:hover{border-color:var(--brand); color:var(--brand);}
  .chip.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .toolbar select{border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; background:#fff; color:var(--ink-2);}
  .toolbar input[type=search]{flex:1; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:13px;}
  .toolbar .cnt{font-size:12.5px; color:var(--ink-3); margin-left:auto;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
  .card-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line-2); cursor:pointer;}
  .rank{flex:none; width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px;}
  .stars{font-size:12px; letter-spacing:2px;}
  .tag{font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid; white-space:nowrap;}
  .tag.cust{color:#1156c8; border-color:#bcd2f5; background:#eef4fd;}
  .tag.mkt{color:var(--accent); border-color:#bfe3e2; background:#eaf7f6;}
  .tag.aux{color:var(--ink-3); border-color:var(--line); background:#f6f8fb;}
  .card-title{font-size:16.5px; font-weight:700; color:var(--ink); flex:1; min-width:240px;}
  .card-dates{font-size:12.5px; color:var(--ink-3); white-space:nowrap;}
  .chev{color:var(--ink-3); font-size:12px; transition:.2s;}
  .card.open .chev{transform:rotate(180deg);}
  .card-body{padding:6px 20px 20px; display:none;}
  .card.open .card-body{display:block;}

  .blk{margin-top:14px;}
  .blk .h{font-size:13px; font-weight:700; color:var(--brand); letter-spacing:1px; margin-bottom:6px; display:flex; align-items:center; gap:7px;}
  .blk .h .ic{width:20px; height:20px; border-radius:6px; background:var(--line-2); display:flex; align-items:center; justify-content:center; font-size:12px;}
  .blk p{font-size:14px; color:var(--ink-2);}

  .roles{display:flex; flex-wrap:wrap; gap:8px;}
  .role{background:#f2f7fc; border:1px solid #d7e5f2; color:#17457a; font-size:13px; border-radius:9px; padding:6px 12px;}
  .role b{font-weight:600;}
  .role .duty{display:block; font-size:12px; color:#5a7899;}

  .infer{background:var(--warn-bg); border:1px solid var(--warn-line); border-radius:10px; padding:10px 14px; margin-top:14px;}
  .infer .h{color:var(--warn-ink); font-size:13px; font-weight:700; margin-bottom:4px;}
  .infer li{font-size:13px; color:#8a6d1a; padding:2px 0 2px 16px; position:relative; list-style:none;}
  .infer li::before{content:"⚠"; position:absolute; left:0; font-size:11px;}

  .evi{margin-top:14px; border:1px solid var(--line-2); border-radius:10px; overflow:hidden;}
  .evi .h{background:#f7fafc; padding:8px 14px; font-size:13px; font-weight:700; color:var(--ink-2);}
  .evi ul{list-style:none;}
  .evi li{padding:8px 14px; border-top:1px solid var(--line-2); font-size:13.5px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .evi .eid{flex:none; font-size:11px; color:#fff; background:#6b7a93; border-radius:5px; padding:1px 6px;}
  .evi .dt{flex:none; color:var(--ink-3); font-size:12px;}
  .evi a{word-break:break-all;}

  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}
  .btn{border:none; border-radius:9px; padding:9px 16px; font-size:13.5px; cursor:pointer; font-weight:600; transition:.15s;}
  .btn.visit{background:var(--brand); color:#fff;} .btn.visit:hover{background:#1a4f7e;}
  .btn.msg{background:var(--accent); color:#fff;} .btn.msg:hover{background:#0a6665;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--ink-2); font-weight:500;}
  .btn.ghost:hover{border-color:var(--brand); color:var(--brand);}

  .sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-top:26px;}
  table.data{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data th{background:#eef3f9; color:var(--brand-2); text-align:left; padding:9px 12px; border:1px solid var(--line); font-weight:700; white-space:nowrap;}
  table.data td{padding:8px 12px; border:1px solid var(--line); vertical-align:top; color:var(--ink-2);}
  table.data tr:nth-child(even) td{background:#fafcfe;}
  .pill{display:inline-block; font-size:11.5px; border-radius:6px; padding:1px 8px; font-weight:600;}
  .pill.src1{background:#eaf7f6; color:var(--accent); border:1px solid #bfe3e2;}
  .pill.src2{background:#eef4fd; color:#1156c8; border:1px solid #bcd2f5;}

  .chart{display:flex; gap:26px; align-items:flex-end; margin-top:16px; flex-wrap:wrap;}
  .chart svg{flex:none; max-width:100%;}
  .chart .cap{font-size:12.5px; color:var(--ink-3); max-width:360px;}

  .footer{margin-top:30px; font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:16px;}
  .footer p{margin-bottom:8px;}
  .tpl{background:#f7fafc; border:1px dashed var(--line); border-radius:10px; padding:12px 16px; margin-top:10px; color:var(--ink-2); font-size:13px;}

  .mask{position:fixed; inset:0; background:rgba(10,22,40,.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 16px; overflow:auto;}

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("scan-data").textContent);
const $ = s => document.querySelector(s);
const M = DATA.meta;

/* ---------- hero / kpis / snapshot / footer ---------- */
document.title = M.title || document.title;
$("#hero-title").childNodes[0].textContent = (M.title || "客户切入点扫描");
$("#hero-task").textContent = M.task_line || "";
$("#hero-badges").innerHTML = (M.badges || []).map(b => `<span>· ${b}</span>`).join("");

$("#kpis").innerHTML = (M.kpis || []).map(k =>
  `<div class="kpi${k.accent ? " pri" : ""}"><div class="num">${k.num}</div><div class="lab">${k.label}</div></div>`).join("");

$("#snap-grid").innerHTML = (DATA.snapshot.rows || []).map(r =>
  `<div><span class="k">${r[0]}：&nbsp;</span><span class="v">${r[1]}</span></div>`).join("");
$("#snap-note").innerHTML = DATA.snapshot.note || "";

$("#foot-method").textContent = (DATA.footer && DATA.footer.methodology) || "按「事件→与产品的关系→为什么现在值得联系→推荐接触角色→证据」结构输出，事实给出可点开的来源，推断单独标注。";
$("#foot-disc").textContent = (DATA.footer && DATA.footer.disclaimer) || "本报告由公开信息整理生成，仅供销售开拓参考；引用内容版权归原出处所有。";
$("#foot-tpl").textContent = (DATA.footer && DATA.footer.prompt_template) || "我要开发【企业】，销售【产品】。请检查这家公司最近【3/6个月】的扩产、投产、招标、产品变化、经营动态和相关市场变化，输出3–5个近期可操作的销售切入点……";

/* ---------- toolbar ---------- */
const types = [...new Set(DATA.cards.map(c => c.type))];
$("#chips").innerHTML =
  `<button class="chip on" data-f="all">全部（${DATA.cards.length}）</button>` +
  types.map(t => `<button class="chip" data-f="${t}">${t}（${DATA.cards.filter(c => c.type === t).length}）</button>`).join("");

/* ---------- cards ---------- */
const TONES = ["#b42318","#c2620a","#8a6d1a","#4f6b8f","#7d8ca3","#5b7fa6","#8b6ba6"];
function toneOf(p){ return TONES[Math.min(p - 1, TONES.length - 1)]; }
function eviLinks(ids){
  return "<ul>" + ids.map(id => {
    const e = DATA.evidence.find(x => x.id === id);
    if(!e) return "";
    const t = e.title.length > 58 ? e.title.slice(0, 58) + "…" : e.title;
    return `<li><span class="eid">${e.id}</span><span class="dt">${e.date}</span><span>${e.src} · <a href="${e.url}" target="_blank" rel="noopener">${t}</a></span></li>`;
  }).join("") + "</ul>";
}
$("#cards").innerHTML = DATA.cards.map(c => `
  <article class="card open" data-no="${c.no}" data-type="${c.type}" data-sort="${c.sortDate || ""}">
    <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="rank" style="background:${toneOf(c.prio)}">${c.no}</span>
      <span class="stars" style="color:var(--gold)">${c.stars}</span>
      <span class="tag ${c.typeTag}">${c.type}</span>
      <span class="card-title">${c.title}</span>
      <span class="card-dates">${c.dates}</span>
      <span class="chev">▲</span>
    </div>
    <div class="card-body">
      <div class="blk"><div class="h"><span class="ic">📰</span>发生了什么</div><p>${c.event}</p></div>
      <div class="blk"><div class="h"><span class="ic">🧪</span>与我销售的${M.product || "产品"}的关系</div><p>${c.relation}</p></div>
      <div class="blk"><div class="h"><span class="ic">⏱</span>为什么现在值得联系</div><p>${c.whyNow}</p></div>
      <div class="blk"><div class="h"><span class="ic">🧭</span>推荐接触角色</div>
        <div class="roles">${c.roles.map(r => `<span class="role"><b>${r.r}</b><span class="duty">${r.d}</span></span>`).join("")}</div>
      </div>
      ${c.next_action ? `<div class="blk"><div class="h"><span class="ic">⚑</span>建议下一步动作</div><p>${c.next_action}</p></div>` : ""}
      <div class="evi"><div class="h">📎 证据（点开原文）</div>${eviLinks(c.evidence)}</div>
      <div class="infer"><div class="h">⚠ 以下内容只是推断，请勿当事实表述</div><ul>${c.inference.map(i => `<li>${i}</li>`).join("")}</ul></div>
      <div class="actions">
        <button class="btn visit" onclick="openVisit('${c.no}')">🎯 用这个切入点准备拜访</button>
        <button class="btn msg" onclick="openMsg('${c.no}')">✉️ 润色一条我准备发送的消息</button>
        <button class="btn ghost" onclick="copyText(getVisitText('${c.no}'))">复制拜访提纲</button>
      </div>
    </div>
  </article>`).join("");

/* ---------- tables ---------- */
$("#evi-title").textContent = `证据清单（${DATA.evidence.length} 条 · 点开原文）`;
$("#eviBody").innerHTML = DATA.evidence.map(e => `
  <tr><td><b>${e.id}</b></td><td>${e.date}</td><td>${e.source}</td>
  <td><span class="pill ${e.tag}">${e.kind}</span></td>
  <td>${e.title}</td><td>${e.cards}</td>
  <td><a href="${e.url}" target="_blank" rel="noopener">打开原文 ↗</a></td></tr>`).join("");

$("#mktBody").innerHTML = (DATA.market.rows || []).map(m =>
  `<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td><td>${m[4] || ""}</td></tr>`).join("");

$("#infBody").innerHTML = (DATA.inferences || []).map(i =>
  `<tr><td><b>${i[0]}</b></td><td>${i[1]}</td><td>${i[2]}</td><td>${i[3]}</td></tr>`).join("");
if(!(DATA.inferences || []).length) $("#infer").style.display = "none";

$("#roleBody").innerHTML = (DATA.roles || []).map(r =>
  `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5] || ""}</td></tr>`).join("");
if(!(DATA.roles || []).length) $("#roles").style.display = "none";

/* ---------- chart ---------- */
(function renderChart(){
  const ch = DATA.market && DATA.market.chart;
  if(!ch || !ch.points || ch.points.length < 2) return;
  const colors = {brand:"#123a5f", alert:"#b42318", accent:"#0e7c7b", muted:"#8fb5b4"};
  const max = Math.max(...ch.points.map(p => p.value)) * 1.12;
  const bw = 52, gap = 44, padL = 34, baseY = 180, top = 30;
  const W = padL + ch.points.length * (bw + gap) + 10, H = 212;
  const bars = ch.points.map((p, i) => {
    const h = Math.max(2, (p.value / max) * (baseY - top));
    const x = padL + i * (bw + gap), y = baseY - h;
    const cx = x + bw / 2, fill = colors[p.tone] || colors.accent;
    return `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="6" fill="${fill}"/>` +
           `<text x="${cx}" y="${(y - 7).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${fill}">${p.display}</text>` +
           `<text x="${cx}" y="${baseY + 18}" text-anchor="middle" font-size="11" fill="#6b7a93">${p.label}</text>`;
  }).join("");
  $("#chartBox").innerHTML =
    `<div class="chart"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ch.title}">` +
    `<line x1="${padL - 6}" y1="${baseY}" x2="${W - 10}" y2="${baseY}" stroke="#dfe6ef"/>${bars}</svg>` +
    `<div class="cap"><b>${ch.title}</b>${ch.unit ? "（" + ch.unit + "）" : ""}　${ch.caption || ""}</div></div>`;
})();

/* ---------- view filter/sort/search ---------- */
let curFilter = "all", curSort = "prio", curQ = "";
function cardText(c){ return (c.title + c.event + c.relation + c.whyNow + c.roles.map(r => r.r).join("")).toLowerCase(); }
function applyView(){
  let list = DATA.cards.filter(c => curFilter === "all" || c.type === curFilter);
  if(curQ.trim()){ const q = curQ.trim().toLowerCase(); list = list.filter(c => cardText(c).includes(q)); }
  if(curSort === "date")
    list = [...list].sort((a, b) => (b.sortDate || "").localeCompare(a.sortDate || "") || a.prio - b.prio);
  else list = [...list].sort((a, b) => a.prio - b.prio);
  const shown = new Set(list.map(c => c.no));
  document.querySelectorAll(".card").forEach(el => { el.style.display = shown.has(el.dataset.no) ? "" : "none"; });
  $("#cnt").textContent = `显示 ${list.length} / ${DATA.cards.length} 个切入点`;
}
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  ch.classList.add("on"); curFilter = ch.dataset.f; applyView();
}));
$("#sortSel").addEventListener("change", e => { curSort = e.target.value; applyView(); });
$("#q").addEventListener("input", e => { curQ = e.target.value; applyView(); });
applyView();

/* ---------- modal（把事件带入后续任务上下文） ---------- */
const mask = $("#mask"); let lastCard = null, lastMode = "visit";
function findCard(no){ return DATA.cards.find(c => c.no === no); }
function getVisitText(no){
  const c = findCard(no), v = c.visit;
  return `【拜访提纲｜${c.title}】\n客户：${M.customer ? M.customer.name : ""}\n产品：${M.product || ""}\n生成：${M.generated || ""}\n\n■ 拜访目标\n${v.goal.map(g => "· " + g).join("\n")}\n\n■ 必问问题\n${v.ask.map(a => "· " + a).join("\n")}\n\n■ 需带的材料\n${v.bring.map(b => "· " + b).join("\n")}\n\n■ 风险红线（推断勿当事实）\n${c.inference.map(i => "· " + i).join("\n")}\n\n■ 证据\n${c.evidence.map(id => { const e = DATA.evidence.find(x => x.id === id); return e ? `· ${e.id} ${e.date} ${e.source}：${e.url}` : ""; }).filter(Boolean).join("\n")}`;
}
function getMsgText(no){ return findCard(no).message.body; }
function openVisit(no){ modalShell(no, "visit"); }
function openMsg(no){ modalShell(no, "msg"); }
function modalShell(no, mode){
  const c = findCard(no); lastCard = no; lastMode = mode;
  $("#mTitle").textContent = (mode === "visit" ? "🎯 用切入点准备拜访：" : "✉️ 润色发送消息：") + c.title.slice(0, 26) + "…";
  $("#mCtx").textContent = `已带入任务上下文 → 卡片 ${c.no}《${c.title}》 · 类型：${c.type} · 证据：${c.evidence.join("、")}`;
  const v = c.visit;
  $("#mBody").innerHTML = mode === "visit" ? `
      <h4>拜访目标</h4><ul>${v.goal.map(g => `<li>${g}</li>`).join("")}</ul>
      <h4>必问问题（求证推断）</h4><ul>${v.ask.map(a => `<li>${a}</li>`).join("")}</ul>
      <h4>需带的材料</h4><ul>${v.bring.map(b => `<li>${b}</li>`).join("")}</ul>
      <h4>风险红线</h4><p style="color:var(--warn-ink)">${v.risk}</p>
      <h4>本卡推断项（现场求证）</h4><ul>${c.inference.map(i => `<li>${i}</li>`).join("")}</ul>`
    : `
      <h4>建议对象与渠道</h4><p>${c.message.to}</p>
      <h4>消息草稿（可直接编辑）</h4>
      <textarea id="msgBox">${c.message.body}</textarea>
      <p style="font-size:12px;color:var(--ink-3);margin-top:8px">提示：发送前替换【公司名】【姓名】等占位符；涉及行业判断的表述请保持公开口径，不引用推断内容。</p>`;
  mask.classList.add("show");
}
$("#mClose").addEventListener("click", () => mask.classList.remove("show"));
mask.addEventListener("click", e => { if(e.target === mask) mask.classList.remove("show"); });
document.addEventListener("keydown", e => { if(e.key === "Escape") mask.classList.remove("show"); });

/* ---------- copy ---------- */
function copyText(t){
  const done = () => { const tt = $("#toast"); tt.classList.add("show"); setTimeout(() => tt.classList.remove("show"), 1600); };
  function fallback(){
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(fallback); } else fallback();
}
$("#mCopy").addEventListener("click", () => {
  let text = "";
  if(lastMode === "visit") text = getVisitText(lastCard);
  else { const box = $("#msgBox"); text = box ? box.value : getMsgText(lastCard); }
  copyText(text);
});
</script>
</body>
