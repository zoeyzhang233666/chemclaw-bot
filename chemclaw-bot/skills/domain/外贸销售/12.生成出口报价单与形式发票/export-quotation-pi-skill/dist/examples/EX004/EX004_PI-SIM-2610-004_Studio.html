<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export Quotation &amp; Proforma Invoice Studio — 出口报价单 / 形式发票编辑台</title>
<style>
:root{
  --ink:#0f1d2e; --ink-2:#33465e; --muted:#6b7a90; --line:#dde3ec; --line-2:#eef2f7;
  --bg:#eef1f6; --card:#ffffff; --accent:#1b3a5b; --accent-2:#2f6db0; --gold:#b58b3a;
  --ok:#157347; --ok-bg:#e6f4ec; --warn:#9a6700; --warn-bg:#fff6df; --err:#b42318; --err-bg:#fdecea;
  --info:#0f5e9c; --info-bg:#e8f2fb;
  --serif:"Georgia","Times New Roman","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-2)}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(100deg,#10263f 0%,#1b3a5b 55%,#24507c 100%);color:#fff;box-shadow:0 2px 10px rgba(11,25,43,.25)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#d9b25e,#b58b3a);display:grid;place-items:center;font-weight:800;color:#10263f;letter-spacing:.5px;font-family:var(--serif)}
.brand h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-size:11.5px;opacity:.78;font-weight:400;letter-spacing:.3px}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:3px}
.seg button{background:transparent;border:0;color:rgba(255,255,255,.85);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:#fff;color:#14304e;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.4px;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.st-DRAFT{background:#5b5f66;color:#fff}
.st-READY_FOR_REVIEW{background:#b58b3a;color:#1b1710}
.st-FORMAL{background:#1d8a52;color:#fff}
.demo-tag{background:repeating-linear-gradient(-45deg,#f5c95b,#f5c95b 8px,#e9b43f 8px,#e9b43f 16px);color:#3b2a05;font-weight:800;font-size:11.5px;letter-spacing:.6px;padding:5px 10px;border-radius:6px;border:1px solid #c99422}
.tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:rgba(255,255,255,.22)}
.tb-btn.primary{background:#fff;color:#14304e;border-color:#fff}
.tb-btn.primary:hover{background:#eaf0f7}
.tb-btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------------- layout ---------------- */
.workspace{display:grid;grid-template-columns:452px minmax(0,1fr);gap:16px;padding:16px 18px 30px;max-width:1780px;margin:0 auto;align-items:start}
@media(max-width:1180px){.workspace{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,38,63,.04),0 8px 24px rgba(16,38,63,.05)}
.editor{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;overflow:hidden}
.editor .tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);background:linear-gradient(#fbfcfe,#f6f8fb);border-radius:14px 14px 0 0;overflow-x:auto;scrollbar-width:none}
.editor .tabs::-webkit-scrollbar{display:none}
.editor .tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.editor .tabs button.on{background:#fff;border-color:var(--line);color:var(--accent);box-shadow:0 -2px 0 var(--accent-2) inset}
.editor .tabs button .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;font-size:11px;background:var(--err-bg);color:var(--err)}
.editor .tabs button .badge.w{background:var(--warn-bg);color:var(--warn)}
.editor .tabs button .badge:empty{display:none}
.formscroll{overflow:auto;padding:14px 14px 22px}
.formscroll::-webkit-scrollbar{width:9px}.formscroll::-webkit-scrollbar-thumb{background:#cdd6e2;border-radius:9px}
fieldset{border:0;margin:0 0 6px;padding:0}
legend{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0 6px}
.fs{border:1px solid var(--line);border-radius:10px;margin:0 0 9px;background:#fbfcfe}
.fs>summary{cursor:pointer;padding:9px 11px;font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;list-style:none}
.fs>summary::-webkit-details-marker{display:none}
.fs>summary:before{content:"▸";color:var(--muted);transition:transform .15s}
.fs[open]>summary:before{transform:rotate(90deg)}
.fs[open]>summary{border-bottom:1px solid var(--line-2)}
.fs .body{padding:10px 11px 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px;letter-spacing:.02em}
.fld label .req{color:var(--err)}
.fld label .hint{font-weight:400;color:var(--muted);font-size:11px}
.fld input,.fld select,.fld textarea{border:1px solid #cbd4e0;background:#fff;border-radius:7px;padding:6px 8px;font-size:13px;width:100%;transition:border-color .12s,box-shadow .12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(47,109,176,.14)}
.fld textarea{min-height:52px;resize:vertical}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--err);background:#fffbfa}
.fld .msg{font-size:11px;color:var(--err)}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:7px 0 2px}
.chk input{width:15px;height:15px;accent-color:var(--accent-2)}
.chk span{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #c7d1de;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.btn:hover{background:#f4f7fb;border-color:#aebccd}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#224a72}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1710}
.btn.danger{color:var(--err);border-color:#f0c2bd}
.btn.sm{padding:4px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* item editor */
.itemcard{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;overflow:hidden}
.itemcard .hd{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#f4f7fb;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px}
.itemcard .bd{padding:10px}
.calcbox{background:linear-gradient(#f5f9ff,#eef4fc);border:1px solid #d5e2f2;border-radius:9px;padding:9px 11px;margin-top:10px;font-size:12.5px}
.calcbox .line{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
.calcbox .line b{font-variant-numeric:tabular-nums}
.calcbox .formula{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:#fff;border:1px dashed #c8d8ec;border-radius:6px;padding:6px 8px;margin-top:6px;word-break:break-word}
.mismatch{background:var(--err-bg);color:var(--err);border-radius:6px;padding:5px 8px;margin-top:6px;font-weight:600}

/* ---------------- preview column ---------------- */
.previewcol{min-width:0;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px}
.toolbar .grp{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--line)}
.toolbar .grp:last-child{border-right:0;padding-right:0}
.toolbar label{font-size:12px;font-weight:700;color:var(--muted)}
.toolbar select,.toolbar input[type=number]{border:1px solid #cbd4e0;border-radius:7px;padding:5px 7px;background:#fff;font-size:12.5px}
.toolbar input[type=color]{width:30px;height:28px;border:1px solid #cbd4e0;border-radius:7px;background:#fff;padding:2px;cursor:pointer}
.zoombar{display:flex;align-items:center;gap:6px;margin-left:auto}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:12px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fafcff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--err)} .kpi.warn .v{color:var(--warn)}
.progress{height:7px;border-radius:7px;background:#e6ecf4;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f6db0,#41a06a)}
.checkgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 12px}
@media(max-width:1000px){.checkgrid{grid-template-columns:repeat(2,1fr)}}
.chkitem{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-size:12px;cursor:pointer}
.chkitem .ico{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none;margin-top:1px}
.chkitem.pass .ico{background:var(--ok)} .chkitem.warn .ico{background:var(--warn)} .chkitem.fail .ico{background:var(--err)}
.chkitem .t{font-weight:700}.chkitem .n{color:var(--muted)}
.problems{padding:0 12px 14px}
.prob{border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:12.5px;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.prob.error{background:var(--err-bg);border-color:#f3c9c4}
.prob.warning{background:var(--warn-bg);border-color:#f0dfae}
.prob .code{font-family:var(--mono);font-size:11px;font-weight:700;opacity:.85;white-space:nowrap}
.prob .fix{font-size:11.5px;color:var(--muted)}

/* document paper */
.paperwrap{background:#dfe4ec;border-radius:14px;padding:22px;display:flex;justify-content:center;overflow:auto;border:1px solid #d2d9e4}
.paper{width:210mm;min-height:297mm;background:#fff;box-shadow:0 10px 34px rgba(16,38,63,.18);position:relative;transform-origin:top center;
  font-family:var(--serif);color:#111;font-size:9.6pt;line-height:1.42;display:flex;flex-direction:column}
.paper .inner{padding:10mm 11mm 9mm;flex:1;display:flex;flex-direction:column;position:relative;z-index:2}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1;overflow:hidden}
.wm span{font-family:var(--sans);font-weight:900;font-size:58pt;color:rgba(180,35,24,.075);letter-spacing:.12em;transform:rotate(-28deg);white-space:nowrap;border:6px solid rgba(180,35,24,.07);padding:14px 26px;border-radius:10px}
.wm.formal span{color:rgba(21,115,71,.055);border-color:rgba(21,115,71,.05)}

.doc-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding-bottom:6px;border-bottom:2.4px solid var(--daccent,#1b3a5b)}
.doc-head .left{display:flex;gap:12px;align-items:flex-start;min-width:0}
.logo{width:48px;height:48px;border-radius:10px;background:var(--daccent,#1b3a5b);color:#fff;display:grid;place-items:center;font-family:var(--sans);font-weight:900;font-size:9px;letter-spacing:.5px;line-height:1.05;text-align:center;flex:none;padding:4px}
.seller-name{font-family:var(--sans);font-weight:800;font-size:12.6pt;line-height:1.2;letter-spacing:-.1px}
.seller-sub{font-size:7.6pt;color:#3e4a59;margin-top:2px;line-height:1.28}
.doc-title{text-align:right;flex:none}
.doc-title h2{font-family:var(--sans);margin:0;font-size:19pt;letter-spacing:.06em;text-transform:uppercase;color:var(--daccent,#1b3a5b);font-weight:800;line-height:1}
.doc-title .sub{font-size:9pt;letter-spacing:.14em;text-transform:uppercase;color:#6b7787;margin-top:4px;font-family:var(--sans);font-weight:600}
.doc-title .no{font-family:var(--mono);font-size:9.4pt;margin-top:6px;font-weight:700}
.doc-title .dt{font-size:8.8pt;color:#3e4a59}
.addr{display:grid;grid-template-columns:1.15fr 1fr;gap:8px;margin-top:6px}
.box{border:1px solid #ccd3dd;border-radius:5px;padding:5px 8px;min-height:44px}
.box h4{margin:0 0 4px;font-family:var(--sans);font-size:7.6pt;letter-spacing:.14em;text-transform:uppercase;color:#6b7787;font-weight:800}
.box .bn{font-family:var(--sans);font-weight:800;font-size:9.6pt;line-height:1.25}
.box p{margin:2px 0 0;font-size:8.5pt;line-height:1.38;white-space:pre-line}
.meta-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #ccd3dd;border-radius:5px;overflow:hidden;margin-top:6px}
.meta-strip>div{padding:4px 7px;border-right:1px solid #e2e7ee;min-width:0}
.meta-strip>div:last-child{border-right:0}
.meta-strip .k{font-family:var(--sans);font-size:7.1pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;font-weight:800}
.meta-strip .v{font-size:8pt;font-weight:700;margin-top:0;word-break:break-word;line-height:1.24}
.meta-strip .v.sm{font-weight:600;font-size:8.2pt}
table.items{width:100%;border-collapse:collapse;margin-top:10px;font-size:8.5pt}
table.items th{background:var(--daccent,#1b3a5b);color:#fff;font-family:var(--sans);font-size:7.4pt;letter-spacing:.07em;text-transform:uppercase;padding:6px 6px;text-align:left;font-weight:800;border:0}
table.items td{border-bottom:1px solid #dde2e9;padding:6px;vertical-align:top}
table.items td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.items td.c{text-align:center}
table.items tr:nth-child(even) td{background:#fafbfd}
table.items .pname{font-family:var(--sans);font-weight:800;font-size:9pt}
table.items .pspec{font-size:7.9pt;color:#3e4a59;margin-top:2px;line-height:1.32}
table.items .pmeta{font-size:7.6pt;color:#5b6878;margin-top:2px}
table.items tfoot td{border-top:2px solid var(--daccent,#1b3a5b);border-bottom:0;padding:6px;background:#f3f6fa}
table.items tfoot tr.grand td{background:var(--daccent,#1b3a5b);color:#fff;font-family:var(--sans);font-weight:800;font-size:9.6pt}
table.items tfoot .lbl{text-align:right;font-family:var(--sans);font-weight:700;font-size:8.4pt}
.words{margin-top:7px;border:1px solid #ccd3dd;border-left:4px solid var(--daccent,#1b3a5b);border-radius:4px;padding:6px 9px;font-size:8.6pt;background:#f7f9fc}
.words b{font-family:var(--sans);font-size:7.6pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;display:block;margin-bottom:2px}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:6px;border:1px solid #ccd3dd;border-radius:5px;overflow:hidden}
.terms>div{padding:3px 8px;border-bottom:1px solid #e6ebf1}
.terms>div:nth-child(odd){border-right:1px solid #e6ebf1}
.terms .k{font-family:var(--sans);font-size:6.6pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;font-weight:800}
.terms .v{font-size:8pt;font-weight:600;line-height:1.28}
.terms .full{grid-column:1/-1;border-right:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.notes h5{margin:0 0 3px;font-family:var(--sans);font-size:7.6pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;font-weight:800}
.notes ol,.notes ul{margin:0;padding-left:13px;font-size:7.7pt;line-height:1.32}
.notes li{margin-bottom:0.5px}
.dgbox{margin-top:6px;border:1px solid #e3d3a6;background:#fffaf0;border-radius:5px;padding:6px 9px;font-size:8.1pt}
.dgbox b{font-family:var(--sans);font-size:7.6pt;letter-spacing:.1em;text-transform:uppercase;color:#8a6100}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:6px;padding-top:12px}
.sig{border-top:1px solid #333;padding-top:5px;font-size:8.2pt}
.sig .role{font-family:var(--sans);font-size:7.4pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;font-weight:800}
.footer{margin-top:6px;border-top:1px solid #d5dbe4;padding-top:5px;font-size:7.2pt;color:#6b7787;display:flex;justify-content:space-between;gap:10px}
.placeholder{display:inline-block;border:1px dashed #b42318;color:#b42318;background:#fff5f4;border-radius:3px;padding:0 4px;font-family:var(--sans);font-size:7.8pt;font-weight:700}
.bankbox{margin-top:8px;border:1px solid #ccd3dd;border-radius:5px;padding:6px 9px;font-size:8.4pt}
.bankbox .ph{border:1.5px dashed #b42318;background:#fff5f4;color:#8f1c12;border-radius:4px;padding:5px 7px;font-family:var(--sans);font-size:8.2pt;font-weight:700}

/* edit-in-place */
.editable{outline:none;border-radius:3px;cursor:text;transition:background .12s,box-shadow .12s}
.editable:hover{background:#fffbe8;box-shadow:0 0 0 1px #e9d68f inset}
.editable:focus{background:#fffdf2;box-shadow:0 0 0 2px rgba(181,139,58,.55) inset}
.editable.edited{background:#eef7ff}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,34,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.on{display:flex}
.modal .sheet{background:#fff;border-radius:14px;max-width:920px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal .hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal .hd h3{margin:0;font-size:16px}
.modal .bd{padding:16px 18px;overflow:auto}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fafbfd;border-radius:0 0 14px 14px}
.modal table{width:100%;border-collapse:collapse;font-size:12.5px}
.modal table th,.modal table td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.modal table th{background:#f5f8fb;font-size:11.5px;color:var(--ink-2);letter-spacing:.03em}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.no{background:var(--err-bg);color:var(--err)} .tag.opt{background:#eef1f5;color:var(--muted)} .tag.sim{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#10263f;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.split-note{font-size:11.5px;color:var(--muted);padding:8px 12px;border-top:1px dashed var(--line)}
.mini{font-size:11.5px;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:10px 0}
@media print{
  @page{size:A4;margin:0}
  .topbar,.editor,.toolbar,.dashboard,.toast,.modal{display:none!important}
  .workspace{display:block;padding:0}
  .paperwrap{background:#fff;padding:0;border:0;display:block;overflow:visible}
  .paper{box-shadow:none;width:210mm;min-height:auto;transform:none!important}

      { key: 'doc.payment.terms', label: 'Payment terms', required: true, owner: 'user_confirmed' },
      { key: 'doc.delivery.leadTime', label: 'Delivery lead time', required: true, owner: 'user_confirmed' },
      { key: 'doc.packing.summary', label: 'Packing (type) ', required: true, owner: 'user_confirmed' },
      { key: 'doc.reference.quoteNo', label: 'Document reference number', required: true, owner: 'system_generated' },
      { key: 'doc.issueDate', label: 'Issue date', required: true, owner: 'system_generated' }
    ],
    item: [
      { key: 'items[].name', label: 'Product English name', required: true, owner: 'user_confirmed' },
      { key: 'items[].cas', label: 'CAS Registry Number', required: false, owner: 'product_reference' },
      { key: 'items[].spec', label: 'Specification / grade', required: true, owner: 'user_confirmed' },
      { key: 'items[].hsCode', label: 'HS code (for export docs)', required: false, owner: 'user_confirmed' },
      { key: 'items[].unit', label: 'Quantity unit', required: true, owner: 'user_confirmed' },
      { key: 'items[].quantity', label: 'Quantity', required: true, owner: 'user_confirmed' },
      { key: 'items[].unitPrice', label: 'Unit price', required: true, owner: 'user_confirmed' },
      { key: 'items[].packageCount', label: 'Package count', required: false, owner: 'user_confirmed' }
    ],
    pi_only: [
      { key: 'buyer.poNumber', label: "Buyer's PO / reference (optional but standard on PI)", required: false, owner: 'user_confirmed' },
      { key: 'doc.proforma.piValidityNote', label: 'PI: date validity is mandatory', required: true, owner: 'user_confirmed' }
    ],
    advanced: [
      { key: 'doc.reference.exporterReference', label: 'Supplier invoice No. used as exporter reference', required: false, owner: 'user_confirmed' },
      { key: 'doc.bank', label: 'Banking details', required: false, owner: 'user_confirmed' },
      { key: 'doc.charges', label: 'Freight / insurance charge amounts', required: false, owner: 'user_confirmed' },
      { key: 'doc.freight.estimatedPol', label: 'Port of loading / discharge', required: false, owner: 'user_confirmed' },
      { key: 'doc.totalGrossWeight', label: 'Gross weight', required: false, owner: 'user_confirmed' },
      { key: 'doc.totalVolume', label: 'Total volume', required: false, owner: 'user_confirmed' }
    ]
  };

  function get(doc, path) {
    var parts = String(path).replace(/\[\]/g, '').split('.');
    var cur = doc;
    if (parts.length && parts[0] === 'doc') parts = parts.slice(1); // 'doc.' = the root document
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      if (Array.isArray(cur)) { cur = cur[0]; i--; continue; }
      cur = cur[parts[i]];
    }
    if (Array.isArray(cur)) return cur.length ? cur : undefined;
    return cur;
  }
  function blank(v) {
    if (v === null || v === undefined) return true;
    if (typeof v === 'string') return v.trim() === '';
    if (Array.isArray(v)) return v.length === 0;
    return false;
  }

  function fieldStatus(doc) {
    var rows = [];
    ['seller', 'buyer', 'doc', 'item'].forEach(function (g) {
      FIELD_MATRIX[g].forEach(function (f) {
        var v = get(doc, f.key);
        var filled = !blank(v);
        rows.push({
          group: g, key: f.key, label: f.label, required: !!f.required,
          owner: f.owner, filled: filled, value: filled ? v : '',
          state: filled ? 'confirmed' : (f.required ? 'missing' : 'optional')
        });
      });
    });
    var extra = FIELD_MATRIX.advanced.slice();
    if ((doc.docType || 'QUOTATION') === 'PROFORMA_INVOICE') extra = extra.concat(FIELD_MATRIX.pi_only);
    extra.forEach(function (f) {
      var v = get(doc, f.key);
      var filled = !blank(v);
      rows.push({ group: f.key.indexOf('buyer') === 0 ? 'buyer' : 'doc', key: f.key, label: f.label,
        required: !!f.required, owner: f.owner, filled: filled, value: filled ? v : '',
        state: filled ? 'confirmed' : (f.required ? 'missing' : 'optional'), branch: 'supplementary' });
    });
    (doc.items || []).forEach(function (it, i) {
      ['name', 'cas', 'spec', 'hsCode', 'unit', 'quantity', 'unitPrice'].forEach(function (k) {
        var v = it[k];
        var label = { name: 'Product name', cas: 'CAS No.', spec: 'Specification', hsCode: 'HS code', unit: 'Unit', quantity: 'Quantity', unitPrice: 'Unit price' }[k] + ' (line ' + (i + 1) + ')';
        rows.push({ group: 'item', key: 'items[' + i + '].' + k, label: label, required: ['name', 'spec', 'unit', 'quantity', 'unitPrice'].indexOf(k) >= 0,
          owner: (k === 'cas' ? 'product_reference' : 'user_confirmed'), filled: !blank(v), value: blank(v) ? '' : v, state: !blank(v) ? 'confirmed' : 'missing', line: i + 1 });
      });
    });
    return rows;
  }

  /** Full validation. Returns { state, errors, warnings, checks, completeness } */
  function validate(doc) {
    doc = doc || {};
    var problems = [];
    function add(code, severity, where, msg, fix) { problems.push({ code: code, severity: severity, where: where, msg: msg, fix: fix || '' }); }
    var docType = doc.docType || 'QUOTATION';
    var t = doc.tradeTerm || {};
    var cur = (doc.currency && doc.currency.code) || '';
    var code = t.code || '';
    var rule = TERMS[code];

    /* --- seller / buyer --- */
    if (blank(doc.seller && doc.seller.name)) add('SELLER_NAME', 'error', 'seller.name', 'Seller legal name missing.', 'Enter full registered company name.');
    if (blank(doc.seller && doc.seller.address)) add('SELLER_ADDRESS', 'error', 'seller.address', 'Seller address missing.', '');
    if (blank(doc.buyer && doc.buyer.name)) add('BUYER_NAME', 'error', 'buyer.name', 'Buyer legal name missing.', '');
    if (blank(doc.buyer && doc.buyer.address)) add('BUYER_ADDRESS', 'error', 'buyer.address', 'Buyer address missing.', '');
    if (blank(doc.buyer && doc.buyer.country)) add('BUYER_COUNTRY', 'warning', 'buyer.country', 'Buyer country missing.', '');

    /* --- incoterms --- */
    if (!code) add('INCOTERM_MISSING', 'error', 'doc.tradeTerm.code', 'Incoterms rule missing — required since Incoterms 2010.', '');
    else if (!rule) add('INCOTERM_INVALID', 'error', 'doc.tradeTerm.code', 'Unknown Incoterms rule "' + code + '".', 'Use one of ' + Object.keys(TERMS).join(', ') + '.');
    if (blank(t.namedPlace)) add('INCOTERM_PLACE', 'error', 'doc.tradeTerm.namedPlace', (rule ? rule.name + ' requires' : 'Incoterms rule requires') + ' a ' + (rule ? rule.named : 'named port/place') + ' (named place).', '');
    if (blank(t.version)) add('INCOTERM_VERSION', 'error', 'doc.tradeTerm.version', 'Incoterms version missing (2020 recommended).', '');
    if (rule && rule.named === 'place' && /\b(port|pelabuhan)\b/i.test(t.namedPlace || '') && ['EXW', 'FCA', 'CPT', 'CIP', 'DAP', 'DPU', 'DDP'].indexOf(code) >= 0) {
      add('INCOTERM_PLACE_KIND', 'warning', 'doc.tradeTerm.namedPlace', 'Named place reads like a port; for ' + code + ' specify a place (warehouse, factory gate, depot).', '');
    }
    if (rule && rule.mode === 'sea' && t.transportMode && t.transportMode !== 'SEA') {
      add('INCOTERM_MODE_MISMATCH', 'error', 'doc.tradeTerm.code', code + ' applies to sea / inland-waterway transport only.', 'Switch to FCA/CPT/CIP for air or multi-modal.');
    }
    if (rule && rule.mode === 'sea' && blank(t.transportMode)) {
      add('TRANSPORT_MODE', 'warning', 'doc.tradeTerm.transportMode', 'Transport mode not confirmed; ' + code + ' implies sea freight.', '');
    }
    if (t.version === '2010' || t.version === '2000') add('INCOTERM_OLD_VERSION', 'warning', 'doc.tradeTerm.version', 'Incoterms ' + t.version + ' is superseded; state the version on the contract.', '');
    if (code === 'CIF' || code === 'CIP') {
      if (!(doc.freight && doc.freight.insuranceBasis)) add('INSURANCE_BASIS', 'warning', 'doc.freight.insuranceBasis', code + ': insurance is included — state the cover and sum insured (e.g. ICC(A), 110% of CIF value).', '');
    }
    // cost allocation matrix
    var costMap = (doc.tradeTerm && doc.tradeTerm.costAllocation) || {};
    var allocIssues = costAllocationIssues(code, costMap);
    allocIssues.forEach(function (a) { add(a.code, 'warning', 'doc.tradeTerm.costAllocation.' + a.key, a.msg, ''); });

    /* --- currency --- */
    if (!cur) add('CURRENCY_MISSING', 'error', 'doc.currency.code', 'Currency missing.', '');
    if (!(doc.currency && num(doc.currency.decimals) !== null && (num(doc.currency.decimals) === 0 || num(doc.currency.decimals) === 2))) {
      add('CURRENCY_DECIMALS', 'warning', 'doc.currency.decimals', 'Currency decimals not set; engine assumed 2.', '');
    }
    if (doc.currency && doc.currency.code === 'IDR' && (doc.currency.decimals !== 0)) {
      add('CURRENCY_DECIMALS_IDR', 'warning', 'doc.currency.decimals', 'IDR quotation normally uses 0 decimals.', '');
    }
    var base = doc.currency && doc.currency.exchangeRate && doc.currency.exchangeRate.base;
    if (doc.currency && doc.currency.exchangeRate && (doc.currency.exchangeRate.base === cur)) {
      add('FX_SAME_CURRENCY', 'warning', 'doc.currency.exchangeRate', 'Exchange rate base equals quotation currency — the reference figure is meaningless.', '');
    }
    if (doc.currency && doc.currency.exchangeRate && doc.currency.exchangeRate.display === 'quotation' && !isConfirmed(doc.currency.exchangeRate.state)) {
      add('FX_UNCONFIRMED', 'warning', 'doc.currency.exchangeRate.state', 'Quotation shows an exchange-rate note that is not confirmed by the user.', 'Confirm the FX snapshot or remove the note.');
    }
    if (doc.currency && doc.currency.exchangeRate) {
      var fxAge = daysBetween(doc.currency.exchangeRate.asOf, doc.issueDate || todayISO());
      if (fxAge !== null && fxAge > 7 && isConfirmed(doc.currency.exchangeRate.state)) {
        add('FX_STALE', 'warning', 'doc.currency.exchangeRate.asOf', 'Exchange-rate reference is ' + fxAge + ' days old vs issue date; re-snapshot before issue.', '');
      }
    }

    /* --- validity --- */
    var val = doc.validity || {};
    var issue = doc.issueDate;
    if (val.type === 'days' && !(num(val.days) > 0)) add('VALIDITY_DAYS', 'error', 'doc.validity.days', 'Validity in days missing or zero.', '');
    if (val.type === 'date' && blank(val.validUntil)) add('VALIDITY_DATE', 'error', 'doc.validity.validUntil', 'Validity end date missing.', '');
    if (!val.type) add('VALIDITY_TYPE', 'error', 'doc.validity.type', 'Validity basis (date / days) not set.', '');
    var validUntil = val.type === 'days' ? addDays(issue, num(val.days)) : val.validUntil;
    if (issue && validUntil) {
      if (validUntil < issue) add('VALIDITY_ORDER', 'error', 'doc.validity', 'Validity end date (' + validUntil + ') precedes issue date (' + issue + ').', '');
      var span = daysBetween(issue, validUntil);
      if (span !== null && span > 120) add('VALIDITY_TOO_LONG', 'warning', 'doc.validity', 'Validity of ' + span + ' days is unusually long in chemicals trade (typical 15–60 days).', '');
      if (span !== null && span < 3) add('VALIDITY_TOO_SHORT', 'warning', 'doc.validity', 'Validity under 3 days is hard to accept.', '');
      if (validUntil < todayISO()) add('VALIDITY_EXPIRED', 'warning', 'doc.validity', 'Document already expired at load time (' + validUntil + ').', '');
    }
    if (docType === 'PROFORMA_INVOICE' && val.type === 'days') {
      add('PI_VALIDITY', 'warning', 'doc.validity.type', 'On a Proforma Invoice use an explicit validity date (common import-permit requirement).', 'Switch type to "date".');
    }

    /* --- payment --- */
    var pay = doc.payment || {};
    if (blank(pay.terms)) add('PAYMENT_TERMS', 'error', 'doc.payment.terms', 'Payment terms missing.', '');
    if (pay.code === 'LC') {
      if (blank(pay.lcType)) add('LC_TYPE', 'warning', 'doc.payment.lcType', 'LC type (at sight / usance) not stated.', '');
      if (blank(pay.lcOpenedBy)) add('LC_OPENING_DATE', 'warning', 'doc.payment.lcOpenedBy', 'LC opening deadline not stated.', '');
      if (blank(pay.bank)) add('LC_BANK', 'warning', 'doc.payment.bank', 'Advising bank / issuing-bank requirement not stated.', '');
    }
    if (pay.code === 'PREPAY' && blank(pay.amountPct)) {
      add('PREPAY_PCT', 'warning', 'doc.payment.amountPct', 'Share paid in advance not stated.', '');
    }

    /* --- delivery --- */
    var dlv = doc.delivery || {};
    if (blank(dlv.leadTime)) add('LEAD_TIME', 'error', 'doc.delivery.leadTime', 'Delivery lead time missing.', '');
    if (dlv.readyDateMode === 'exact' && blank(dlv.readyDate)) add('READY_DATE', 'error', 'doc.delivery.readyDate', 'Exact ready date selected but empty.', '');
    if (dlv.readyDateMode === 'relative' && !(num(dlv.daysAfterReceipt) > 0)) add('READY_DATE_REL', 'error', 'doc.delivery.daysAfterReceipt', 'Days after receipt selected but not set.', '');

    /* --- packing --- */
    var pk = doc.packing || {};
    if (blank(pk.summary)) add('PACKING', 'error', 'doc.packing.summary', 'Packing not stated.', '');
    if (blank(pk.terms)) add('PACKING_TERMS', 'warning', 'doc.packing.terms', 'Packing standard / certificate wording missing.', '');

    /* --- items --- */
    var totalQty = 0, qtyComplete = true, allGross = 0, grossComplete = true;
    var pkgSum = 0, pkgCounted = false;
    (doc.items || []).forEach(function (it, i) {
      var n = i + 1;
      if (blank(it.name)) add('ITEM_NAME', 'error', 'items[' + i + '].name', 'Line ' + n + ': product name missing.', '');
      if (blank(it.spec)) add('ITEM_SPEC', 'error', 'items[' + i + '].spec', 'Line ' + n + ': specification missing.', '');
      if (blank(it.cas)) add('ITEM_CAS', 'warning', 'items[' + i + '].cas', 'Line ' + n + ': CAS number missing — required for customs, SDS and trend searches.', '');
      else if (!/^\d{2,7}-\d{2}-\d$/.test(String(it.cas).trim()) && !/^\d{4,7}-\d{2}-\d$/.test(String(it.cas).trim())) add('ITEM_CAS_FORMAT', 'warning', 'items[' + i + '].cas', 'Line ' + n + ': CAS number format looks wrong (NNNNNNN-NN-N).', '');
      if (blank(it.hsCode)) add('ITEM_HS', 'warning', 'items[' + i + '].hsCode', 'Line ' + n + ': HS code missing — needed by the exporter/broker and on the PI as reference.', '');
      else if (!/^\d{6}(\d{2}(\d{2})?)?$/.test(String(it.hsCode).replace(/\s/g, ''))) add('ITEM_HS_FORMAT', 'warning', 'items[' + i + '].hsCode', 'Line ' + n + ': HS code must be 6, 8 or 10 digits.', '');
      if (blank(it.unit)) add('ITEM_UNIT', 'error', 'items[' + i + '].unit', 'Line ' + n + ': unit missing.', '');
      var q = num(it.quantity);
      if (q === null || q <= 0) { add('ITEM_QTY', 'error', 'items[' + i + '].quantity', 'Line ' + n + ': quantity missing or ≤ 0.', ''); qtyComplete = false; }
      else totalQty += q;
      if (num(it.unitPrice) === null || num(it.unitPrice) < 0) add('ITEM_PRICE', 'error', 'items[' + i + '].unitPrice', 'Line ' + n + ': unit price missing — no formal document can be issued.', '');
      if (it.unit === 'MT' && q !== null && q < 1) add('ITEM_QTY_SMALL', 'warning', 'items[' + i + '].quantity', 'Line ' + n + ': quantity below 1 MT — confirm unit is MT and not KG.', '');
      if (it.unit === 'KG' && q !== null && q > 20000) add('ITEM_QTY_LARGE', 'warning', 'items[' + i + '].quantity', 'Line ' + n + ': quantity above 20,000 KG — confirm unit is not MT.', '');
      if (num(it.discountPct) > 0 && !isConfirmed(it.discountState)) add('DISCOUNT_UNCONFIRMED', 'warning', 'items[' + i + '].discountPct', 'Line ' + n + ': discount entered but not confirmed.', '');
      if (num(it.unitPrice) !== null && q !== null) { /* line amount handled by compute() */ }
      if (it.packageCount !== undefined && it.packageCount !== '' && it.packageCount !== null) {
        pkgCounted = true; pkgSum += num(it.packageCount) || 0;
      }
      if (it.packageWeight && num(it.packageWeight.value) !== null && it.packageCount) {
        allGross += num(it.packageCount) * num(it.packageWeight.value);
      } else if (it.packageCount) { grossComplete = false; }
      if (it.moisturePct !== undefined && num(it.moisturePct) !== null) {
        if (num(it.moisturePct) >= 100) add('ITEM_MOISTURE', 'error', 'items[' + i + '].moisturePct', 'Line ' + n + ': moisture % ≥ 100 is impossible.', '');
      }
      // dangerous goods fields
      var dg = it.dangerousGoods || {};
      if (dg.status === 'DG') {
        if (blank(dg.unNumber)) add('DG_UN', 'error', 'items[' + i + '].dangerousGoods.unNumber', 'Line ' + n + ': DG confirmed but UN number missing.', '');
        if (blank(dg.properShippingName)) add('DG_PSN', 'error', 'items[' + i + '].dangerousGoods.properShippingName', 'Line ' + n + ': proper shipping name missing.', '');
        if (blank(dg.class)) add('DG_CLASS', 'error', 'items[' + i + '].dangerousGoods.class', 'Line ' + n + ': DG class missing.', '');
        if (blank(dg.packingGroup)) add('DG_PG', 'warning', 'items[' + i + '].dangerousGoods.packingGroup', 'Line ' + n + ': packing group missing.', '');
        if (blank(dg.unPackagingCode)) add('DG_PACKAGE', 'warning', 'items[' + i + '].dangerousGoods.unPackagingCode', 'Line ' + n + ': UN packaging marking not stated (UN-approved drum/bag).', '');
        if (blank(dg.msdsVersion)) add('DG_MSDS', 'warning', 'items[' + i + '].dangerousGoods.msdsVersion', 'Line ' + n + ': SDS revision not stated — shipper needs current SDS.', '');
      } else if (dg.status === 'UNKNOWN') {
        add('DG_UNKNOWN', 'error', 'items[' + i + '].dangerousGoods.status', 'Line ' + n + ': dangerous-goods status not verified — verify before issuing a shipping document.', '');
      } else if (dg.status === 'NOT_REGULATED' && blank(dg.basis)) {
        add('DG_BASIS', 'warning', 'items[' + i + '].dangerousGoods.basis', 'Line ' + n + ': "not regulated" must cite an SDS / supplier statement.', '');
      }
    });
    if (pkgCounted && pkgSum > 0 && blank(doc.totalPackageCount)) add('PACKAGE_TOTAL', 'warning', 'doc.totalPackageCount', 'Line package counts do not add up to a stated document total.', '');
    if (num(doc.totalPackageCount) !== null && pkgCounted && num(doc.totalPackageCount) !== pkgSum) {
      add('PACKAGE_SUM_MISMATCH', 'error', 'doc.totalPackageCount', 'Document package total (' + doc.totalPackageCount + ') ≠ sum of line package counts (' + pkgSum + ').', '');
    }
    if (!blank(doc.totalGrossWeight) && grossComplete && allGross > 0) {
      var wt = parseWeight(doc.totalGrossWeight);
      if (wt !== null && Math.abs(wt - allGross) > 0.6) add('WEIGHT_SUM_MISMATCH', 'warning', 'doc.totalGrossWeight', 'Stated gross weight ' + doc.totalGrossWeight + ' differs from package count × package weight (' + roundHalfUp(allGross, 3) + ' kg).', '');
    }
    if (num(doc.totalVolume) !== null && num(doc.freight && doc.freight.volumeCheck) !== null) { /* optional CBM vs freight calc handled in calculator */ }

    /* --- figures --- */
    var calc = compute(doc);
    calc.warnings.forEach(function (w) { problems.push(w); });

    /* --- total vs package consistency and per-unit price vs packing --- */
    if (doc.packing && num(doc.packing.bagNetKg) && totalQty && qtyComplete) {
      var expectedBags = totalQty * 1000 / num(doc.packing.bagNetKg);
      if (pkgCounted && pkgSum > 0 && Math.abs(expectedBags - pkgSum) > 0.5) {
        add('BAG_COUNT_CHECK', 'error', 'packing.bagNetKg', 'Quantity (' + totalQty + ' MT) ÷ bag net (' + doc.packing.bagNetKg + ' kg) = ' + roundHalfUp(expectedBags, 0) + ' bags, but ' + pkgSum + ' packages are quoted.', '');
      }
      if (num(doc.totalPackageCount) !== null && Math.abs(expectedBags - num(doc.totalPackageCount)) > 0.5) {
        add('BAG_TOTAL_CHECK', 'error', 'totalPackageCount', 'Bags implied by quantity (' + roundHalfUp(expectedBags, 0) + ') ≠ stated total packages (' + doc.totalPackageCount + ').', '');
      }
    }

    /* --- banking --- */
    if (doc.bank && (doc.bank.bankName || doc.bank.sanitized)) {
      if (!doc.bank.sanitized) {
        if (doc.bank.detailsConfirmed !== true) add('BANK_UNCONFIRMED', 'error', 'doc.bank.detailsConfirmed', 'Bank details present but not confirmed by the user — do not issue with unconfirmed banking details.', '');
        else if (doc.bank.display) add('BANK_DISPLAY_CONFIRMED', 'error', 'doc.bank.display', 'Bank details are confirmed but display is disabled — enable or remove the block to avoid an ambiguous document.', '');
      } else if (doc.bank.display) {
        add('BANK_SANITIZED_DISPLAY', 'error', 'doc.bank.display', 'Placeholder/sanitized bank block cannot be displayed as valid banking details.', 'Turn display off.');
      }
    } else if (docType === 'PROFORMA_INVOICE' && !doc.bank) {
      add('BANK_MISSING_PI', 'warning', 'doc.bank', 'Proforma Invoice without banking details: the buyer cannot make payment. Provide the full bank block (account number, SWIFT/BIC, IBAN) from your confirmed source.', '');
    }

    /* --- charges / freight --- */
    var charges = doc.charges || [];
    var freightCharge = charges.filter(function (c) { return /freight/i.test(c.name || ''); })[0];
    var insCharge = charges.filter(function (c) { return /insurance/i.test(c.name || ''); })[0];
    if (freightCharge && num(freightCharge.amount) === null) add('FREIGHT_AMOUNT', 'warning', 'doc.charges.freight', 'Freight line present without amount — the cargo-sale total does not include freight. Label it clearly if intentional.', '');
    if ((code === 'CIF' || code === 'CIP') && !insCharge) add('INSURANCE_CHARGE', 'warning', 'doc.charges.insurance', code + ' price should include insurance; add an insurance line or state that cover is arranged under the rule.', '');
    if ((code === 'FOB' || code === 'FCA' || code === 'EXW') && freightCharge && num(freightCharge.amount)) {
      add('FREIGHT_ON_FOB', 'error', 'doc.tradeTerm.code', code + ' excludes main freight, but a freight amount is added to the total.', 'Move freight to the optional freight-cost calculator.');
    }
    if ((code === 'CFR' || code === 'CIF') && doc.freight && num(doc.freight.volumeCheck) !== null && num(doc.freight.quotedVolume) !== null) {
      if (Math.abs(num(doc.freight.volumeCheck) - num(doc.freight.quotedVolume)) > 1) {
        add('FREIGHT_VOLUME', 'warning', 'doc.freight.volumeCheck', 'Package volume (' + doc.freight.quotedVolume + ') differs from computed volume (' + doc.freight.volumeCheck + ') — confirm chargeable freight basis.', '');
      }
    }

    /* --- fatality checks that would stop a formal document --- */
    (doc.fatal || []).forEach(function (f) {
      add(f.code || 'FATAL', 'error', f.where || 'doc', 'BLOCKING: ' + f.msg, '');
    });

    /* --- document state --- */
    var ds = docState(doc, problems);
    var fieldRows = fieldStatus(doc);
    var required = fieldRows.filter(function (r) { return r.required; });
    var completeness = {
      required: required.length,
      filled: required.filter(function (r) { return r.filled; }).length,
      missing: required.filter(function (r) { return !r.filled; }).map(function (r) { return r.label; }),
      optionalFilled: fieldRows.filter(function (r) { return !r.required && r.filled; }).length,
      rows: fieldRows
    };
    var errors = problems.filter(function (p) { return p.severity === 'error'; });
    var warnings = problems.filter(function (p) { return p.severity === 'warning'; });
    return { state: ds.state, label: ds.label, errors: errors, warnings: warnings, problems: problems,
      checks: groupChecks(problems), completeness: completeness, calc: calc, validUntil: validUntil || null,
      tradeTermText: tradeTermText(t), docType: docType };
  }

  function daysBetween(a, b) {
    if (!a || !b) return null;
    var x = new Date(a + 'T00:00:00Z'), y = new Date(b + 'T00:00:00Z');
    if (isNaN(x) || isNaN(y)) return null;
    return Math.round((y - x) / 86400000);
  }

  var CHECK_GROUPS = [
    ['A', 'Commercial fields', ['SELLER_', 'BUYER_', 'ITEM_NAME', 'ITEM_SPEC', 'ITEM_CAS', 'ITEM_HS']],
    ['B', 'Quantity & unit', ['ITEM_QTY', 'ITEM_UNIT', 'BAG_', 'PACKAGE_', 'WEIGHT_']],
    ['C', 'Price & amount', ['ITEM_PRICE', 'AMOUNT_MISMATCH', 'GRAND_TOTAL_MISMATCH', 'DISCOUNT']],
    ['D', 'Currency & exchange rate', ['CURRENCY', 'FX_']],
    ['E', 'Incoterms & costs', ['INCOTERM', 'TRANSPORT_MODE', 'INSURANCE', 'FREIGHT', 'COST_ALLOC']],
    ['F', 'Packing', ['PACKING']],
    ['G', 'Delivery', ['LEAD_TIME', 'READY_DATE']],
    ['H', 'Payment', ['PAYMENT', 'LC_', 'PREPAY']],
    ['I', 'Validity', ['VALIDITY', 'PI_VALIDITY']],
    ['J', 'Banking', ['BANK_']],
    ['K', 'Dangerous goods', ['DG_']]
  ];
  function groupChecks(problems) {
    var out = [];
    CHECK_GROUPS.forEach(function (g) {
      var hits = problems.filter(function (p) { return g[2].some(function (pref) { return p.code.indexOf(pref) === 0; }); });
      var failed = hits.filter(function (h) { return h.severity === 'error'; }).length;
      var warn = hits.length - failed;
      out.push({ key: g[0], name: g[1], status: failed ? 'fail' : (warn ? 'warn' : 'pass'), errors: failed, warnings: warn, hits: hits });
    });
    return out;
  }

  /** Document state machine: DRAFT -> READY_FOR_REVIEW -> FORMAL */
  function docState(doc, problems) {
    problems = problems || [];
    var hasError = problems.some(function (p) { return p.severity === 'error'; });
    var explicit = doc.state && doc.state.stage;
    if (explicit === 'FORMAL' && doc.state.reviewConfirmed === true && !hasError) {
      return { state: 'FORMAL', label: 'FORMAL / ISSUED' };
    }
    if (explicit === 'FORMAL' && (doc.state.reviewConfirmed !== true || hasError)) {
      return { state: 'READY_FOR_REVIEW', label: doc.state.reviewConfirmed === true ? 'BLOCKED — errors must be cleared' : 'AWAITING REVIEW CONFIRMATION' };
    }
    if (doc.state && doc.state.reviewConfirmed === true && !hasError) {
      return { state: 'READY_FOR_REVIEW', label: 'REVIEWED — awaiting formal issue' };
    }
    return { state: 'DRAFT', label: 'DRAFT — NOT A VALID OFFER' };
  }

  function tradeTermText(t) {
    t = t || {};
    if (!t.code) return '';
    var r = TERMS[t.code];
    var s = t.code + (r ? ' ' + r.name : '');
    if (t.namedPlace) s += ' ' + t.namedPlace;
    if (t.version) s += ', Incoterms® ' + t.version;
    return s;
  }

  /* Cost-responsibility matrix (Incoterms 2020 allocation of main cost items). */
  var COST_MATRIX = {
    rows: [
      { key: 'exportPacking', label: 'Export packing' },
      { key: 'loadingCharges', label: 'Loading on board / at carrier' },
      { key: 'exportCustoms', label: 'Export customs clearance' },
      { key: 'originCharges', label: 'Origin terminal / THC' },
      { key: 'mainFreight', label: 'Main carriage / freight' },
      { key: 'insurance', label: 'Cargo insurance' },
      { key: 'destinationCharges', label: 'Destination terminal / THC' },
      { key: 'importCustoms', label: 'Import customs clearance & duties' },
      { key: 'unloading', label: 'Unloading at destination' }
    ],
    standard: {
      EXW: { exportPacking: 'S', loadingCharges: 'B', exportCustoms: 'B', originCharges: 'B', mainFreight: 'B', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      FCA: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'B', mainFreight: 'B', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      FAS: { exportPacking: 'S', loadingCharges: 'B', exportCustoms: 'S', originCharges: 'B', mainFreight: 'B', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      FOB: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'B', mainFreight: 'B', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      CFR: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      CIF: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'S', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      CPT: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'B', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      CIP: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'S', destinationCharges: 'B', importCustoms: 'B', unloading: 'B' },
      DAP: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'B', destinationCharges: 'S', importCustoms: 'B', unloading: 'B' },
      DPU: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'B', destinationCharges: 'S', importCustoms: 'B', unloading: 'S' },
      DDP: { exportPacking: 'S', loadingCharges: 'S', exportCustoms: 'S', originCharges: 'S', mainFreight: 'S', insurance: 'B', destinationCharges: 'S', importCustoms: 'S', unloading: 'B' }
    }
  };
  /** user costAllocation values are authoritative; mismatches flag the quote text vs reality */
  function costAllocationIssues(code, userMap) {
    var std = COST_MATRIX.standard[code];
    var out = [];
    if (!std || !userMap) return out;
    Object.keys(std).forEach(function (k) {
      var u = userMap[k];
      if (!u) return;
      var uu = String(u).toLowerCase().charAt(0);
      var su = std[k].toLowerCase().charAt(0);
      if (uu !== su && uu !== 'b' && su !== 'b') {
        out.push({ code: 'COST_ALLOC_' + k.toUpperCase(), key: k,
          msg: 'Cost allocation for "' + k + '" contradicts ' + code + ' (' + su.toUpperCase() + ' standard). If the seller bears this cost, state it explicitly as commercial goodwill wording.' });
      } else if (uu === 's' && su === 'b') {
        // seller voluntarily bearing a buyer cost is allowed but must be explicit
        out.push({ code: 'COST_ALLOC_' + k.toUpperCase(), key: k,
          msg: 'Seller bears cost normally on the buyer under ' + code + ' ("' + k + '") — add explicit commercial wording, as the Incoterms® rule does not transfer it.' });
      }
    });
    return out;
  }

  /* ------------------------------------------------------------- documents */
  /** Build the human-readable field list in standard trade-document order */
  function fieldList(doc) {
    var t = doc.tradeTerm || {};
    var calc = compute(doc);
    var rows = [];
    function R(section, label, value, opts) {
      rows.push(Object.assign({ section: section, label: label, value: value,
        state: (value === '' || value === null || value === undefined) ? 'missing' : (opts && opts.state ? opts.state : 'confirmed'),
        note: (opts && opts.note) || '', owner: (opts && opts.owner) || 'user_confirmed' }, opts || {}));
    }
    R('Document', 'Document type', doc.docType === 'PROFORMA_INVOICE' ? 'Proforma Invoice' : 'Quotation');
    R('Document', 'Document No.', (doc.reference || {}).text);
    R('Document', 'Date of issue', doc.issueDate);
    R('Document', 'Our reference', (doc.reference || {}).quotationRef, { owner: 'user_confirmed' });
    R('Document', 'Your enquiry reference', (doc.reference || {}).buyerInquiryRef, { owner: 'user_confirmed' });
    R('Document', 'Our quotation reference', (doc.reference || {}).supplierQuoteRef, { owner: 'user_confirmed' });
    R('Document', 'Exporter reference (supplier invoice No.)', (doc.reference || {}).exporterReference, { owner: 'user_confirmed' });
    R('Document', "Buyer's PO / reference", (doc.reference || {}).buyerPoNo, { owner: 'user_confirmed' });
    R('Document', 'Issued by (operator)', (doc.preparation || {}).issuedBy, { owner: 'system_generated' });

    R('Seller', 'Company name', (doc.seller || {}).name);
    R('Seller', 'Address', (doc.seller || {}).address);
    R('Seller', 'Contact / phone / e-mail', [(doc.seller || {}).contact, (doc.seller || {}).phone, (doc.seller || {}).email].filter(Boolean).join(' | '));
    R('Seller', 'Tax ID / USCI', (doc.seller || {}).taxId);

    R('Buyer', 'Company name', (doc.buyer || {}).name);
    R('Buyer', 'Address', (doc.buyer || {}).address);
    R('Buyer', 'Attention', [(doc.buyer || {}).contact, (doc.buyer || {}).email, (doc.buyer || {}).phone].filter(Boolean).join(' | '));
    R('Buyer', 'Tax number (NPWP)', (doc.buyer || {}).npwp);

    R('Goods', 'Product', (doc.items || []).map(function (i) { return i.name; }).join('; '));
    R('Goods', 'CAS Registry Number', (doc.items || []).map(function (i) { return i.cas; }).join('; '));
    R('Goods', 'Specification', (doc.items || []).map(function (i) { return i.spec; }).join('; '));
    R('Goods', 'HS code', (doc.items || []).map(function (i) { return i.hsCode; }).join('; '));
    R('Goods', 'Origin', (doc.items || []).map(function (i) { return i.origin; }).join('; '));
    R('Goods', 'Quantity', (doc.items || []).map(function (i) { return i.quantity + ' ' + i.unit; }).join('; '));
    R('Goods', 'Unit price', (doc.items || []).map(function (i) { return i.unitPrice + ' ' + (doc.currency || {}).code + '/' + i.unit; }).join('; '));
    R('Goods', 'Amount excl. charges', calc.subtotal, { state: calc.subtotal !== null ? 'confirmed' : 'missing' });
    R('Goods', 'TOTAL', calc.total, { state: calc.total !== null ? 'confirmed' : 'missing' });
    R('Goods', 'Total in words', calc.totalInWords, { state: calc.totalInWords ? 'confirmed' : 'missing' });

    R('Terms', 'Incoterms® 2020', tradeTermText(t) || '');
    R('Terms', 'Named place', t.namedPlace);
    R('Terms', 'Transport mode', t.transportMode);
    R('Terms', 'Port of loading', (doc.freight || {}).estimatedPol);
    R('Terms', 'Port of discharge', (doc.freight || {}).estimatedPod);
    R('Terms', 'Packing', (doc.packing || {}).summary);
    R('Terms', 'Total packages', doc.totalPackageCount);
    R('Terms', 'Gross weight', doc.totalGrossWeight);
    R('Terms', 'Volume', doc.totalVolume);
    R('Terms', 'Lead time', (doc.delivery || {}).leadTime, { note: (doc.delivery || {}).basis || '' });
    R('Terms', 'Partial shipment', (doc.delivery || {}).partialShipment);
    R('Terms', 'Transhipment', (doc.delivery || {}).transhipment);
    R('Terms', 'Payment terms', (doc.payment || {}).terms);
    R('Terms', 'Payment account / beneficiary', (doc.payment || {}).beneficiary, { note: (doc.payment || {}).beneficiaryNote || '' });
    R('Terms', 'Validity', doc.validity && doc.validity.type === 'days' ? 'Valid for ' + doc.validity.days + ' days from date of issue' : (doc.validity || {}).validUntil, { state: ((doc.validity || {}).type) ? 'confirmed' : 'missing' });
    R('Terms', 'Currency', doc.currency && doc.currency.code ? doc.currency.code + ' (' + (doc.currency.name || '') + ')' : '');
    R('Terms', 'Documents required', (doc.documents || []).map(function (d) { return d.name; }).join('; '));

    R('Dangerous goods', 'DG status', (doc.items || []).map(function (i) { return i.dangerousGoods && i.dangerousGoods.status || 'UNKNOWN'; }).join('; '));
    R('Dangerous goods', 'GHS hazard statement', (doc.items || []).map(function (i) { return (i.dangerousGoods || {}).ghsSummary; }).filter(Boolean).join('; '));

    R('Banking', 'Bank name', (doc.bank || {}).bankName, { state: (doc.bank || {}).display ? ((doc.bank || {}).detailsConfirmed ? 'confirmed' : 'missing') : 'optional' });
    R('Banking', 'A/C No. shown?', (doc.bank || {}).display ? 'Yes' : 'No — intentionally omitted', { owner: 'user_confirmed' });
    return rows;
  }

  /** Placeholders used when a price is missing (draft-only documents) */
  function placeholders(doc) {
    var out = [];
    (doc.items || []).forEach(function (it, i) {
      if (num(it.unitPrice) === null) out.push('Line ' + (i + 1) + ' UNIT PRICE — TO BE CONFIRMED [____]');
    });
    if (num((doc.payment || {}).amountPct) === null && /advance|prepay/i.test((doc.payment || {}).terms || '')) out.push('ADVANCE SHARE [__ %]');
    return out;
  }

  return {
    VERSION: VERSION,
    TERMS: TERMS,
    COST_MATRIX: COST_MATRIX,
    FIELD_MATRIX: FIELD_MATRIX,
    compute: compute,
    validate: validate,
    docState: docState,
    fieldStatus: fieldStatus,
    fieldList: fieldList,
    tradeTermText: tradeTermText,
    amountInWords: amountInWords,
    roundHalfUp: roundHalfUp, parseWeight: parseWeight,
    costAllocationIssues: costAllocationIssues,
    addDays: addDays,
    placeholders: placeholders
  };
}));

<script>
/* =============================================================================
   Export Quotation & Proforma Invoice Studio — application shell
   Depends on window.QuoteEngine (engine.js) and window.__DEMO_DATA__ (embedded
   demo case). All commercial values come from the data model only.
   ============================================================================= */
(function () {
  'use strict';
  var E = window.QuoteEngine;
  var EMBEDDED = window.__DEMO_DATA__ || null;
  var LS_KEY = 'eqpi-studio-draft-v1';
  var TPL_KEY = 'eqpi-studio-template-v1';
  var LOG_KEY = 'eqpi-studio-log-v1';

  var S = {
    doc: null,
    tab: 'doc',
    zoom: 0.8,
    font: null,
    openItems: {},
    log: [],
    template: null   // saved company template: {brand, sellerNoBrand}
  };

  /* ------------------------------------------------------------- utilities */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function nowStamp() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function money(v, dp) {
    if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '—';
    dp = (dp === undefined) ? 2 : dp;
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function curCode() { return (S.doc.currency && S.doc.currency.code) || ''; }
  function curDp() { var d = S.doc.currency && S.doc.currency.decimals; return (d === 0 || d === 2) ? d : 2; }
  function amend() {
    S.doc.state = S.doc.state || {};
    S.doc.state.reviewConfirmed = false;
    if (S.doc.state.stage === 'FORMAL') S.doc.state.stage = 'DRAFT';
    S.doc.review = S.doc.review || {};
    S.doc.review.signoff = null;
  }
  function logEvent(kind, msg, extra) {
    S.log.push(Object.assign({ at: nowStamp(), kind: kind, msg: msg, docNo: refText() }, extra || {}));
    try { localStorage.setItem(LOG_KEY, JSON.stringify(S.log.slice(-200))); } catch (e) { }
  }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2600); }

  /* ------------------------------------------------------- data accessors */
  function getPath(o, p) {
    var parts = String(p).split('.'), cur = o;
    for (var i = 0; i < parts.length; i++) { if (cur == null) return undefined; cur = cur[parts[i]]; }
    return cur;
  }
  function setPath(o, p, v) {
    var parts = String(p).split('.'), cur = o;
    for (var i = 0; i < parts.length - 1; i++) { if (!cur[parts[i]] || typeof cur[parts[i]] !== 'object') cur[parts[i]] = {}; cur = cur[parts[i]]; }
    cur[parts[parts.length - 1]] = v;
  }
  function refText() { return (S.doc.reference && S.doc.reference.text) || 'DRAFT'; }
  function isSimulated() {
    var m = S.doc.meta || {}, v = S.doc.view || {};
    if (v.watermark !== false) return true;
    return /simulat|demo/i.test([m.dataClass, S.doc.seller && S.doc.seller.name, S.doc.buyer && S.doc.buyer.name].join(' '));
  }

  /* --------------------------------------------------------- validation   */
  function valid() { return E.validate(S.doc); }

  /* ================================================================ EDITOR */
  var TABS = {
    doc: '单据', parties: '买卖双方', items: '货品/价格', terms: '商务条款', bank: '银行与单证', check: '字段检查', template: '模板与数据'
  };

  function renderForms() {
    var host = $('#forms');
    var scroll = host.scrollTop;
    host.innerHTML = '';
    var openSet = {};
    $$('#forms details.fs').forEach(function (d, i) { openSet[i] = d.open; });
    if (S.tab === 'doc') host.appendChild(formDoc());
    else if (S.tab === 'parties') host.appendChild(formParties());
    else if (S.tab === 'items') host.appendChild(formItems());
    else if (S.tab === 'terms') host.appendChild(formTerms());
    else if (S.tab === 'bank') host.appendChild(formBank());
    else if (S.tab === 'check') host.appendChild(formCheck());
    else if (S.tab === 'template') host.appendChild(formTemplate());
    $$('#forms details.fs').forEach(function (d, i) { if (openSet[i] !== undefined) d.open = openSet[i]; });
    host.scrollTop = scroll;
  }

  function fld(opts) {
    var wrap = document.createElement('div');
    wrap.className = 'fld' + (opts.full ? ' full' : '');
    var id = 'f_' + (opts.id || Math.random().toString(36).slice(2, 8));
    var lab = document.createElement('label');
    lab.setAttribute('for', id);
    lab.innerHTML = esc(opts.label) + (opts.req ? ' <span class="req">*</span>' : '') + (opts.hint ? ' <span class="hint">' + esc(opts.hint) + '</span>' : '');
    wrap.appendChild(lab);
    var el;
    if (opts.type === 'select') {
      el = document.createElement('select');
      (opts.options || []).forEach(function (o) {
        var op = document.createElement('option');
        if (typeof o === 'string') { op.value = o; op.textContent = o; } else { op.value = o.v; op.textContent = o.t; }
        el.appendChild(op);
      });
      el.value = opts.value === undefined || opts.value === null ? '' : opts.value;
    } else if (opts.type === 'textarea') {
      el = document.createElement('textarea'); el.value = opts.value || '';
    } else {
      el = document.createElement('input');
      el.type = opts.type || 'text';
      if (opts.step) el.step = opts.step;
      el.value = opts.value === undefined || opts.value === null ? '' : opts.value;
      if (opts.placeholder) el.placeholder = opts.placeholder;
    }
    el.id = id;
    if (opts.disabled) el.disabled = true;
    el.addEventListener('input', function () { opts.onInput && opts.onInput(el.value, el); });
    el.addEventListener('change', function () { opts.onChange && opts.onChange(el.value, el); });
    if (opts.after) el.addEventListener('blur', opts.after);
    wrap.appendChild(el);
    if (opts.msg) { var m = document.createElement('div'); m.className = 'msg'; m.textContent = opts.msg; wrap.appendChild(m); }
    return wrap;
  }
  function bind(path, opts) {
    opts = opts || {};
    var v = getPath(S.doc, path);
    return Object.assign({
      value: v,
      onInput: function (val, el) {
        var out = val;
        if (opts.num) { out = val === '' ? '' : Number(val); if (isNaN(out)) out = ''; }
        setPath(S.doc, path, out);
        amend();
        if (opts.noRerender) { softUpdate(); } else { rerender({ keepFocus: el.id }); }
      }
    }, opts);
  }
  function fs(title, open, bodyNodes, meta) {
    var d = document.createElement('details');
    d.className = 'fs'; if (open) d.open = true;
    var s = document.createElement('summary');
    s.innerHTML = esc(title) + (meta ? ' <span class="mini" style="font-weight:500">' + meta + '</span>' : '');
    d.appendChild(s);
    var b = document.createElement('div'); b.className = 'body';
    bodyNodes.forEach(function (n) { if (n) b.appendChild(n); });
    d.appendChild(b);
    return d;
  }
  function grid(cls, nodes) { var g = document.createElement('div'); g.className = cls; nodes.forEach(function (n) { if (n) g.appendChild(n); }); return g; }
  function hint(text) { var p = document.createElement('div'); p.className = 'mini'; p.style.margin = '6px 0'; p.innerHTML = text; return p; }
  function checkbox(label, checked, onChange) {
    var l = document.createElement('label'); l.className = 'chk';
    var i = document.createElement('input'); i.type = 'checkbox'; i.checked = !!checked;
    i.addEventListener('change', function () { onChange(i.checked); });
    var s = document.createElement('span'); s.textContent = label;
    l.appendChild(i); l.appendChild(s); return l;
  }

  function formDoc() {
    var frag = document.createDocumentFragment();
    var dpts = [{ v: 'QUOTATION', t: 'Quotation 报价单' }, { v: 'PROFORMA_INVOICE', t: 'Proforma Invoice 形式发票' }];
    frag.appendChild(fs('① 单据基本资料', true, [
      grid('g2', [
        fld(Object.assign({ label: '单据类型 Document type', type: 'select', options: dpts, req: true }, bind('docType', { onChange: function (v) { S.doc.docType = v; amend(); rerender(); } }))),
        fld(Object.assign({ label: '单据编号 Document No.', req: true, hint: 'auto, editable' }, bind('reference.text', { noRerender: true }))),
        fld(Object.assign({ label: '签发日期 Issue date', type: 'date', req: true }, bind('issueDate'))),
        fld(Object.assign({ label: '我方报价参考 Our reference' }, bind('reference.quotationRef'))),
        fld(Object.assign({ label: '买方询盘参考 Your enquiry ref.' }, bind('reference.buyerInquiryRef'))),
        fld(Object.assign({ label: '买方订单号 PO / reference' }, bind('reference.buyerPoNo'))),
        fld(Object.assign({ label: '币种 Currency', type: 'select', req: true, options: ['USD', 'EUR', 'CNY', 'IDR', 'SGD', 'JPY', 'HKD', 'AUD', 'GBP', 'INR'] }, bind('currency.code', { onChange: function (v) { S.doc.currency.code = v; S.doc.currency.decimals = v === 'IDR' || v === 'JPY' ? 0 : 2; amend(); rerender(); } }))),
        fld(Object.assign({ label: '小数位 Decimals', type: 'select', options: [{ v: '2', t: '2 decimals' }, { v: '0', t: '0 decimals' }] }, bind('currency.decimals', { onChange: function (v) { S.doc.currency.decimals = Number(v); amend(); rerender(); } })))
      ])
    ]));
    frag.appendChild(fs('② 报价有效期', true, [
      grid('g2', [
        fld(Object.assign({ label: '有效期方式', type: 'select', options: [{ v: 'date', t: '截止日期 date' }, { v: 'days', t: '天数 days' }] }, bind('validity.type', { onChange: function (v) { S.doc.validity.type = v; amend(); rerender(); } }))),
        S.doc.validity.type === 'days'
          ? fld(Object.assign({ label: '有效天数 Days', type: 'number' }, bind('validity.days', { num: true })))
          : fld(Object.assign({ label: '有效期截止 Valid until', type: 'date', req: true }, bind('validity.validUntil')))

    html += '<div class="terms">' +

      '</div>';

    if (b.display && !b.sanitized && b.detailsConfirmed) {
      html += '<div class="bankbox"><div class="k" style="font-family:var(--sans);font-size:7.3pt;letter-spacing:.1em;text-transform:uppercase;color:#6b7787;font-weight:800">Beneficiary bank details</div>' +

        '<div class="ph">' + e((pay.beneficiaryNote || '[BANK DETAILS TO BE CONFIRMED — A/C No. / SWIFT intentionally not generated]')) + '</div></div>';

    html += '<div class="two"><div class="notes"><h5>Notes &amp; conditions</h5><ol>';

    (d.items || []).forEach(function (it) { if (it.dangerousGoods && it.dangerousGoods.ghsSummary) html += '<li>' + e(it.name) + ' — ' + e(it.dangerousGoods.ghsSummary) + '. Handle with care: use eye protection; avoid dust generation.</li>'; });
    (d.documents || []).length && (html += '<li>Documents: ' + (d.documents || []).map(function (x) { return e(x.name); }).join('; ') + '.</li>');
