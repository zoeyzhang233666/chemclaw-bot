<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[模拟] 海外询盘企业核验报告 · 印度尼西亚 · 重质纯碱</title>
<meta name="description" content="海外询盘企业核验报告 · 身份核验 / 业务相关性 / 网站域名与联系方式 / 公开风险 / 待补充资料">
<style>
/* overseas-inquiry-kyc · 报告样式
   设计取向：外贸尽调桌面端的“纸质报告 + 工作台”混合体。
   底色暖白、强调色深青绿（≈ 化工/航运感），疑点用砖红，未核实用石墨灰。
   所有颜色集中在 :root，换主题只改这里。 */

:root {
  --ink: #10161c;
  --ink-2: #2b3742;
  --ink-3: #5b6875;
  --ink-4: #8a95a1;
  --line: #e3e6e3;
  --line-2: #eef0ee;
  --paper: #fbfaf7;
  --paper-2: #ffffff;
  --paper-3: #f4f4ef;

  --brand: #0e5b52;
  --brand-2: #14746a;
  --brand-3: #e3f0ed;
  --brand-4: #b9d8d2;

  --ok: #1b6b3a;
  --ok-bg: #e7f2ea;
  --warn: #8a4b00;
  --warn-bg: #fbf0dc;
  --bad: #a8321f;
  --bad-bg: #fbe9e6;
  --gray: #424b55;
  --gray-bg: #e9ecef;
  --na: #5d6672;
  --na-bg: #eef0f2;

  --accent: #c2703a;

  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --sh-1: 0 1px 2px rgba(16, 22, 28, .06), 0 1px 1px rgba(16, 22, 28, .04);
  --sh-2: 0 2px 6px rgba(16, 22, 28, .07), 0 8px 24px rgba(16, 22, 28, .06);
  --sh-3: 0 12px 40px rgba(16, 22, 28, .16);

  --ff: "Georgia", "Songti SC", "SimSun", "Noto Serif SC", serif;
  --ff-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  --ff-mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;

  --wrap: 1280px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 84px; }

body {
  margin: 0;
  font-family: var(--ff-sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 400px at 50% -120px, #eef3f0 0%, transparent 70%),
    var(--paper);
  font-size: 14.5px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--brand-2); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: .01em; }
p { margin: 0 0 .6em; }

/* ------------------------------------------------------------ 顶部模拟横幅 */
.mock-bar {
  background: repeating-linear-gradient(135deg, #1f1408, #1f1408 10px, #2a1b09 10px, #2a1b09 20px);
  color: #ffd9a8;
  font-size: 12.5px;
  padding: 8px 20px;
  text-align: center;
  letter-spacing: .04em;
  border-bottom: 1px solid #4a3312;
}
.mock-bar b { color: #ffb35c; }

/* ------------------------------------------------------------ 顶部导航 */
.nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(251, 250, 247, .93);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: var(--wrap); margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 20px; height: 58px;
}
.nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.nav-brand .dot {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, var(--brand), var(--brand-2));
  display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800;
}
.nav-links { display: flex; gap: 2px; margin-left: 8px; overflow-x: auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links button {
  border: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--ink-3);
  padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
}
.nav-links button:hover { background: var(--paper-3); color: var(--ink); }
.nav-links button.on { background: var(--brand); color: #fff; }
.nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.nav-meta { font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; }

.btn {
  border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2);
  font: inherit; font-size: 13px; padding: 7px 13px; border-radius: var(--r-sm);
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--paper-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.ghost { background: transparent; }
.btn.sm { font-size: 12px; padding: 4px 9px; }
.btn:focus-visible, .nav-links button:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }

/* ------------------------------------------------------------ 版心 */
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
.section { padding: 40px 0 8px; }
.section + .section { border-top: 1px solid var(--line-2); }

.sec-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.sec-head .idx {
  font-family: var(--ff-mono); font-size: 12px; color: var(--brand-2);
  background: var(--brand-3); border: 1px solid var(--brand-4);
  padding: 3px 8px; border-radius: var(--r-xs); letter-spacing: .06em;
}
.sec-head h2 { font-family: var(--ff); font-size: 25px; }
.sec-head .sub { color: var(--ink-3); font-size: 13.5px; }
.sec-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

/* ------------------------------------------------------------ 封面 */
.hero { padding: 44px 0 10px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 28px; align-items: start; }
@media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; } }

.kicker {
  font-family: var(--ff-mono); font-size: 11.5px; letter-spacing: .18em;
  color: var(--brand-2); text-transform: uppercase; margin-bottom: 10px;
}
.hero h1 { font-family: var(--ff); font-size: 40px; line-height: 1.16; letter-spacing: -.01em; }
.hero .lede { color: var(--ink-2); font-size: 16px; margin-top: 12px; max-width: 66ch; }
.hero .lede b { color: var(--ink); }

.verdict {
  margin-top: 18px; border-left: 3px solid var(--brand);
  background: linear-gradient(90deg, var(--brand-3), transparent 85%);
  padding: 12px 16px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.verdict .lbl { font-size: 11.5px; letter-spacing: .12em; color: var(--brand); font-weight: 700; text-transform: uppercase; }
.verdict .txt { font-size: 15.5px; color: var(--ink); margin-top: 3px; }

.meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.meta-cell {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 9px 12px;
}
.meta-cell .k { font-size: 11px; color: var(--ink-4); letter-spacing: .06em; }
.meta-cell .v { font-size: 13.5px; color: var(--ink); font-weight: 600; }

/* 状态环 */
.donut-card {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 20px; box-shadow: var(--sh-1);
}
.donut { display: flex; gap: 18px; align-items: center; }
.donut svg { flex: 0 0 auto; }
.donut .legend { display: grid; gap: 7px; flex: 1; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
.legend-row:hover { background: var(--paper-3); }
.legend-row .sw { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
.legend-row .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
.legend-row.off { opacity: .38; }

/* 小色块 */
.sw.verified { background: var(--ok); }
.sw.discrepancy { background: var(--bad); }
.sw.unverified { background: var(--gray); }
.sw.not_applicable { background: var(--na); }

/* ------------------------------------------------------------ 区块成绩条 */
.scorecard { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
@media (max-width: 1100px) { .scorecard { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.score-cell {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit;
  transition: box-shadow .18s, transform .18s, border-color .18s;
  position: relative; overflow: hidden;
}
.score-cell:hover { box-shadow: var(--sh-2); transform: translateY(-2px); border-color: var(--brand-4); }
.score-cell .id { font-family: var(--ff-mono); font-size: 11px; color: var(--ink-4); letter-spacing: .1em; }
.score-cell .t { font-weight: 700; font-size: 14.5px; margin: 2px 0 8px; }
.score-cell .bar { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--paper-3); }
.score-cell .bar i { display: block; height: 100%; }
.score-cell .nums { display: flex; gap: 10px; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
.score-cell .nums b { font-variant-numeric: tabular-nums; }
.score-cell .flag {
  position: absolute; top: 10px; right: 10px; font-size: 10.5px; font-weight: 700;
  color: var(--bad); background: var(--bad-bg); border-radius: 99px; padding: 1px 7px;
}

/* ------------------------------------------------------------ 卡片 & 通用 */
.card {
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: var(--r-md); box-shadow: var(--sh-1);
}
.card.pad { padding: 18px 20px; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-h h3 { font-size: 15.5px; }
.card-h .right { margin-left: auto; font-size: 12px; color: var(--ink-4); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 980px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600;
  border: 1px solid transparent; white-space: nowrap;
}
.chip.verified { color: var(--ok); background: var(--ok-bg); border-color: #c9e3d1; }
.chip.discrepancy { color: var(--bad); background: var(--bad-bg); border-color: #f0cdc6; }
.chip.unverified { color: var(--gray); background: var(--gray-bg); border-color: #d9dee3; }
.chip.not_applicable { color: var(--na); background: var(--na-bg); border-color: #e0e2e5; }
.chip.sev-high { color: #fff; background: var(--bad); }
.chip.sev-medium { color: var(--warn); background: var(--warn-bg); border-color: #f0dcb8; }
.chip.sev-low { color: var(--ink-3); background: var(--paper-3); border-color: var(--line); }
.chip.ghost { background: transparent; border-color: var(--line); color: var(--ink-3); }
.chip.grade-a { color: #fff; background: #28566b; }
.chip.grade-b { color: #1d4f7a; background: #e3eef8; border-color: #c7dcef; }
.chip.grade-c { color: #6b4c00; background: #faf1d9; border-color: #eeddb0; }
.chip.grade-d { color: #5c5f66; background: #eff0f1; border-color: #dcdee0; }

.mono { font-family: var(--ff-mono); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.tiny { font-size: 12px; }
.right { text-align: right; }

/* ------------------------------------------------------------ 询盘邮件模拟 */
.mail {
  border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
  background: var(--paper-2); box-shadow: var(--sh-1);
  position: relative;
}
.mail::after {
  content: "MOCK · 模拟询盘 · 非真实企业";
  position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg);
  font-family: var(--ff); font-size: 46px; font-weight: 700; letter-spacing: .08em;
  color: rgba(168, 50, 31, .07); pointer-events: none; white-space: nowrap;
}
.mail-top {
  background: var(--paper-3); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: grid; gap: 4px;
}
.mail-top .subj { font-weight: 700; font-size: 14.5px; }
.mail-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.mail-row b { color: var(--ink-2); font-weight: 600; }
.mail-body { padding: 18px 20px; font-family: var(--ff); font-size: 14px; line-height: 1.75; white-space: pre-wrap; color: var(--ink-2); }
.mail-body .hi { background: #fff4d6; border-bottom: 1px solid #e8cf8a; }
.mail-foot { border-top: 1px dashed var(--line); padding: 10px 20px; font-size: 12px; color: var(--ink-4); }

/* 名片 */
.bizcard {
  aspect-ratio: 1.75; border-radius: var(--r-md); padding: 18px 20px;
  background: linear-gradient(140deg, #10302c, #0e5b52 55%, #14746a);
  color: #e7f4f1; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: var(--sh-2); position: relative; overflow: hidden;
}
.bizcard::before {
  content: ""; position: absolute; right: -60px; bottom: -80px; width: 220px; height: 220px;
  border-radius: 50%; background: rgba(255, 255, 255, .06);
}
.bizcard .logo { font-family: var(--ff-mono); font-size: 11px; letter-spacing: .22em; opacity: .8; }
.bizcard .nm { font-size: 20px; font-weight: 700; }
.bizcard .ps { font-size: 12px; opacity: .85; margin-top: 2px; }
.bizcard .ct { font-size: 11.5px; line-height: 1.7; opacity: .92; font-family: var(--ff-mono); }

/* ------------------------------------------------------------ 字段提取表 */
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th, table.tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.tbl th { font-size: 11.5px; letter-spacing: .04em; color: var(--ink-4); font-weight: 600; background: var(--paper-3); position: sticky; top: 0; }
table.tbl tr:hover td { background: #fcfcfa; }
table.tbl td.k { font-weight: 600; color: var(--ink-3); white-space: nowrap; }

/* ------------------------------------------------------------ 核验项卡片 */
.toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 10px 12px; margin-bottom: 16px; position: sticky; top: 66px; z-index: 40;
  box-shadow: var(--sh-1);
}
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--paper-2);
  border-radius: 999px; padding: 4px 11px; cursor: pointer; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 6px;
}
.filters button .cnt { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--ink-4); }
.filters button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.filters button.on .cnt { color: rgba(255, 255, 255, .7); }
.toolbar .search {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 3px 9px; background: var(--paper-2);
}
.toolbar .search input { border: 0; outline: none; font: inherit; font-size: 13px; width: 190px; background: transparent; }

.checks { display: grid; gap: 10px; }

.chk {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden; transition: box-shadow .15s, border-color .15s;
  border-left: 3px solid var(--line);
}
.chk:hover { box-shadow: var(--sh-1); }
.chk.is-verified { border-left-color: var(--ok); }
.chk.is-discrepancy { border-left-color: var(--bad); }
.chk.is-unverified { border-left-color: var(--ink-4); }
.chk.is-not_applicable { border-left-color: var(--na); }

.chk-head { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; cursor: pointer; }
.chk-head .id { font-family: var(--ff-mono); font-size: 11.5px; color: var(--ink-4); padding-top: 3px; letter-spacing: .06em; }
.chk-head .t { font-weight: 700; font-size: 14.5px; }
.chk-head .q { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.chk-head .tags { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.chk-head .caret { color: var(--ink-4); transition: transform .2s; font-size: 11px; }
.chk.open .caret { transform: rotate(90deg); }

.chk-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid var(--line-2); }
.chk.open .chk-body { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

.finding { font-size: 13.5px; color: var(--ink-2); margin: 12px 0; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cols3 { grid-template-columns: 1fr; } }
.col-box { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--paper); }
.col-box .h { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.col-box.verified .h { color: var(--ok); }
.col-box.doubt .h { color: var(--bad); }
.col-box.unknown .h { color: var(--gray); }
.col-box ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); }
.col-box li { margin: 2px 0; }

.boundary {
  margin-top: 12px; font-size: 12.5px; color: var(--ink-3);
  background: var(--paper-3); border-radius: var(--r-sm); padding: 9px 12px;
  border-left: 2px solid var(--line);
}
.boundary b { color: var(--ink-2); }

.srcrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.src-pill {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--paper-2); border-radius: 999px; padding: 2px 10px 2px 4px; font-size: 12px;
}
.src-pill:hover { border-color: var(--brand-4); background: var(--brand-3); text-decoration: none; }

.nextrow { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.nextrow .lbl { color: var(--ink-4); font-weight: 600; }

/* ------------------------------------------------------------ 矩阵 */
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper-2); }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; min-width: 860px; }
table.matrix th, table.matrix td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); text-align: center; vertical-align: middle; }
table.matrix th { background: var(--paper-3); font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
table.matrix td.l, table.matrix th.l { text-align: left; }
table.matrix td.rowh { text-align: left; font-weight: 600; color: var(--ink-2); max-width: 200px; }
.cell { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; }
.cell.same { color: var(--ok); }
.cell.partial { color: var(--warn); }
.cell.different { color: var(--bad); }
.cell.misattribution { color: #fff; background: var(--bad); padding: 1px 7px; border-radius: 99px; }
.cell.unknown { color: var(--ink-4); }
.kw-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ------------------------------------------------------------ 风险表 */
.risklist { display: grid; gap: 8px; }
.risk-item {
  display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: start;
  background: var(--paper-2); border: 1px solid var(--line); border-left: 3px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 14px;
}
.risk-item.high { border-left-color: var(--bad); }
.risk-item.medium { border-left-color: #d08b1a; }
.risk-item.low { border-left-color: var(--ink-4); }
.risk-item .rid { font-family: var(--ff-mono); font-size: 11.5px; color: var(--ink-4); padding-top: 2px; }
.risk-item .fact { font-size: 13.5px; }
.risk-item .impact { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.risk-item .act { font-size: 12.5px; color: var(--brand); margin-top: 5px; }
.risk-item .tags { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }

/* ------------------------------------------------------------ 资料清单 */
.req { display: grid; gap: 8px; }
.req-item {
  display: grid; grid-template-columns: 26px 54px 1fr auto; gap: 12px; align-items: center;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 13px;
}
.req-item.done { background: var(--ok-bg); border-color: #c9e3d1; }
.req-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
.prio { font-family: var(--ff-mono); font-size: 11px; font-weight: 700; text-align: center; padding: 2px 0; border-radius: 4px; }
.prio.P0 { background: var(--bad-bg); color: var(--bad); }
.prio.P1 { background: var(--warn-bg); color: var(--warn); }
.prio.P2 { background: var(--gray-bg); color: var(--gray); }
.req-item .zh { font-weight: 600; font-size: 13.5px; }
.req-item .en { font-size: 12px; color: var(--ink-3); margin-top: 2px; font-style: italic; }
.req-item .why { font-size: 12px; color: var(--ink-4); margin-top: 2px; }
.req-item.done .zh { text-decoration: line-through; color: var(--ink-3); }

/* ------------------------------------------------------------ 行动时间轴 */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl-item { position: relative; padding: 0 0 14px 0; }
.tl-item::before {
  content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--paper-2); border: 2px solid var(--brand); box-sizing: border-box;
}
.tl-item.p0::before { border-color: var(--bad); }
.tl-item .ph { font-family: var(--ff-mono); font-size: 11.5px; color: var(--ink-4); letter-spacing: .06em; }
.tl-item .t { font-weight: 600; font-size: 13.5px; }
.tl-item .d { font-size: 12.5px; color: var(--ink-3); }
.tl-item .o { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }

/* ------------------------------------------------------------ 消息草稿 */
.msg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.msg-tab {
  font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--paper-2);
  border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink-3);
}
.msg-tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.msg-body {
  background: #fbfbf8; border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 16px; font-family: var(--ff-mono); font-size: 12.5px; line-height: 1.75;

}
.msg-notes { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }
.msg-notes li { margin: 2px 0; }

/* ------------------------------------------------------------ 来源库 */
.srclist { display: grid; gap: 8px; }
.src-item {
  display: grid; grid-template-columns: 74px 96px 1fr; gap: 12px; align-items: start;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 13px;
  scroll-margin-top: 130px;
}

.src-item .sid { font-family: var(--ff-mono); font-size: 12px; font-weight: 700; color: var(--brand); }
.src-item .nm { font-weight: 600; font-size: 13px; }

.hbars { display: grid; gap: 9px; }

.hbar .tr i { display: block; height: 100%; }
.hbar .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

/* ------------------------------------------------------------ 抽屉 */
.drawer-mask {
  position: fixed; inset: 0; background: rgba(16, 22, 28, .38); opacity: 0;
  pointer-events: none; transition: opacity .2s; z-index: 90; backdrop-filter: blur(2px);
}
.drawer-mask.on { opacity: 1; pointer-events: auto; }
.drawer {

  background: var(--paper-2); box-shadow: var(--sh-3); transform: translateX(102%);

  display: flex; flex-direction: column;

.drawer-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }

.foot { padding: 34px 0 60px; color: var(--ink-4); font-size: 12.5px; }
.foot .box { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 6px; }

}

吨袋，与浮法玻璃窑的投料与仓储方式一致；轻质纯碱才常用于洗涤/日化。"},{"id":"S02","signal":"规格水平","status":"verified","strength":"medium","note":"Na₂CO₃ ≥ 99.2% 属常见工业级要求，与玻璃级纯碱的行业惯例一致。"},{"id":"S03","signal":"采购量与自述产能的匹配","status":"unverified","strength":"medium","note":"两座浮法窑配 25,000 MT/年纯碱在数量级上并非不合理，但“120 万 m²/年”的玻璃产能与之不匹配，需要一个说法。"},{"id":"S04","signal":"物流与港口逻辑","status":"verified","strength":"medium","note":"Tanjung Priok 是雅加达主港，CFR 条款合理；CIF Surabaya 则对应另一条收货路径，需确认最终工厂位置。"},{"id":"S05","signal":"贸易 vs 制造身份","status":"unverified","strength":"high","note":"邮件同时出现“glass manufacturer”和“official importer with own warehouse”，两种身份都成立也可以，但决定了我方报价口径与合同主体。"}]},"checks":[{"id":"K01","section":"A","title":"企业是否真实存在（登记检索）","status":"unverified","severity":"high","source_ids":["SRC01","SRC02"],"question":"在 AHU Online 与 OSS 上，能否检索到与“PT Sinar Kaca Nusantara”完全一致的登记主体？","finding":"模拟环境未完成登记检索：对方未提供 NIB/Perseroan 登记号，也未提供营业执照扫描件。缺少 NIB 时，按全称检索可能出现同名、近似名或查无结果等多种情况。","verified_facts":["对方自称法律形式为 PT（印尼有限责任公司），这一形式本身是印尼最常见的法人类型，不等于已登记。"],"doubts":[],"unknowns":["登记全称与登记号（Perseroan）","NIB 与 OSS 许可状态","成立日期","注册地址","经营范围 KBLI 明细"],"boundary":"“查不到”可能来自名称写法、企业类型差异或登记未收录，不能据此判定虚假；只有“存在且资料互相矛盾”才能写“存在疑点”。","next_ids":["Q01","Q02","Q05"],"action":"请对方提供 NIB（13 位）与 AHU 登记的批准文号；自己动手在 AHU Online 用全称与注册号两路检索并留证。"},{"id":"K02","section":"A","title":"公司名称与登记名称是否一致","status":"unverified","severity":"medium","source_ids":["SRC01"],"question":"邮件与签名中的名称，是否与登记证书上的名称逐字一致？","finding":"无法比对：缺少登记证书。已完成的是一致性检查——邮件抬头、正文、签名、附件抬头四处均写作“PT Sinar Kaca Nusantara”。","verified_facts":["名称在询盘内部四处一致（提取结果 X01、矩阵 M01）。"],"doubts":[],"unknowns":["登记证书上的全称（是否含句点、是否缩写 Nusantara）","是否存在同名分店/分支（Kantor Cabang）"],"boundary":"内部一致只能证明“文案自洽”，不能证明“登记存在”，两者必须分开写。","next_ids":["Q01","Q03"],"action":"索取 AKTA Pendirian（公司章程公证件）首页与 SK Kemenkumham 批准页。"},{"id":"K03","section":"A","title":"公证/章程与签章一致性","status":"unverified","severity":"medium","source_ids":["SRC01"],"question":"若后续收到章程或授权书，其公司名、董事签名、印章与询盘主体是否一致？","finding":"尚未收到任何盖章文件，暂无可比对对象。","verified_facts":[],"doubts":[],"unknowns":["签章样式","董事（Direktur）姓名与授权","印章与登记名称是否一致"],"boundary":"印尼公证件常用印尼语；核对时不要只看英文翻译件，要同时看 docx 原文与译文对应关系。","next_ids":["Q03","Q06"],"action":"收到文件后，逐项比对：名称拼写、地址、董事姓名、印章文字。"},{"id":"K04","section":"A","title":"同名企业 / 近似名主体排查","status":"unverified","severity":"high","source_ids":["SRC01","SRC04"],"question":"是否存在同名或高度近似名企业，导致资料被错误关联？","finding":"“Sinar Kaca”在印尼是常见的行业命名组合（Sinar = 光，Kaca = 玻璃），出现在不同城市的不同 PT 上是完全可能的。在未取得登记号之前，任何检索到的“Sinar Kaca”类企业都不能直接与本询盘主体合并。","verified_facts":[],"doubts":[],"unknowns":["是否有同名 PT 在其他城市","是否有名称相似的 CV/UD（个体与合伙制）"],"boundary":"这是本方法最重要的一条纪律：只有登记号/NIB 相同才是同一主体；名称相同、域名相似、Logo 相似都不构成同一性。","next_ids":["Q01","Q02"],"action":"检索时同时记录：登记号、城市、成立日期、KBLI，四项齐备才允许建立关联。"},{"id":"K05","section":"A","title":"询盘背景自述（成立年份、产能、仓库）","status":"unverified","severity":"medium","source_ids":["SRC04"],"question":"2011 年成立、两座浮法窑、120 万 m²/年、丹戎不碌附近自有仓库，这些自述能否被公开来源印证？","finding":"全部来自对方自述，未获第三方印证。其中“120 万 m²/年”与“两座浮法窑”在数量级上偏低，是值得追问的具体点（不是矛盾，而是口径不清）。","verified_facts":[],"doubts":["玻璃产能口径疑似不完整（m² 与重量箱/吨混用，或仅计一条线）"],"unknowns":["熔窑日熔化量（t/d）","玻璃品种与厚度结构","仓库地址与租约"],"boundary":"自述信息只能归为 D 级线索；产能口径不一致要写“口径待澄清”，不写“虚报”。","next_ids":["Q07","Q08"],"action":"用一份标准《供应商/客户背景表》让对方填：熔窑数量、日熔化量、年投料结构、仓库地址。"},{"id":"K06","section":"B","title":"主营业务与询价产品是否相关","status":"verified","severity":"low","source_ids":["SRC04","SRC05"],"question":"作为玻璃制造企业，询价重质纯碱是否属于其正常业务？","finding":"属于高度相关的正常采购：重质纯碱是浮法/器皿玻璃熔制的主要助熔剂，是纯碱最大下游之一（玻璃约占全球纯碱消费的一半以上）。对方指定 dense 形态与吨袋包装，也符合玻璃窑的投料习惯。","verified_facts":["产品用途与对方自称行业一致（B01/23111 平板玻璃制造为纯碱核心下游）。","规格与形态（dense、≥99.2%、吨袋）与玻璃级采购惯例一致。"],"doubts":[],"unknowns":["对方是否登记 KBLI 23111（制造）或仅有 46651/46632（贸易）"],"boundary":"“业务相关”只说明询价合理，不说明主体真实，也不说明规模属实。","next_ids":["Q05","Q07"],"action":"把 KBLI 明细作为业务相关性的硬证据：有 23111 才能称“自己生产玻璃”。"},{"id":"K07","section":"B","title":"登记业务分类（KBLI）与询价匹配度","status":"unverified","severity":"high","source_ids":["SRC03","SRC05"],"question":"OSS 上的 KBLI 是否同时覆盖玻璃制造与化工品批发？","finding":"未取得 NIB，无法读取 KBLI。已准备好对照口径：23111（平板玻璃制造）、46651（化工品批发）、46632（玻璃批发）、52101（仓储）。四种分类对应四种完全不同的商业模式与采购量。","verified_facts":["KBLI 23111 = Industri Kaca Lembaran（平板玻璃制造），46651 = Perdagangan Besar Bahan dan Barang Kimia（化工品批发）——口径来源见 SRC03。"],"doubts":[],"unknowns":["该公司 NIB 上的主 KBLI 与副 KBLI","是否有 23111","许可是否处于 active 状态"],"boundary":"KBLI 是业务分类，不是“能不能做”的许可；但 KBLI 与自述身份矛盾时，必须要求解释。","next_ids":["Q01","Q02"],"action":"拿到 NIB 后在 OSS 查询 KBLI 明细，与 B01–B04 逐条对照。"},{"id":"K08","section":"B","title":"采购规模与自述产能的量化关系","status":"unverified","severity":"medium","source_ids":["SRC04"],"question":"25,000 MT/年纯碱，与“两座浮法窑、120 万 m²/年”的玻璃产能是否算得通？","finding":"量级与“两座浮法窑”大体相容，但与“120 万 m²/年”不相容：按常见浮法玻璃的纯碱单耗反算，两个数据无法同时成立，说明至少有一个口径不完整。","verified_facts":["25,000 MT/年 ≈ 2,083 MT/月，属中等规模工业采购（8–10 标箱/月量级或整车散货）。"],"doubts":["玻璃产能单位（m²/年）与熔窑能力（t/d）之间缺少换算所需数据"],"unknowns":["熔窑日熔化量","纯碱单耗（kg/t 玻璃）","玻璃厚度结构","是否含外协加工用量"],"boundary":"算不通不等于造假；常见原因是口径不同（只算一条线、只算成品面积、或把加工玻璃当原片）。要求对方补充数据即可。","next_ids":["Q07","Q08"],"action":"请对方填写熔窑与投料结构表，再按 kg 纯碱/t 玻璃 反算验证。"},{"id":"K09","section":"B","title":"进口商身份与采购角色","status":"unverified","severity":"medium","source_ids":["SRC04","SRC06"],"question":"对方是最终用户（工厂自用）、进口分销商，还是仅代第三方询价的中间人？","finding":"三种角色的采购条件完全不同：自用工厂看配方与稳定供货；分销商看价格与资金周转；中间人看佣金。对方自称 official importer 与 manufacturer 并存，需先定角色，再定报价与合同主体。","verified_facts":[],"doubts":[],"unknowns":["进口商识别号（API-U）","是否代其他工厂询价","是否要求独家代理"],"boundary":"“中间人”本身不是风险，但合同主体、付款主体、收货主体必须一致或明确授权。","next_ids":["Q02","Q09"],"action":"在回信中直接询问：合同签字主体、收货人、进口报关主体是否为同一法人。"},{"id":"K10","section":"B","title":"规格与包装的技术合理性","status":"verified","severity":"low","source_ids":["SRC05"],"question":"对方提出的规格、包装与交付条款，是否符合该行业的通行做法？","finding":"合格：dense soda ash + Na₂CO₃ ≥99.2% + 1,000 kg 吨袋 + CFR Tanjung Priok 都是玻璃行业通用的表述。缺少的技术项是堆积密度区间、粒度分布、铁含量（Fe₂O₃）与白度——这些恰恰是玻璃客户最关心的杂质。","verified_facts":["产品形态与工业用途吻合。"],"doubts":[],"unknowns":["Fe₂O₃ 上限（玻璃品质关键）","堆积密度与粒度分布","是否要求特定品牌/原产地"],"boundary":"规格写得“合理”不代表对方真懂，也不代表一定买单；缺项应补进我方标准技术问卷。","next_ids":["Q10"],"action":"回信附《技术问卷 TDS 确认表》，重点确认 Fe₂O₃、粒度与堆积密度。"},{"id":"K11","section":"C","title":"官网是否可用且与企业对应","status":"unverified","severity":"high","source_ids":["SRC04"],"question":"www.sinarkacanusa.co.id 是否存在、可访问，且页面上写明同一公司名？","finding":"模拟环境未抓取。需按固定顺序核对：① 是否可解析访问；② About/Footer 是否出现同一公司名；③ 是否有 Products（玻璃、浮法线）与 Contact（地址、电话、邮箱）页面；④ 页面是否有可核对的老照片/设备照片。","verified_facts":[],"doubts":[],"unknowns":["网站可访问性","页面公司名","Contact 页邮箱域","网站版权年份与最后更新"],"boundary":"域名注册时间早/晚都不能证明或否证企业真实性；网站可能是代理商做的模板站，也可能刚上线。","next_ids":["Q04"],"action":"分工截图存档：首页、About、Products、Contact 各一张，标注抓取时间。"},{"id":"K12","section":"C","title":"域名、企业邮箱与发信真实性","status":"unverified","severity":"high","source_ids":["SRC07"],"question":"发信邮箱与企业域名是否同一体系，发信服务器是否可信？","finding":"后缀一致（From 与 Reply-To 均为 @sinarkacanusa.co.id，未跳到免费邮箱），这是正面信号；但 SPF/DKIM/DMARC 与邮件头 Received 链均未核验，无法判断是否有人伪造显示名。","verified_facts":["From / Reply-To / 签名三处邮箱域一致（矩阵 M03、email_auth 表）。"],"doubts":[],"unknowns":["SPF 记录","DMARC 策略","原始邮件头的首跳 IP","MX 服务商是否为企业邮箱服务"],"boundary":"后缀一致只能排除“最粗糙的冒用”，不能排除“用相似域名伪装成对方”；必须结合 WHOIS、官网与回拨确认。","next_ids":["Q04","Q11"],"action":"保存 .eml 原始文件，查 Received 链与 SPF 记录；同时改由电话/视频回拨确认对方身份。"},{"id":"K13","section":"C","title":"地址交叉验证","status":"unverified","severity":"medium","source_ids":["SRC04"],"question":"签名栏地址、正文所述厂区与注册地址能否互相解释？","finding":"签名栏写的是 Cakung, Jakarta Timur 13910（东雅加达工业区），正文说厂区在 Bekasi 工业区。两地相邻但属不同行政区：可以同时成立（注册/办公在 Cakung，工厂在 Bekasi），但这意味着必须区分三个地址：注册地址、工厂地址、仓库地址。","verified_facts":["签名栏地址与邮编 13910 的区域（Cakung）表面自洽。"],"doubts":["正文“Bekasi”与签名“Jakarta Timur”的关系未说明；若工厂真在 Bekasi，为何签名地址是 Cakung 需要解释（办公地/注册地 vs 厂区）。"],"unknowns":["AHU 上的注册地址","工厂门牌地址","仓库地址"],"boundary":"地址不一致本身很常见（注册地≠工厂≠仓库），只有无法解释的地址矛盾才升级为疑点。本条按“部分一致”处理。","next_ids":["Q01","Q06"],"action":"索取三个地址并要求对方说明各自用途；后续可用 Google Maps 街景与工牌照交叉验证。"},{"id":"K14","section":"C","title":"电话与企业渠道","status":"unverified","severity":"medium","source_ids":["SRC04"],"question":"除了个人手机号，是否存在可核验的公司固定电话或官方渠道？","finding":"仅提供 +62 812 开头的手机号（Telkomsel 移动号段）。中小外贸企业只给手机是常态，但零米级原料采购通常有公司总机或采购部门邮箱。","verified_facts":[],"doubts":[],"unknowns":["公司总机","采购部门公共邮箱","WhatsApp Business 账号归属"],"boundary":"手机号不是负面证据；但它不能作为“企业真实存在”的证据，也不能作为唯一联络渠道。","next_ids":["Q04","Q11"],"action":"索取公司总机与采购部公共邮箱；所有关键确认走“邮件 + 回拨”双通道。"},{"id":"K15","section":"C","title":"联系人身份","status":"unverified","severity":"low","source_ids":["SRC04"],"question":"Andi Pratama Wibowo 是否确为该公司的采购负责人？","finding":"邮件与名片自述一致（Senior Procurement Manager），但未见官网团队页、LinkedIn 任职或其他独立来源。","verified_facts":["职位在邮件与名片两处一致。"],"doubts":[],"unknowns":["LinkedIn/领英任职记录","邮箱是否为个人账户还是部门账户"],"boundary":"人名与职位可核对，但“存在这个人”不等于“这个人有权代表公司签约”；授权需要在后续合同阶段由公司出具。","next_ids":["Q04","Q09"],"action":"视频会议核对身份，并在报价阶段要求公司授权书（Surat Kuasa）。"},{"id":"K16","section":"C","title":"资料提供条件（NDA 前置）","status":"discrepancy","severity":"low","source_ids":["SRC04"],"question":"对方以“签署 NDA 后才提供注册文件”为条件，是否会影响核验？","finding":"这是流程性条件，被列为疑点不是因为违规，而是因为它使关键主体核验在时间上后置。常见做法是先提供不含商业机密的证照首页（可打码敏感号段），NDA 只用于保护配方、客户名单等商业信息。","verified_facts":["对方在正文中明确说明“Company registration documents are available upon signing of an NDA”。"],"doubts":["把“注册证照”与“商业机密”绑定在同一个 NDA 条件里，使对方在我方完成核验前掌握节奏。"],"unknowns":["NDA 是否为单方模板","签署 NDA 是否会触发排他或泄密责任条款"],"boundary":"NDA 前置≠不合理要求；采购方也常用。写疑点时要说清“影响的是时序，不是真实性”。","next_ids":["Q03"],"action":"回信提出“证照首页脱敏先行 + NDA 只在讨论配方/客户时签署”。"},{"id":"K17","section":"D","title":"经营异常与信用负面（印尼）","status":"unverified","severity":"high","source_ids":["SRC08"],"question":"是否存在公开的经营异常、税务、许可失效或失信信息？","finding":"未检索到任何正面或负面公开信息，因为没有可检索的锚点（NIB/NPWP）。拿到 NIB 后可查 OSS 许可状态、印尼税务局状态、以及公开诉讼/仲裁数据库。","verified_facts":[],"doubts":[],"unknowns":["许可是否 active","是否被列入受限名单","是否有商事判决"],"boundary":"“搜不到负面”与“没有负面”不是一件事；未完成检索前一律写“未核实”，不写“无风险”。","next_ids":["Q01","Q02"],"action":"NIB 到手后 48 小时内完成 OSS 许可状态核查并截图存档。"},{"id":"K18","section":"D","title":"制裁与出口管制筛查","status":"unverified","severity":"medium","source_ids":["SRC09","SRC10"],"question":"交易对手、付款行、收货人是否出现在制裁名单或受限清单上？","finding":"尚未执行名单筛查；纯碱本身不是典型两用/管制物项，但买方、银行、最终收货地仍需过一遍名单。","verified_facts":["纯碱（HS 2836.20）不在常见敏感物项清单中，出口管制关注度低。"],"doubts":[],"unknowns":["公司名与联系人在 OFAC/EU/UN 名单上的匹配结果","付款银行与付款账户国别"],"boundary":"未做筛查就签合同，是出口业务最常见的合规漏洞；一次名单检索成本极低。","next_ids":["Q11"],"action":"用 SRC09/SRC10 的名单接口做一次模糊匹配，保存检索截图；命中则要求解释。"},{"id":"K19","section":"D","title":"重大诉讼与负面报道","status":"unverified","severity":"medium","source_ids":["SRC08"],"question":"公开渠道是否有关于该公司的诉讼、破产、停产或重大负面报道？","finding":"未检索（缺少可检索锚点与当地语检索词）。建议用印尼语关键词组合检索，而不是只用英文名。","verified_facts":[],"doubts":[],"unknowns":["诉讼/仲裁记录","印尼语新闻","行业协会公告"],"boundary":"同名企业负面报道严禁直接归属；每条负面必须同时满足“名称 + 城市 + 行业”或“登记号”才可关联。","next_ids":["Q01","Q02"],"action":"用印尼语检索：\"PT Sinar Kaca Nusantara\" + 城市 + 玻璃；结果逐条做归属判断。"},{"id":"K20","section":"D","title":"反洗钱与付款路径","status":"unverified","severity":"high","source_ids":["SRC06"],"question":"对方提出的付款方式（30% 定金 + 70% 见提单副本）与账户名称是否安全？","finding":"这是对方“常态”的自述，不是我方承诺。真正需要核验的是：付款账户户名是否与合同主体一致；是否存在要求付至个人账户或第三国账户的倾向。","verified_facts":[],"doubts":[],"unknowns":["收款账户是否为印尼本地对公账户","户名与登记名称是否一致","是否接受 L/C at sight"],"boundary":"“见提单副本付款”对卖方风险偏高；这不是对方可疑，而是我方条款选择问题。","next_ids":["Q09","Q12"],"action":"明确以下任一：L/C at sight（可接受）、或 30% 定金 + 见提单副本付尾款的改进版、或银行保函；并核对账户户名。"},{"id":"K21","section":"D","title":"结构性与明显风险信号汇总","status":"verified","severity":"low","source_ids":["SRC04"],"question":"是否存在典型的异常联系渠道或不一致资料（如免费邮箱冒充企业、要求改收款账户等）？","finding":"已在询盘原文层面完成排查，未发现：① 免费邮箱（gmail/yahoo）冒充企业邮箱；② 邮件中的收款账户变更请求；③ 明显前后矛盾的报价条件；④ 冒充知名企业身份的迹象（对方名称并非任何知名品牌）。","verified_facts":["询盘在“渠道自洽性”这一层没有出现典型异常手法。","对方未以自己的名义套用其他知名企业的名称、Logo 或网站。"],"doubts":[],"unknowns":["官网是否存在与其他企业高度雷同的模板内容（需抓取后比对）"],"boundary":"“没发现异常手法”只是排除了一类，不等于安全；下一层要看主体与资金的真实对应。","next_ids":["Q04","Q11"],"action":"保留原邮件 PDF/EML；在合同签署前再做一次同样的渠道自洽性复查。"},{"id":"K22","section":"D","title":"贸易合规与最终用途（出口侧）","status":"unverified","severity":"low","source_ids":["SRC06"],"question":"重质纯碱出口印尼，是否需要特殊许可或最终用途声明？","finding":"纯碱为普通工业品，不属于两用物项；从出口侧看主要是中国方的报关、原产地与外汇收汇问题；从进口侧看，印尼对部分商品设 lartas（限制）要求，需按具体 HS 编码与最新 Permendag 核对是否涉及进口许可。","verified_facts":["HS 2836.20 为主要对照编码。"],"doubts":[],"unknowns":["印尼当前 lartas 清单对 2836.20 的覆盖情况","对方是否具备相应进口许可"],"boundary":"进口许可本质上是买方义务；但若对方无相应资质，可能导致无法清关、进而影响我方货款。","next_ids":["Q02","Q12"],"action":"核对最新印尼进口规定与本 HS 编码，把结果写入合同前检查表。"},{"id":"K23","section":"E","title":"资料清单完整性与确认节奏","status":"discrepancy","severity":"medium","source_ids":["SRC04"],"question":"现有资料是否足以支撑报价与合同？还缺哪些、按什么顺序要？","finding":"现有资料只能支撑“业务相关性”判断，不足以支撑报价与合同主体确认。按影响排序：NIB/KBLI 与登记证（决定是否真实存在）→ 地址三方对齐（决定物流与验厂）→ 付款与账户（决定收汇安全）→ 技术与产能数据（决定报价口径）。","verified_facts":["已形成 12 项索取的资料清单（Q01–Q12），按 P0/P1/P2 分级。"],"doubts":["当前资料包中没有任何可由第三方独立核验的文件，全部为自述。"],"unknowns":["对方是否愿意在签约前提供上述文件"],"boundary":"这是“资料缺口”而非“对方造假”；把它列成疑点，是因为它直接影响我方能否安全报价。","next_ids":["Q01","Q03","Q04"],"action":"用统一英文模板一次性发出 P0 清单，并要求 5 个工作日内回复。"},{"id":"K24","section":"E","title":"核验结论的可复核性","status":"verified","severity":"low","source_ids":["SRC01","SRC03"],"question":"本报告的每条结论是否都能点回来源、且区分了“缺失”与“矛盾”？","finding":"已完成：24 项核验项中，每一项都标注了状态（已核实/存在疑点/未核实）、来源 ID 与下一步动作；凡是“无法取得”的信息一律记为未核实，没有被包装成否定结论。","verified_facts":["报告内所有来源均可在“来源库”点开。","未使用“诈骗概率”等无依据表述，也未以域名注册时间判断企业真伪。"],"doubts":[],"unknowns":[],"boundary":"可复核性指的是过程，不是结论正确性；对方后续提供的材料可能改变全部结论。","next_ids":["Q01"],"action":"把本报告与对方回复一起归档，作为下次复核的基线。"}],"linkage":[{"id":"L01","name":"查询中可能出现的近似名主体（示例说明）","relation":"name_collision","detail":"“Sinar Kaca”“Kaca Nusantara”在印尼是高频组合词，可能在泗水、棉兰等地存在同名或近似名的 PT/CV。在取得登记号前，任何名称命中都不得与本询盘主体合并。","rule":"只有登记号/NIB 相同才判定同一主体。"},{"id":"L02","name":"官网域名与主体关系","relation":"domain_link","detail":"sinarkacanusa.co.id 的注册人可能是公司、也可能是代办商或个人；域名 WHOIS 只能说明“谁注册了域名”，不能说明“谁经营这家公司”。","rule":"域名只作佐证，不作判据。"},{"id":"L03","name":"贸易 vs 制造的两种解释","relation":"role_ambiguity","detail":"对方同时自称制造商与进口商。两种解释都合法，但对应不同的核验重点：制造商看玻璃产线与熔窑；进口商看 NIB/API-U 与仓库。","rule":"先定角色，再定资料清单与报价口径。"},{"id":"L04","name":"品牌冒用的排除","relation":"impersonation","detail":"本询盘未发现冒用其他已注册企业名称、Logo 或网站的迹象（对方名称与任何知名玻璃品牌均不重合）。此项已完成排查。","rule":"冒用判定的硬条件：用他人名称/标识对外交易，且非授权。"}],"risks":[{"id":"R01","category":"主体身份","severity":"high","status":"unverified","fact":"未取得 NIB/登记证，主体真实性无法核验。","impact":"无法确认合同相对方，报价与后续发运缺乏法律锚点。","source_ids":["SRC01","SRC02"],"action":"P0：索取 NIB 与 AHU 登记批准文号。","next_ids":[]},{"id":"R02","category":"业务身份","severity":"medium","status":"unverified","fact":"“玻璃制造商”与“official importer”两重身份并存，KBLI 未读取。","impact":"报价口径、合同主体、收货人可能不一致。","source_ids":["SRC03","SRC04"],"action":"索取 KBLI 明细并直接询问合同签字主体。","next_ids":[]},{"id":"R03","category":"规模口径","severity":"medium","status":"discrepancy","fact":"自述“两座浮法窑、120 万 m²/年”与 25,000 MT/年纯碱需求不能同时成立。","impact":"可能存在产能口径不清或采购用途不明（如转售/代购）。","source_ids":["SRC04"],"action":"要求填写熔窑 t/d 与投料结构表。","next_ids":[]},{"id":"R04","category":"联系方式","severity":"medium","status":"unverified","fact":"仅有个人手机，无公司总机；SPF/DMARC 与邮件头未核验。","impact":"一旦发生付款或改单指令，缺少双通道复核。","source_ids":["SRC04","SRC07"],"action":"索取总机；保存 .eml；回拨确认。","next_ids":[]},{"id":"R05","category":"地址一致性","severity":"low","status":"discrepancy","fact":"签名地址（Cakung, Jakarta Timur）与正文厂区（Bekasi）分属不同行政区。","impact":"验厂与物流决策需要三个地址分离处理。","source_ids":["SRC04"],"action":"索取注册地/工厂/仓库三个地址并说明用途。","next_ids":[]},{"id":"R06","category":"收汇安全","severity":"high","status":"unverified","fact":"对方自述的付款方式为 30% 定金 + 70% 见提单副本，账户信息未提供。","impact":"见提单副本放货，卖方在收到尾款前即失去货权控制。","source_ids":["SRC06"],"action":"坚持 L/C at sight 或提高定金比例；核对收款账户户名。","next_ids":[]},{"id":"R07","category":"合规筛查","severity":"medium","status":"unverified","fact":"尚未执行制裁名单与负面新闻筛查。","impact":"合规缺口，可能在付款银行端被拦截。","source_ids":["SRC09","SRC10"],"action":"执行一次名单筛查并留档。","next_ids":[]},{"id":"R08","category":"信息缺口","severity":"medium","status":"unverified","fact":"全部材料均为对方自述，无第三方可核验文件。","impact":"业务相关性判断成立，但主体与规模判断均不成立。","source_ids":["SRC04"],"action":"按 Q01–Q12 清单一次性索取。","next_ids":[]}],"sources":[{"id":"SRC01","name":"Ditjen AHU Online · Pencarian Perseroan / Profil Badan Usaha","org":"Kementerian Hukum dan HAM RI（印尼法律与人权部）","url":"https://ahu.go.id/","grade":"A","kind":"registry","date":"2026-10","retrieved":"2026-10-19","note":"印尼 PT 登记信息的官方入口；按全称或登记号检索。","reliability":5},{"id":"SRC02","name":"OSS-RBA · Pencarian NIB / Perizinan Berusaha","org":"Kementerian Investasi dan Hilirisasi / BKPM","url":"https://oss.go.id/","grade":"A","kind":"registry","date":"2026-10","retrieved":"2026-10-19","note":"以 13 位 NIB 为锚点，可查 KBLI 分类与许可状态。","reliability":5},{"id":"SRC03","name":"KBLI 2020 业务分类（23111 Industri Kaca Lembaran / 46651 Perdagangan Besar Bahan dan Barang Kimia）","org":"Badan Pusat Statistik（BPS）/ OSS","url":"https://oss.go.id/id/kbli","grade":"A","kind":"standard","date":"2020","retrieved":"2026-10-19","note":"23111 覆盖平板/浮法玻璃等kaca lembaran制造；46651 覆盖化工品批发（含 soda、garam industri 等）。KBLI 2025 已启用，检索时按新编码与旧码对照。","reliability":5},{"id":"SRC04","name":"模拟询盘邮件 INQ-2026-1012-ID-01 原文（含 Company Profile 2026.pdf 附件说明）","org":"模拟数据（非真实主体）","url":"","grade":"D","kind":"counterparty_document","date":"2026-10-12","retrieved":"2026-10-19","note":"对方自述，仅作提取来源；不得作为主体真实性的证据。","reliability":1},{"id":"SRC05","name":"纯碱下游用途与玻璃占比（行业公开资料综合）","org":"行业研究机构公开报告","url":"https://www.glass-international.com/features/a-global-overview-of-the-soda-ash-market","grade":"C","kind":"industry","date":"2024","retrieved":"2026-10-19","note":"用于说明“玻璃是纯碱最大下游之一”，不作定量结论。","reliability":3},{"id":"SRC06","name":"印尼进口政策（Kebijakan dan Pengaturan Impor, Permendag 36/2023 及其修订）","org":"Kementerian Perdagangan RI","url":"https://jdih.kemendag.go.id/","grade":"A","kind":"regulation","date":"2023-12","retrieved":"2026-10-19","note":"进口许可与 lartas 的法规入口；具体 HS 是否受限需按最新修订逐条核对。","reliability":5},{"id":"SRC07","name":"邮件认证（SPF/DKIM/DMARC）核查方法参考","org":"公开技术文档","url":"https://dmarc.org/overview/","grade":"B","kind":"method","date":"2026","retrieved":"2026-10-19","note":"说明为何 SPF/DMARC 缺失只是佐证，不是造假判据。","reliability":4},{"id":"SRC08","name":"企业核验实践指南（AHU + OSS + NIB/KBLI 三步法）","org":"第三方 KYB 服务商公开指南与印尼本地服务商说明","url":"https://asiaverify.com/resources/guides/verifying-companies-in-indonesia-complete-guide-for-2025","grade":"C","kind":"method","date":"2025","retrieved":"2026-10-19","note":"仅用于说明检索路径，不用于任何主体结论。","reliability":3},{"id":"SRC09","name":"OFAC Sanctions List Service","org":"U.S. Department of the Treasury","url":"https://sanctionslist.ofac.treas.gov/","grade":"A","kind":"sanctions","date":"2026-10","retrieved":"2026-10-19","note":"名单筛查入口之一。","reliability":5},{"id":"SRC10","name":"EU Consolidated Financial Sanctions List / UN Security Council Consolidated List","org":"European Union / United Nations","url":"https://www.un.org/securitycouncil/content/un-sc-consolidated-list","grade":"A","kind":"sanctions","date":"2026-10","retrieved":"2026-10-19","note":"跨区域交叉筛查。","reliability":5}],"requests":[{"id":"Q01","priority":"P0","category":"主体","zh":"公司 NIB（13 位 Nomor Induk Berusaha）截图","en":"Company NIB (Nomor Induk Berusaha) — a screenshot from the OSS account showing the 13-digit NIB and KBLI list","why":"OSS 上的 NIB 是主体与业务分类最直接的可核验锚点。","source_ids":["SRC02"],"next_ids":[]},{"id":"Q02","priority":"P0","category":"主体","zh":"AHU 登记信息页（Profil Perseroan：登记号、成立日期、注册地址、董事）","en":"AHU Online company profile page (registration number, date of establishment, registered address, directors)","why":"与 NIB 交叉，确认名称、地址与登记日期一致。","source_ids":["SRC01"],"next_ids":[]},{"id":"Q03","priority":"P0","category":"主体","zh":"营业执照/章程公证件首页与 SK Kemenkumham（可对敏感号段打码）","en":"First page of the deed of establishment (AKTA) and the ministerial approval (SK Kemenkumham), sensitive numbers may be redacted","why":"替代 NDA 前置，让核验不被无限期推后。","source_ids":["SRC01"],"next_ids":[]},{"id":"Q04","priority":"P0","category":"渠道","zh":"官网 About/Contact 页截图 + 公司总机 + 采购部门公共邮箱","en":"Screenshots of the About and Contact pages, plus the company switchboard number and a purchasing department mailbox","why":"建立第二条独立核实渠道，避免只依赖发信人一人。","source_ids":["SRC04"],"next_ids":[]},{"id":"Q05","priority":"P1","category":"业务","zh":"KBLI 明细：是否含 23111（平板玻璃制造）/ 46651（化工批发）/ 46632（玻璃批发）","en":"The full KBLI list registered on the NIB (23111 flat glass manufacturing / 46651 chemical wholesale / 46632 glass wholesale)","why":"决定对方是工厂、分销商还是中间人。","source_ids":["SRC03"],"next_ids":[]},{"id":"Q06","priority":"P1","category":"地址","zh":"注册地址、工厂地址、仓库地址三个门牌，并说明各自用途","en":"Three separate addresses — registered office, factory and warehouse — with a note on the purpose of each","why":"解决签名地址（Cakung）与正文厂区（Bekasi）的口径差异。","source_ids":["SRC04"],"next_ids":[]},{"id":"Q07","priority":"P1","category":"产能","zh":"浮法熔窑数量、日熔化量（t/d）、玻璃品种与厚度结构","en":"Number of float furnaces, melting capacity in tonnes/day, product range and thickness mix","why":"用熔窑数据反算纯碱需求，验证 25,000 MT/年。","source_ids":["SRC04"],"next_ids":[]},{"id":"Q08","priority":"P1","category":"产能","zh":"年投料结构（硅砂、纯碱、石灰石等）与纯碱单耗（kg/t 玻璃）","en":"Annual raw-material mix and soda ash consumption per tonne of glass (kg/t)","why":"验证采购规模与产品用途。","source_ids":["SRC04"],"next_ids":[]},{"id":"Q09","priority":"P1","category":"合同","zh":"合同签字主体、收货人、进口报关主体是否为同一法人；是否代第三方询价","en":"Whether the contracting party, consignee and importer of record are the same legal entity; whether you are enquiring on behalf of a third party","why":"决定合同主体，避免“签约一个、收货另一个”。","source_ids":["SRC06"],"next_ids":[]},{"id":"Q10","priority":"P2","category":"技术","zh":"技术问卷：Fe₂O₃ 上限、堆积密度、粒度分布、是否指定原产地/品牌","en":"Technical questionnaire: Fe2O3 max, bulk density, particle size distribution, preferred origin or brand","why":"玻璃客户最敏感的杂质项缺失，影响报价与批次匹配。","source_ids":["SRC05"],"next_ids":[]},{"id":"Q11","priority":"P1","category":"渠道","zh":"原始邮件（.eml/.msg）或要求对方从公司公邮回复确认","en":"The original message with full headers (.eml), or a re-confirmation from the company's official mailbox","why":"核对 Received 链与发信服务器归属。","source_ids":["SRC07"],"next_ids":[]},{"id":"Q12","priority":"P1","category":"付款","zh":"收款账户户名与开户行；是否接受 L/C at sight","en":"Name on the bank account and the issuing bank; whether an L/C at sight is acceptable","why":"收汇安全与反洗钱核查的起点。","source_ids":["SRC06"],"next_ids":[]}],"actions":[{"id":"T01","phase":"T+0","action":"发送核验回信（英文）","detail":"附 Q01–Q04 的 P0 清单，说明“证照首页可脱敏先行、NDA 只用于商业机密”。","owner":"外贸业务（客户经理）","priority":"P0","status":"open","next_ids":[]},{"id":"T02","phase":"T+1","action":"存档原始邮件与名片","detail":"保存 .eml、PDF、名片扫描件；记录发信 IP 与时间戳。","owner":"外贸业务（助理）","priority":"P0","status":"open","next_ids":[]},{"id":"T03","phase":"T+2","action":"自行检索登记信息","detail":"在 AHU 与 OSS 用全称检索并截图留证，与对方提供的 NIB 双向比对。","owner":"商务/合规","priority":"P0","status":"open","next_ids":[]},{"id":"T04","phase":"T+3","action":"官网与域名核验","detail":"抓取四页截图；查 WHOIS、MX、SPF/DMARC；比对页面上地址电话。","owner":"技术/IT","priority":"P1","status":"open","next_ids":[]},{"id":"T05","phase":"T+5","action":"制裁名单筛查","detail":"公司名 + 联系人 + 城市，跑 OFAC/EU/UN 三份名单。","owner":"合规","priority":"P1","status":"open","next_ids":[]},{"id":"T06","phase":"T+5","action":"汇总缺口是否闭合","detail":"若 P0 项在 5 个工作日内未闭合，暂缓正式报价，只发“价格有效期说明”。","owner":"外贸主管","priority":"P0","status":"open","next_ids":[]},{"id":"T07","phase":"T+10","action":"报价与条款准备","detail":"以 L/C at sight 或 30% 定金为基准出条件；合同主体须与付款主体一致。","owner":"外贸业务 + 财务","priority":"P1","status":"open","next_ids":[]},{"id":"T08","phase":"T+15","action":"视频会议核对","detail":"与对方采购负责人视频，核对工厂背景与熔窑数据；必要时约第三方验厂。","owner":"外贸主管","priority":"P2","status":"open","next_ids":[]}],"messages":[{"id":"MSG01","title":"首次回信 · 索取 P0 注册资料（推荐）","channel":"邮件","purpose":"在不让对方觉得被冒犯的前提下，拿到可独立核验的主体资料。","body_en":"Subject: Re: Inquiry for Dense Soda Ash 25,000 MT/Year — Documents for Onboarding\n\nDear Mr. Andi Pratama Wibowo,\n\nThank you for your inquiry and for the detailed specification. We are glad to work with you and will prepare the CFR Tanjung Priok and CIF Surabaya prices.\n\nTo open the price file in our system, our compliance team asks for a short set of company documents. These are standard for all new customers, and sensitive numbers may be redacted:\n\n1. Your company NIB (13-digit Nomor Induk Berusaha) — a screenshot from the OSS account is sufficient;\n2. Your AHU Online company profile (registration number, date of establishment, registered address);\n3. The first page of your deed of establishment (AKTA) and the ministerial approval (SK Kemenkumham);\n4. Your website Contact page and a landline number for your purchasing department.\n\nWe fully respect your NDA. In our experience, an NDA is best used for technical formulas and customer lists, while the four items above are normally shared without it. If you prefer, we can sign an NDA now and receive the redacted documents in parallel.\n\nWe also have the following commercial questions:\n\n5. Please confirm whether the contracting entity, the consignee and the importer of record are the same PT;\n6. Our standard terms for a first order are an irrevocable L/C at sight, or 30% T/T deposit with the balance against a bank-issued document set. Please let us know which works for you;\n7. Please confirm whether the final receiving factory is in Bekasi or Surabaya.\n\nFor your technical file, we would also appreciate your Fe2O3 limit, bulk density range and particle size distribution.\n\nOnce items 1–4 are received, we will issue the official quotation within 3 working days.\n\nBest regards,\n[Your name]\n[Company] · [Title]\n[Phone] · [Email]","notes":["礼貌 + 标准化 + 给出可替代路径（打码/并行）。","把“报价前置条件”写成公司流程，而不是对对方的质疑。"]},{"id":"MSG02","title":"追问 · 业务规模与产能口径","channel":"邮件","purpose":"解决 25,000 MT/年 与“两座浮法窑、120 万 m²/年”的口径落差。","body_en":"Subject: Technical clarifications — soda ash quantity and furnace capacity\n\nDear Mr. Andi,\n\nTo match the right grade and packaging to your furnaces, could you kindly share:\n\n1. The number of float-glass furnaces and the melting capacity of each (tonnes/day);\n2. Your annual raw-material mix, and the soda ash consumption per tonne of glass (kg/t);\n3. The split between architectural glass, processed glass and any third-party (toll) melting;\n4. Whether the 25,000 MT/year figure covers only your own furnaces or also resale to other glass plants.\n\nThis will help us propose a volume-based price structure and a monthly delivery schedule that matches your warehouse near Tanjung Priok.\n\nBest regards,\n[Your name]","notes":["用“匹配合适等级与包装”来解释为什么要问，降低对方抵触。","第 4 条直接覆盖“中间人/分销商”的可能，避免猜。"]},{"id":"MSG03","title":"NDA 前置的回应话术（简短版）","channel":"邮件","purpose":"对方坚持先签 NDA 时使用。","body_en":"Subject: Re: NDA before company documents\n\nDear Mr. Andi,\n\nNo problem signing an NDA — we can use our mutual NDA template, which covers technical specifications, pricing and customer information, and can be executed within one working day.\n\nMay I suggest that we run two tracks in parallel: we sign the NDA today, and in the meantime you send the NIB and AHU profile with the tax and registration numbers redacted. This lets our compliance team start the review while the NDA is being completed, and we can issue the quotation on schedule.\n\nBest regards,\n[Your name]","notes":["不拒绝 NDA，只把“证照”与“商业机密”拆开。","给出明确时间承诺（1 个工作日）。"]},{"id":"MSG04","title":"资料已收到后的确认回信（闭环）","channel":"邮件","purpose":"拿到 NIB/登记证后，告诉对方哪些已核对通过、哪些还需要补充。","body_en":"Subject: Re: Company documents received — verification update\n\nDear Mr. Andi,\n\nThank you for the documents. We have checked the following:\n\n- Company name and registration number: matched with the AHU record;\n- NIB and KBLI list: received;\n- Registered address: consistent with your letterhead.\n\nTwo items are still open on our side:\n\n1. Please clarify the relationship between the registered office in Cakung and the factory in Bekasi, and give us the warehouse address used for import clearance;\n2. Please confirm the furnace melting capacity (t/d) so that we can align the annual quantity with our production planning.\n\nOnce these two points are confirmed, we will issue the formal quotation with the CFR Tanjung Priok price, the CIF Surabaya option and the payment terms.\n\nBest regards,\n[Your name]","notes":["先说自己核对了什么（建立互信），再列未闭合项。","不透露内部评分与风险标签。"]}],"boundaries":["“未核实”不等于“虚假”：印尼登记信息、税务、海关与诉讼数据均有访问门槛，公开渠道未覆盖是常态。","“存在疑点”只对应具体可核对的矛盾（如地址口径、规模口径、NDA 前置），不推断主观动机，不给诈骗概率。","同名企业与本条询盘主体严格隔离：只有登记号/NIB 一致才允许合并信息。","域名注册时间、网站新旧、邮箱后缀本身都不是企业真伪的判据，只能作为佐证。","本报告不含价格判断；“业务相关性成立”不代表规模真实，也不代表可以赊销。","所有自述信息（成立于 2011、两座浮法窑、自有仓库）一律标注为 D 级线索，在取得第三方文件前不作为结论。"],"stats":{"status":{"verified":4,"discrepancy":2,"unverified":18,"not_applicable":0},"section":{"A":{"verified":0,"discrepancy":0,"unverified":5,"not_applicable":0},"B":{"verified":2,"discrepancy":0,"unverified":3,"not_applicable":0},"C":{"verified":0,"discrepancy":1,"unverified":5,"not_applicable":0},"D":{"verified":1,"discrepancy":0,"unverified":5,"not_applicable":0},"E":{"verified":1,"discrepancy":1,"unverified":0,"not_applicable":0}},"severity":{"high":0,"medium":2,"low":2},"sources":10,"source_grade":{"A":6,"D":1,"C":2,"B":1},"requests":{"P0":4,"P1":7,"P2":1},"actions_open":8,"risks":8,"checks_total":24,"verdict_line":"主体与业务逻辑未见硬矛盾，但存在需解释的疑点，可继续商业沟通并同步补齐资料"},"sections":[{"id":"A","key":"identity","title":"身份核验","subtitle":"主体是否真实存在、名称与登记是否一致"},{"id":"B","key":"business","title":"业务相关性","subtitle":"主营业务与询价产品是否合理相关"},{"id":"C","key":"contact","title":"网站域名与联系方式","subtitle":"官网、域名、邮箱、地址、电话是否自洽"},{"id":"D","key":"risk","title":"公开风险","subtitle":"经营异常、诉讼、制裁、负面报道"},{"id":"E","key":"gaps","title":"待补充资料","subtitle":"需要向对方索取的材料与下一步动作"}]};

</script>
<script>
/* overseas-inquiry-kyc · 报告渲染层
   纯前端、零依赖、可离线。数据只来自内联的 DATA。
   结构：工具函数 → 各区块 renderer → 初始化。 */

'use strict';

const M = DATA.meta || {};
const ST = DATA.stats || {};
const LABEL = { verified: '已核实', discrepancy: '存在疑点', unverified: '未核实', not_applicable: '不适用' };
const ORDER = ['verified', 'discrepancy', 'unverified', 'not_applicable'];
const COLOR = { verified: 'var(--ok)', discrepancy: 'var(--bad)', unverified: 'var(--gray)', not_applicable: 'var(--na)' };
const SEV = { high: '高', medium: '中', low: '低' };
const SECTIONS = DATA.sections || [
  { id: 'A', key: 'identity', title: '身份核验', subtitle: '主体是否真实存在、名称与登记是否一致' },
  { id: 'B', key: 'business', title: '业务相关性', subtitle: '主营业务与询价产品是否合理相关' },
  { id: 'C', key: 'contact', title: '网站域名与联系方式', subtitle: '官网、域名、邮箱、地址、电话是否自洽' },
  { id: 'D', key: 'risk', title: '公开风险', subtitle: '经营异常、诉讼、制裁、负面报道' },
  { id: 'E', key: 'gaps', title: '待补充资料', subtitle: '需要向对方索取的材料与下一步动作' }
];
const SOURCE = {};
(DATA.sources || []).forEach(s => { SOURCE[s.id] = s; });

/* ------------------------------------------------------------------ 工具 */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function arr(x) { return Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]); }
function n(x) { return Number(x || 0); }
function byId(id) { return document.getElementById(id); }

function chip(status, extra) {
  const s = status || 'unverified';
  return `<span class="chip ${esc(s)} ${extra || ''}">${LABEL[s] || esc(s)}</span>`;
}
function sevChip(sev) {
  return `<span class="chip sev-${esc(sev)}">${SEV[sev] || sev}风险</span>`;
}
function gradeChip(g) {
  return `<span class="chip grade-${esc((g || 'd').toLowerCase())}">${esc(g)} 级</span>`;
}
function srcPill(id) {
  const s = SOURCE[id];
  if (!s) return '';
  return `<a class="src-pill" href="#src-${esc(id)}" onclick="jumpSource(event,'${esc(id)}')">${gradeChip(s.grade)}<span class="mono">${esc(id)}</span></a>`;
}
function srcRow(ids) {
  const list = arr(ids);
  if (!list.length) return '';
  return `<div class="srcrow"><span class="tiny muted">来源</span>${list.map(srcPill).join('')}</div>`;
}
function listOr(items, empty, cls) {
  const l = arr(items);
  if (!l.length) return `<div class="tiny muted">${esc(empty || '—')}</div>`;
  return `<ul>${l.map(x => `<li class="${cls || ''}">${esc(x)}</li>`).join('')}</ul>`;
}
function donut(segments, size, width) {
  const R = 52, C = 2 * Math.PI * R, total = segments.reduce((a, b) => a + n(b.v), 0) || 1;
  let off = 0, parts = '';
  segments.forEach(s => {
    const len = n(s.v) / total * C;
    if (len > 0) {
      parts += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="${width || 16}"
        stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
        transform="rotate(-90 70 70)"></circle>`;
      off += len;
    }
  });
  return `<svg width="${size || 140}" height="${size || 140}" viewBox="0 0 140 140" role="img" aria-label="核验状态分布">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--paper-3)" stroke-width="${width || 16}"></circle>
    ${parts}
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${total}</text>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="var(--ink-4)">核验项</text>
  </svg>`;
}

/* ------------------------------------------------------------------ 状态：只在内存 */
const UI = {
  statusFilter: new Set(ORDER),
  sectionFilter: new Set(SECTIONS.map(s => s.id)),
  query: '',
  done: new Set(),
  msgTab: 0
};

/* ------------------------------------------------------------------ 导航 */
function renderNav() {
  const links = [
    ['#sec-hero', '总览'], ['#sec-inquiry', '询盘原文'], ['#sec-extract', '字段提取'],
    ['#sec-subject', '主体识别'], ['#sec-business', '业务相关性'], ['#sec-contact', '联系方式'],
    ['#sec-checks', '核验结论'], ['#sec-risk', '公开风险'], ['#sec-gaps', '待补充与话术'], ['#sec-sources', '来源库']
  ];
  byId('navLinks').innerHTML = links.map(([h, t]) => `<button onclick="location.hash='${h}'">${t}</button>`).join('');
  byId('navBrand').textContent = M.short_title || '海外询盘企业核验';
  byId('navMeta').textContent = '核验日 ' + (M.as_of || '');
  if (M.synthetic) byId('mockBar').hidden = false;
}

/* ------------------------------------------------------------------ 1 封面 */
function renderHero() {
  const segs = ORDER.map(k => ({ k, v: n(ST.status && ST.status[k]), c: COLOR[k] }));
  const legend = segs.map(s => `
    <div class="legend-row" onclick="toggleStatus('${s.k}')" data-legend="${s.k}">
      <span class="sw ${s.k}"></span><span>${LABEL[s.k]}</span><span class="n">${s.v}</span>
    </div>`).join('');

  const cards = SECTIONS.map(s => {
    const c = (ST.section && ST.section[s.id]) || {};
    const total = n(c.verified) + n(c.discrepancy) + n(c.unverified) + n(c.not_applicable);
    const bar = ORDER.map(k => c[k] ? `<i style="width:${(n(c[k]) / total * 100).toFixed(1)}%;background:${COLOR[k]}"></i>` : '').join('');
    const flag = n(c.discrepancy) ? `<span class="flag">${c.discrepancy} 疑点</span>` : '';
    return `<button class="score-cell" onclick="focusSection('${esc(s.id)}')">
      ${flag}<div class="id">区块 ${esc(s.id)}</div><div class="t">${esc(s.title)}</div>
      <div class="bar">${bar}</div>
      <div class="nums"><span>已核实 <b>${n(c.verified)}</b></span><span>疑点 <b>${n(c.discrepancy)}</b></span><span>未核实 <b>${n(c.unverified)}</b></span></div>
    </button>`;
  }).join('');

  const meta = [
    ['询盘编号', M.inquiry_id], ['核验基准日', M.as_of], ['产品', M.product],
    ['询盘数量', M.quantity], ['交付条款', M.incoterm], ['包装', M.packaging]
  ].filter(x => x[1]).map(([k, v]) => `<div class="meta-cell"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

  return `<section class="section" id="sec-hero">
    <div class="hero">
      <div class="hero-grid">
        <div>
          <div class="kicker">INQUIRY KYC · OVERSEAS COUNTERPARTY VERIFICATION</div>
          <h1>${esc(M.title)}</h1>
          ${M.subtitle ? `<p class="lede">${esc(M.subtitle)}</p>` : ''}
          <div class="verdict">
            <div class="lbl">一句话结论</div>
            <div class="txt">${esc(ST.verdict_line || '—')}</div>
          </div>
          <div class="meta-grid">${meta}</div>
        </div>
        <div class="donut-card">
          <div class="card-h"><h3>核验状态分布</h3><span class="right">共 ${n(ST.checks_total)} 项</span></div>
          <div class="donut">${donut(segs, 140, 16)}<div class="legend">${legend}</div></div>
          <div class="tiny muted" style="margin-top:12px">点击图例可按状态筛选下方核验结论。</div>
        </div>
      </div>
      <div class="scorecard" style="margin-top:22px">${cards}</div>
    </div>
  </section>`;
}

/* ------------------------------------------------------------------ 2 询盘原文 */
function renderInquiry() {
  const q = DATA.inquiry || {};
  const body = arr(q.body_lines).map(l => {
    let t = esc(l);
    // 高亮关键实体
    t = t.replace(/(PT [A-Z][A-Za-z ]+)/g, '<span class="hi">$1</span>');
    t = t.replace(/(25,000 MT\/year)/g, '<span class="hi">$1</span>');
    t = t.replace(/(www\.sinarkacanusa\.co\.id|andi\.pratama@sinarkacanusa\.co\.id)/g, '<span class="hi">$1</span>');
    return t;
  }).join('\n');

  const atts = arr(q.attachments).map(a => `<div class="tiny" style="padding:5px 0;border-bottom:1px dashed var(--line-2)"><b>${esc(a.name)}</b><span class="muted"> · ${esc(a.note || '')}</span></div>`).join('');
  const notes = arr(q.notes).map(x => `<li>${esc(x)}</li>`).join('');

  return `<section class="section" id="sec-inquiry">
    <div class="sec-head"><span class="idx">01</span><h2>询盘原文与初步观察</h2>
      <span class="sub">把“对方说了什么”和“我方看到了什么”分开记录</span></div>
    <div class="grid-2" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr)">
      <div class="mail">
        <div class="mail-top">
          <div class="subj">${esc(q.subject)}</div>
          <div class="mail-row"><b>发件人</b><span class="mono">${esc(q.from)}</span></div>
          <div class="mail-row"><b>收件人</b><span class="mono">${esc(q.to)}</span></div>
          <div class="mail-row"><b>时间</b><span class="mono">${esc(q.date)}</span></div>
          ${q.reply_to ? `<div class="mail-row"><b>Reply-To</b><span class="mono">${esc(q.reply_to)}</span></div>` : ''}
        </div>
        <div class="mail-body">${body}</div>
        <div class="mail-foot">附件 ${arr(q.attachments).length} 个 · 正文关键词已高亮 · 本邮件为模拟数据</div>
      </div>
      <div style="display:grid;gap:14px;align-content:start">
        <div class="bizcard">
          <div><div class="logo">PT SINAR KACA NUSANTARA</div></div>
          <div><div class="nm">Andi Pratama Wibowo</div><div class="ps">Senior Procurement Manager</div></div>
          <div class="ct">M +62 812-3456-7890<br>E andi.pratama@sinarkacanusa.co.id<br>W www.sinarkacanusa.co.id<br>Jl. Raya Bekasi KM 27, Cakung, Jakarta Timur 13910</div>
        </div>
        <div class="card pad">
          <div class="card-h"><h3>附件清单</h3><span class="right">${arr(q.attachments).length} 项</span></div>
          ${atts || '<div class="tiny muted">无附件</div>'}
        </div>
        <div class="card pad">
          <div class="card-h"><h3>初步观察</h3></div>
          ${notes ? `<ul style="margin:0;padding-left:18px;font-size:12.8px">${notes}</ul>` : '<div class="tiny muted">—</div>'}
        </div>
      </div>
    </div>
  </section>`;
}

/* ------------------------------------------------------------------ 3 字段提取 */
function renderExtract() {
  const rows = arr(DATA.extraction).map(e => `<tr>
    <td class="mono muted">${esc(e.id)}</td>
    <td class="k">${esc(e.field)}</td>
    <td><b>${esc(e.value)}</b></td>
    <td class="tiny muted">${esc(e.evidence)}</td>
    <td class="tiny"><span class="chip ghost">${esc(e.confidence || 'medium')}</span></td>
    <td class="tiny muted">${esc(e.note || '')}</td>
  </tr>`).join('');

  return `<section class="section" id="sec-extract">
    <div class="sec-head"><span class="idx">02</span><h2>询盘字段提取</h2>
      <span class="sub">公司名 / 地址 / 网站 / 域名 / 邮箱 / 联系人 / 产品 —— 逐项落到原文出处</span></div>
    <div class="card" style="overflow:hidden">
      <div style="max-height:520px;overflow:auto">
        <table class="tbl">
          <thead><tr><th style="width:52px">编号</th><th style="width:96px">字段</th><th style="width:220px">提取值</th><th>原文出处</th><th style="width:84px">置信度</th><th style="width:30%">备注 / 口径</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="tiny muted" style="margin-top:8px">提示：提取只做“照抄 + 标注出处”，不做判断。任何结论都必须留到后面的核验项里。</div>
  </section>`;
}

/* ------------------------------------------------------------------ 4 主体识别 */
function renderSubject() {
  const s = DATA.subject || {};
  const rows = arr(s.summary_rows).map(r => `<tr>
    <td class="k" style="width:34%">${esc(r.k)}</td><td>${esc(r.v)}</td>
    <td style="width:92px" class="right">${r.verified ? chip('verified') : chip('unverified')}</td></tr>`).join('');

  function block(title, obj, portal) {
    if (!obj) return '';
    const st = obj.status === 'verified' ? chip('verified') : chip('unverified');
    return `<div class="card pad" style="margin-bottom:12px">

/* ------------------------------------------------------------------ 7 核验结论（可筛选） */
function checkMatches(c) {
  if (!UI.statusFilter.has(c.status)) return false;
  if (!UI.sectionFilter.has(c.section)) return false;
  if (!UI.query) return true;
  const hay = [c.id, c.title, c.question, c.finding, c.action, (c.verified_facts || []).join(' '),
    (c.doubts || []).join(' '), (c.unknowns || []).join(' '), (c.boundary || '')].join(' ').toLowerCase();
  return hay.indexOf(UI.query) >= 0;
}

function checkCard(c) {
  const sec = SECTIONS.find(s => s.id === c.section) || {};
  const tiny = (l) => `<div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-bottom:6px">${l}</div>`;
  return `<article class="chk is-${esc(c.status)}" data-id="${esc(c.id)}" data-section="${esc(c.section)}">
    <div class="chk-head" onclick="toggleCheck('${esc(c.id)}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCheck('${esc(c.id)}')}">
      <span class="id">${esc(c.id)}</span>
      <div style="flex:1;min-width:0">
        <div class="t">${esc(c.title)}</div>
        <div class="q">${esc(c.question)}</div>
      </div>
      <div class="tags">
        <span class="chip ghost">${esc(sec.id || '')} · ${esc(sec.title || '')}</span>
        ${c.status === 'discrepancy' ? sevChip(c.severity) : ''}
        ${chip(c.status)}
        <span class="caret">▶</span>
      </div>
    </div>
    <div class="chk-body">
      <div class="finding">${esc(c.finding)}</div>
      <div class="cols3">
        <div class="col-box verified">${tiny('✓ 已核实的事实')}${listOr(c.verified_facts, '暂无')}</div>
        <div class="col-box doubt">${tiny('! 存在疑点')}${listOr(c.doubts, '无')}</div>
        <div class="col-box unknown">${tiny('? 无法确认')}${listOr(c.unknowns, '无')}</div>
      </div>
      ${c.boundary ? `<div class="boundary"><b>边界说明：</b>${esc(c.boundary)}</div>` : ''}
      ${srcRow(c.source_ids)}
      <div class="nextrow">
        <span class="lbl">下一步</span><span>${esc(c.action || '—')}</span>
        ${arr(c.next_ids).map(id => `<button class="btn sm" onclick="gotoRequest('${esc(id)}')">索取 ${esc(id)}</button>`).join('')}
      </div>
    </div>
  </article>`;
}

function renderChecks() {
  const all = DATA.checks || [];
  const fbtn = (key, label, on, cnt) => `<button class="${on ? 'on' : ''}" onclick="${key}"><span>${label}</span><span class="cnt">${cnt}</span></button>`;
  const statusBtns = ORDER.map(k => fbtn(`toggleStatus('${k}')`, LABEL[k], UI.statusFilter.has(k), all.filter(c => c.status === k).length)).join('');
  const secBtns = SECTIONS.map(s => fbtn(`toggleSection('${s.id}')`, `${s.id} ${s.title}`, UI.sectionFilter.has(s.id), all.filter(c => c.section === s.id).length)).join('');

  return `<section class="section" id="sec-checks">
    <div class="sec-head"><span class="idx">06</span><h2>核验结论</h2>
      <span class="sub">按“已核实 / 存在疑点 / 未核实”三分，点开任一结论看来源与下一步</span>
      <span class="right"><button class="btn sm" onclick="expandAll(true)">全部展开</button><button class="btn sm" onclick="expandAll(false)">全部收起</button></span></div>
    <div class="toolbar" id="toolbar">
      <div class="filters" id="fStatus">${statusBtns}</div>
      <div style="width:1px;height:20px;background:var(--line)"></div>
      <div class="filters" id="fSection">${secBtns}</div>
      <div class="search"><span class="muted tiny">🔍</span><input id="q" placeholder="搜索结论 / 疑点 / 来源…" oninput="onSearch(this.value)" value="${esc(UI.query)}"></div>
    </div>
    <div class="checks" id="checkList"></div>
    <div class="tiny muted" id="emptyHint" style="display:none;padding:24px;text-align:center">当前筛选没有结果 —— 放宽状态或区块，或清空搜索词。</div>
  </section>`;
}

function renderCheckList() {
  const list = (DATA.checks || []).filter(checkMatches);
  byId('checkList').innerHTML = list.map(checkCard).join('');
  byId('emptyHint').style.display = list.length ? 'none' : 'block';
  // 保持已展开状态
  expanded.forEach(id => { const el = document.querySelector(`.chk[data-id="${id}"]`); if (el) el.classList.add('open'); });
}

const expanded = new Set(['K01', 'K12', 'K16']);
function toggleCheck(id) {
  const el = document.querySelector(`.chk[data-id="${id}"]`);
  if (!el) return;
  el.classList.toggle('open');
  if (el.classList.contains('open')) expanded.add(id); else expanded.delete(id);
}
function expandAll(on) {
  document.querySelectorAll('.chk').forEach(el => {
    el.classList.toggle('open', on);
    if (on) expanded.add(el.dataset.id); else expanded.delete(el.dataset.id);
  });
}
function toggleStatus(k) {
  if (UI.statusFilter.has(k)) UI.statusFilter.delete(k); else UI.statusFilter.add(k);
  if (!UI.statusFilter.size) ORDER.forEach(x => UI.statusFilter.add(x));
  syncFilters(); renderCheckList();
}
function toggleSection(id) {
  if (UI.sectionFilter.has(id)) UI.sectionFilter.delete(id); else UI.sectionFilter.add(id);
  if (!UI.sectionFilter.size) SECTIONS.forEach(s => UI.sectionFilter.add(s.id));
  syncFilters(); renderCheckList();
}
function syncFilters() {
  const all = DATA.checks || [];
  byId('fStatus').innerHTML = ORDER.map(k => `<button class="${UI.statusFilter.has(k) ? 'on' : ''}" onclick="toggleStatus('${k}')"><span>${LABEL[k]}</span><span class="cnt">${all.filter(c => c.status === k).length}</span></button>`).join('');
  byId('fSection').innerHTML = SECTIONS.map(s => `<button class="${UI.sectionFilter.has(s.id) ? 'on' : ''}" onclick="toggleSection('${s.id}')"><span>${s.id} ${s.title}</span><span class="cnt">${all.filter(c => c.section === s.id).length}</span></button>`).join('');
  document.querySelectorAll('[data-legend]').forEach(el => el.classList.toggle('off', !UI.statusFilter.has(el.dataset.legend)));
}
let qTimer = null;
function onSearch(v) {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { UI.query = (v || '').trim().toLowerCase(); renderCheckList(); }, 120);
}
function focusSection(id) {
  location.hash = '#sec-checks';
  UI.sectionFilter = new Set([id]);
  ORDER.forEach(k => UI.statusFilter.add(k));
  syncFilters(); renderCheckList();
}

/* ------------------------------------------------------------------ 8 公开风险 */
function renderRisk() {
  const risks = (DATA.risks || []).slice().sort((a, b) => {
    const o = { high: 0, medium: 1, low: 2 };
    return (o[a.severity] - o[b.severity]) || a.id.localeCompare(b.id);
  });
  const items = risks.map(r => `<div class="risk-item ${esc(r.severity)}">
    <div class="rid">${esc(r.id)}</div>
    <div>
      <div class="fact">${esc(r.fact)}</div>
      <div class="impact">影响：${esc(r.impact || '—')}</div>
      <div class="act">动作：${esc(r.action || '—')}</div>
      ${srcRow(r.source_ids)}
    </div>
    <div class="tags"><span class="chip ghost">${esc(r.category)}</span>${sevChip(r.severity)}${chip(r.status)}</div>
  </div>`).join('');

  const bySev = { high: risks.filter(r => r.severity === 'high').length, medium: risks.filter(r => r.severity === 'medium').length, low: risks.filter(r => r.severity === 'low').length };
  const bars = Object.entries(bySev).map(([k, v]) => `<div class="hbar"><span class="lbl">${SEV[k]}风险</span>
    <span class="tr"><i style="width:${v / (risks.length || 1) * 100}%;background:${k === 'high' ? 'var(--bad)' : k === 'medium' ? '#d08b1a' : 'var(--ink-4)'}"></i></span><span class="n">${v}</span></div>`).join('');

  return `<section class="section" id="sec-risk">
    <div class="sec-head"><span class="idx">07</span><h2>公开风险信息</h2>
      <span class="sub">经营异常、诉讼、制裁、收汇路径 —— 每一项都要说明“看到什么”和“影响什么”</span></div>
    <div class="grid-2" style="grid-template-columns:minmax(0,1fr) 300px">
      <div class="risklist">${items || '<div class="tiny muted">—</div>'}</div>
      <div style="display:grid;gap:14px;align-content:start">
        <div class="card pad"><div class="card-h"><h3>风险分布</h3></div><div class="hbars">${bars}</div>
          <div class="tiny muted" style="margin-top:12px">按“严重度”排序展示；“未核实”状态的风险表示尚未完成检索，不等于无风险。</div></div>
        <div class="card pad"><div class="card-h"><h3>本报告不做的事</h3></div>
          <ul class="boundary-list" style="padding-left:16px;margin:0">
            <li>不给诈骗概率</li><li>不以域名注册时间判断企业真假</li>
            <li>不把同名企业的负面信息归到本主体</li><li>不把“查不到”写成“不存在”</li>
          </ul></div>
      </div>
    </div>
  </section>`;
}

function renderGaps() {

  const items = reqs.map(q => `<div class="req-item ${UI.done.has(q.id) ? 'done' : ''}" id="req-${esc(q.id)}">
    <input type="checkbox" ${UI.done.has(q.id) ? 'checked' : ''} onchange="toggleDone('${esc(q.id)}',this.checked)" aria-label="标记已取得">

    <div><div class="zh">${esc(q.zh)}</div><div class="en">${esc(q.en)}</div><div class="why">${esc(q.why || '')}</div></div>
    <div>${srcRow(q.source_ids)}</div>
  </div>`).join('');

  const acts = (DATA.actions || []).map(a => `<div class="tl-item ${(a.priority || '').toLowerCase()}">
    <div class="ph">${esc(a.phase)} · ${esc(a.priority)}</div>
    <div class="t">${esc(a.action)}</div><div class="d">${esc(a.detail)}</div>
    <div class="o">责任人：${esc(a.owner || '—')}</div></div>`).join('');

  return `<section class="section" id="sec-gaps">
    <div class="sec-head"><span class="idx">08</span><h2>待补充资料与下一步</h2>
      <span class="sub">按“能否独立证明主体”排序索取；每项都配中英双语与理由</span>

    <div class="grid-2" style="grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr)">
      <div class="req" id="reqList">${items}</div>
