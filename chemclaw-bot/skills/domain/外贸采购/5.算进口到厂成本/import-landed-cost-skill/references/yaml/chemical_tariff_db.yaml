# 常用化工品 2026 税则参考库（机器可读，仅作"候选起点"，不作为最终税率）
# 使用纪律：
#   1) 这是"查询起点"库，不是"税率结果"库；每次计算必须按 finance_review 流程重新核验，并在结果中记录核对日期与来源。
#   2) 未收录的税号一律返回 not_found，调用方必须走"待确认"分支，禁止推断。
#   3) 增值税率按税目注释判断（一般货物 13%，低税率 9%），不从 8 位税则推。
# verified_on: 2026-10-20（核对 2026 年进出口税则基线：税委会公告 2025 年第 12 号）
