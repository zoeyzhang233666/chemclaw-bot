<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙特阿拉伯 乙二醇（MEG）供应市场研究</title>
<style>
:root{
  --bg:#0b1220; --bg2:#111a2e; --card:#141f36; --card2:#1a2745; --line:#233355;
  --txt:#e8eefc; --txt2:#a8b8d8; --txt3:#6f82a8;
  --acc:#3ea6ff; --acc2:#26d0a8; --warn:#ffb020; --bad:#ff5c72; --ok:#2ecc8f;
  --grad:linear-gradient(135deg,#3ea6ff,#7c5cff 45%,#26d0a8);
  --shadow:0 8px 32px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 600px at 12% -8%,#1b2c52 0,rgba(11,18,32,0) 62%),var(--bg);
  color:var(--txt);font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 26px}

/* ---------- 顶部 ---------- */
header.hero{position:relative;padding:46px 0 28px;border-bottom:1px solid var(--line);overflow:hidden}
header.hero:before{content:"";position:absolute;inset:0;
  background:radial-gradient(700px 220px at 78% 0,rgba(124,92,255,.28),transparent 70%),
             radial-gradient(520px 200px at 8% 20%,rgba(62,166,255,.20),transparent 70%);pointer-events:none}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;position:relative}
.tag{font-size:11.5px;letter-spacing:.4px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);
  background:rgba(62,166,255,.09);color:#bcd6ff}
.tag.hot{border-color:rgba(255,92,114,.5);background:rgba(255,92,114,.12);color:#ff9aa9}
h1.title{font-size:34px;line-height:1.25;font-weight:700;letter-spacing:-.5px;position:relative}
h1.title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--txt2);margin-top:10px;max-width:1000px;position:relative}
.meta-line{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;color:var(--txt3);font-size:12.5px;position:relative}
.meta-line b{color:var(--txt2);font-weight:600}

/* ---------- 导航 ---------- */
nav.tabs{position:sticky;top:0;z-index:60;background:rgba(11,18,32,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--txt3);font:inherit;font-size:13.5px;padding:15px 16px;
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.18s}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button.on{color:#fff;border-bottom-color:var(--acc)}
nav.tabs input.search{margin-left:auto;align-self:center;background:var(--card2);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;width:210px}
nav.tabs input.search::placeholder{color:var(--txt3)}

/* ---------- 区块 ---------- */
section.panel{display:none;padding:30px 0 70px;animation:fade .3s ease}
section.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
h2.sec{font-size:21px;font-weight:700;margin:0 0 5px;display:flex;align-items:center;gap:10px}
h2.sec .bar{width:4px;height:20px;border-radius:2px;background:var(--grad)}
p.lead{color:var(--txt2);margin-bottom:22px;max-width:1150px}
h3.sub{font-size:15px;font-weight:600;margin:26px 0 12px;color:#dbe7ff;display:flex;gap:8px;align-items:center}
h3.sub:before{content:"";width:7px;height:7px;border-radius:2px;background:var(--acc)}

/* ---------- 卡片 ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(268px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(206px,1fr))}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:14px;padding:18px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.055),transparent 42%)}

/* KPI */
.kpi{padding:17px 18px}
.kpi .k{font-size:11.5px;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.6px;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--txt2);margin-left:3px}
.kpi .n{font-size:11.5px;color:var(--txt3);line-height:1.5}
.kpi.acc .v{color:#7cc4ff}.kpi.a2 .v{color:#4fe0b8}.kpi.warn .v{color:#ffc255}.kpi.bad .v{color:#ff8194}

/* 徽标 */
.badge{display:inline-flex;align-items:center;font-size:10.5px;padding:2px 8px;border-radius:20px;
  font-weight:600;letter-spacing:.2px;white-space:nowrap;line-height:1.7}
.bA{background:rgba(46,204,143,.17);color:#5ee0ab;border:1px solid rgba(46,204,143,.33)}
.bB{background:rgba(62,166,255,.16);color:#7cc4ff;border:1px solid rgba(62,166,255,.32)}
.bC{background:rgba(255,176,32,.15);color:#ffc255;border:1px solid rgba(255,176,32,.32)}
.bD{background:rgba(255,92,114,.15);color:#ff8f9f;border:1px solid rgba(255,92,114,.34)}
.bN{background:rgba(168,184,216,.11);color:#a8b8d8;border:1px solid rgba(168,184,216,.22)}

/* 表格 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12.8px}
thead th{background:var(--card2);color:#c6d6f5;font-weight:600;text-align:left;padding:11px 12px;
  position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12px}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(35,51,85,.62);vertical-align:top;color:var(--txt2)}
tbody tr:hover td{background:rgba(62,166,255,.055)}
tbody td b,tbody td strong{color:var(--txt);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(62,166,255,.1)}
.tag-mini{font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.07);color:var(--txt3)}

/* 图 */
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.chart .cap{font-size:12px;color:var(--txt3);margin-bottom:12px}
.chart svg{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--txt2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

/* 筛选按钮 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:20px;
  padding:5px 13px;font:inherit;font-size:12px;cursor:pointer;transition:.16s}
.chip:hover{color:#fff;border-color:#365594}
.chip.on{background:linear-gradient(135deg,rgba(62,166,255,.25),rgba(38,208,168,.18));color:#fff;border-color:rgba(62,166,255,.6)}

/* 地图 */
#map{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:
  radial-gradient(900px 480px at 50% 40%,#132646,#0a1526 78%)}
#map .sea{position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,rgba(62,166,255,.055) 0 1px,transparent 1px 46px),
   repeating-linear-gradient(0deg,rgba(62,166,255,.055) 0 1px,transparent 1px 46px)}
.mk{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:3}
.mk .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 0 0 4px rgba(62,166,255,.22),0 0 18px rgba(62,166,255,.75);transition:.2s}
.mk:hover .dot{transform:scale(1.35)}
.mk .lbl{position:absolute;left:19px;top:-4px;white-space:nowrap;font-size:11.5px;color:#cfe0ff;
  background:rgba(10,18,32,.78);padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.mk.port .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(46,204,143,.2),0 0 16px rgba(46,204,143,.7)}
.mk.site .dot{background:var(--acc);width:11px;height:11px}
.mk.site .lbl{color:#9fc4ff}
.mk .ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(62,166,255,.32);
  animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.8);opacity:0}}
#map .hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--txt3);z-index:4}
#mapTooltip{position:absolute;z-index:9;display:none;background:rgba(12,20,36,.97);border:1px solid #34548f;
  border-radius:9px;padding:9px 12px;font-size:11.8px;color:var(--txt2);pointer-events:none;max-width:250px;
  box-shadow:var(--shadow);line-height:1.6}

/* 时间线 */
.timeline{position:relative;padding-left:26px;margin-top:8px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--acc),var(--acc2),rgba(255,92,114,.7))}
.tl{position:relative;margin-bottom:16px}
.tl:before{content:"";position:absolute;left:-24px;top:6px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2px solid var(--acc)}
.tl.hi:before{border-color:var(--bad);box-shadow:0 0 12px rgba(255,92,114,.8)}
.tl.pos:before{border-color:var(--ok);box-shadow:0 0 12px rgba(46,204,143,.6)}
.tl .d{font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums}
.tl .t{font-size:13.5px;font-weight:600;color:var(--txt);margin:1px 0 3px}
.tl .x{font-size:12.4px;color:var(--txt2)}
.tl .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* 抽屉 */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--bg2);
  border-left:1px solid var(--line);box-shadow:-24px 0 60px rgba(0,0,0,.55);z-index:120;
  transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:24px}
.drawer.on{transform:none}
.drawer .close{position:absolute;top:16px;right:18px;background:var(--card2);border:1px solid var(--line);
  color:var(--txt2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.drawer h3{font-size:19px;margin-bottom:4px;padding-right:40px}
.drawer .kv{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;margin:16px 0;font-size:12.8px}
.drawer .kv .k{color:var(--txt3)}
.drawer .kv .v{color:var(--txt2)}
.drawer .sec-t{font-size:12px;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase;
  margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.mask{position:fixed;inset:0;background:rgba(4,8,16,.62);z-index:110;display:none;backdrop-filter:blur(2px)}
.mask.on{display:block}

/* 提示 */
.note{border-left:3px solid var(--warn);background:rgba(255,176,32,.075);padding:12px 16px;border-radius:0 10px 10px 0;
  font-size:12.8px;color:#e6d3a8;margin:14px 0}
.note.bad{border-color:var(--bad);background:rgba(255,92,114,.075);color:#ffc2cb}
.note.ok{border-color:var(--ok);background:rgba(46,204,143,.07);color:#b5ecd8}
.note.info{border-color:var(--acc);background:rgba(62,166,255,.07);color:#c3dcff}
.note b{color:#fff}

/* 定义列表 */
.def{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:10px}
.def .it{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.def .it .k{font-size:11px;color:var(--txt3)}
.def .it .v{font-size:14px;font-weight:600;color:var(--txt);margin-top:2px}
.def .it .n{font-size:11.5px;color:var(--txt3);margin-top:3px;line-height:1.5}

/* 层级条 */
.bars .row{display:grid;grid-template-columns:150px 1fr 74px;gap:12px;align-items:center;margin-bottom:9px;font-size:12.5px}
.bars .row .l{color:var(--txt2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .row .b{height:22px;border-radius:5px;background:rgba(255,255,255,.045);position:relative;overflow:hidden}
.bars .row .b i{position:absolute;inset:0;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#3ea6ff,#26d0a8)}
.bars .row .v{color:var(--txt);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}

/* 流程 */
.flow{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;margin:14px 0}
.flow .st{flex:1;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:12px;position:relative;margin-right:14px}
.flow .st:after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--acc);font-size:15px}
.flow .st:last-child{margin-right:0}.flow .st:last-child:after{display:none}
.flow .st .n{font-size:10.5px;color:var(--acc);font-weight:700;letter-spacing:.5px}
.flow .st .t{font-size:13px;font-weight:600;margin:3px 0}
.flow .st .x{font-size:11.5px;color:var(--txt3);line-height:1.5}

/* 来源 */
.srcid{font-size:10.5px;color:#7ea6e6;background:rgba(62,166,255,.1);border:1px solid rgba(62,166,255,.25);
  padding:0 5px;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.srcid:hover{background:rgba(62,166,255,.24)}
footer{border-top:1px solid var(--line);padding:26px 0 60px;color:var(--txt3);font-size:12px}
.hidden{display:none!important}
@media(max-width:720px){
  h1.title{font-size:24px} .wrap{padding:0 14px}
  nav.tabs input.search{width:130px}
  .bars .row{grid-template-columns:100px 1fr 60px}
}
@media print{
  nav.tabs,.mask,.drawer{display:none!important}
  section.panel{display:block!important;page-break-before:always}
  body{background:#fff;color:#111}
}
</style>

/* ---------- 图表：柱线组合 ---------- */
function barChart(el, series, labels, opts={}){
  const W=el.clientWidth||880, H=opts.height||280;
  const P={l:56,r:opts.rAxis?52:14,t:16,b:38};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const maxB = Math.max(...series.flatMap(s=>s.type==='bar'?s.data:[0]))*1.16 || 1;
  const n=labels.length, slot=iw/n, bw=Math.min((slot*0.62)/Math.max(1,series.filter(s=>s.type==='bar').length), 46);
  let svg=`<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for(let i=0;i<=4;i++){
    const y=P.t+ih*i/4;
    svg+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(255,255,255,.07)"/>`;
    svg+=`<text x="${P.l-9}" y="${y+4}" fill="#6f82a8" font-size="10.5" text-anchor="end">${fmt(maxB*(1-i/4))}</text>`;
    if(opts.rAxis){
      svg+=`<text x="${W-P.r+8}" y="${y+4}" fill="#6f82a8" font-size="10.5">${fmt(opts.rMax*(1-i/4))}</text>`;
    }
  }
  let bi=0;
  series.forEach(s=>{
    if(s.type!=='bar')return;
    const off=(bi-(series.filter(x=>x.type==='bar').length-1)/2)*(bw+4);
    s.data.forEach((v,i)=>{
      const h=ih*(v/maxB), x=P.l+slot*i+slot/2+off-bw/2, y=P.t+ih-h;
      svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" rx="4" fill="${s.color}" opacity=".92">
        <title>${labels[i]} ${s.name}: ${fmt(v)}${s.unit||''}</title></rect>`;
    });
    bi++;
  });
  series.filter(s=>s.type==='line').forEach(s=>{
    const pts=s.data.map((v,i)=>[P.l+slot*i+slot/2, P.t+ih*(1-v/(opts.rMax||maxB))]);
    svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.4"
      stroke-linejoin="round" stroke-linecap="round"/>`;
    if(opts.area){
      const grad=`grad_${Math.random().toString(36).slice(2,8)}`;
      svg+=`<defs><linearGradient id="${grad}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".34"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <polygon points="${P.l},${P.t+ih} ${pts.map(p=>p.join(',')).join(' ')} ${P.l+slot*(n-1)+slot/2},${P.t+ih}" fill="url(#${grad})"/>`;
    }
    pts.forEach((p,i)=>{
      svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#0b1220" stroke="${s.color}" stroke-width="2.4">
        <title>${labels[i]} ${s.name}: ${fmt(s.data[i])}${s.unit||''}</title></circle>`;
    });
  });
  labels.forEach((l,i)=>{
    svg+=`<text x="${P.l+slot*i+slot/2}" y="${H-14}" fill="#8fa3c8" font-size="11" text-anchor="middle">${l}</text>`;
  });
  svg+=`</svg>`;
  el.innerHTML=svg;
}
function hBars(el, rows){
  const max=Math.max(...rows.map(r=>r.v));
  el.innerHTML=`<div class="bars">`+rows.map(r=>`
    <div class="row"><div class="l" title="${esc(r.l)}">${esc(r.l)}</div>
      <div class="b"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c||'linear-gradient(90deg,#3ea6ff,#26d0a8)'}"></i></div>
      <div class="v">${fmt(r.v*100)}%</div></div>`).join('')+`</div>`;
}
function donut(el, parts){
  const size=el.clientWidth||300, R=size/2-6, CX=size/2, CY=size/2, r=R*0.62;
  let a0=-Math.PI/2, total=parts.reduce((a,p)=>a+p.v,0);
  let paths='';
  parts.forEach(p=>{
    const a1=a0+p.v/total*Math.PI*2;
    const large=(a1-a0)>Math.PI?1:0;
    const x0=CX+R*Math.cos(a0), y0=CY+R*Math.sin(a0), x1=CX+R*Math.cos(a1), y1=CY+R*Math.sin(a1);
    const xi0=CX+r*Math.cos(a1), yi0=CY+r*Math.sin(a1), xi1=CX+r*Math.cos(a0), yi1=CY+r*Math.sin(a0);
    paths+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${r},${r} 0 ${large} 0 ${xi1},${yi1} Z"
      fill="${p.c}" opacity=".92"><title>${esc(p.l)}: ${fmt(p.v)}${p.u||''} (${pct(p.v,total)}%)</title></path>`;
    a0=a1;
  });
  el.innerHTML=`<svg viewBox="0 0 ${size} ${size}" height="${size}">${paths}
    <text x="${CX}" y="${CY-2}" text-anchor="middle" fill="#e8eefc" font-size="19" font-weight="700">${fmt(total)}</text>
    <text x="${CX}" y="${CY+16}" text-anchor="middle" fill="#6f82a8" font-size="10.5">${parts.u||''}</text></svg>`;
}

${D.feedstock.map(f=>`<div class="card"><div style="font-size:13.5px;font-weight:600;margin-bottom:5px">${esc(f.item)} <span class="tag-mini">${esc(f.role)}</span></div>

/* ================= 地图 ================= */
/* 注意：本区块初始为 display:none，clientWidth 为 0。
   因此必须在"物流 tab 可见之后"才计算坐标，否则所有标记会错位。
   这里用 [data-drawn] 标记避免重复渲染，并在窗口变化时重绘。 */
function drawMap(){
  const map=$('#map'); if(!map) return;
  const W=map.clientWidth, H=map.clientHeight;
  /* 容器不可见（尺寸为 0）时不绘制，等切到该 tab 再画 */
  if(W<50 || H<50){ map.dataset.drawn='0'; return; }
  /* 尺寸变化时清空上一次的标记与线条，避免重复叠加 */
  map.querySelectorAll('.mk').forEach(n=>n.remove());
  map.querySelectorAll('svg').forEach(n=>n.remove());
  map.dataset.drawn='1';

  /* 经度线性投影；纬度上下翻转（北在上）
     注：港口与工业城在实际地理上紧邻（朱拜勒港距城约 3–4 km），
     因此靠"标签摆放方向"错开文字，而不是改动真实坐标。 */
  const lngMin=37.2, lngMax=50.8, latMin=21.9, latMax=28.0;
  const padX=52, padY=40;
  const px = lng => padX + (lng-lngMin)/(lngMax-lngMin)*(W-padX*2);
  const py = lat => H-padY - (lat-latMin)/(latMax-latMin)*(H-padY*2);
  let html='';
  /* ===== 标签布局：按"同城"分组统一分层，彻底避免互压 =====
     由于 .mk 有 transform:translate(-50%,-50%)，子元素百分比相对已偏移的盒子，
     统一用 left:100% / right:100% 贴住圆点；标签高约 25px，层距 30px。
     东海岸（靠右）标签向左展开，西海岸（靠左）标签向右展开。 */
  const nearRight = x => x > W*0.55;
  const LH = 30;   // 标签层高

  /* 把站点与其同城港口归为一组，按纬度从高到低排层 */
  const groups = {};
  const addToGroup = (siteKey, item) => { (groups[siteKey] = groups[siteKey] || []).push(item); };
  Object.entries(D.sites).forEach(([k,s])=>addToGroup(k, {kind:'site', key:k, s}));
  D.logistics.ports.forEach(p=>{
    const siteKey = p.site && D.sites[p.site] ? p.site : null;
    if(siteKey) addToGroup(siteKey, {kind:'port', key:p.id, p});
  });

  Object.entries(groups).forEach(([siteKey, items])=>{
    const s0 = D.sites[siteKey];
    const x = px(s0.lng);
    const right = nearRight(x);   // 靠右 → 标签向左展开
    /* 工业城排最外层（离点最远），港口依次靠近 */
    items.sort((a,b)=> (a.kind==='site'? -1:1) - (b.kind==='site'? -1:1));
    const n = items.length;
    items.forEach((it, i)=>{
      /* 纵向：以工业城点为基准，向上依次排布 */
      const top = -14 - (n-1-i)*LH;
      const pos = right
        ? `right:100%;left:auto;top:${top}px;margin-right:12px;text-align:right`
        : `left:100%;right:auto;top:${top}px;margin-left:12px;text-align:left`;
      if(it.kind==='site'){
        const cap = D.plants.filter(p=>p.site===siteKey).reduce((a,p)=>a+p.capacity_kt,0);
        html+=`<div class="mk site" style="left:${px(s0.lng).toFixed(1)}px;top:${py(s0.lat).toFixed(1)}px" data-info="site:${siteKey}">
          <div class="ring"></div><div class="dot"></div>
          <div class="lbl" style="${pos}">${esc(s0.name.split(' ')[0])} · ${fmt(cap)} kt/a</div></div>`;
      }else{
        const p = it.p;
        html+=`<div class="mk port" style="left:${px(p.lng).toFixed(1)}px;top:${py(p.lat).toFixed(1)}px" data-info="port:${p.id}">
          <div class="dot"></div>
          <div class="lbl" style="${pos}">⚓ ${esc(p.name.split(',')[0].replace('King Fahd Industrial Port','法赫德国王工业港'))}</div></div>`;
      }
    });
  });
  /* 通道示意（超出地图范围的线段会被 overflow:hidden 裁掉，属正常） */
  html+=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="position:absolute;inset:0;pointer-events:none">
    <path d="M${px(49.68)},${py(27.03)} C ${px(50.2)},${py(26.4)} ${px(50.9)},${py(25.9)} ${px(50.6)},${py(25.4)}"
      stroke="#26d0a8" stroke-width="1.6" stroke-dasharray="5 5" fill="none" opacity=".8"/>
    <text x="${px(50.0)}" y="${py(26.2)}" fill="#26d0a8" font-size="10.5">→ 霍尔木兹</text>
    <path d="M${px(38.20)},${py(23.95)} C ${px(39.4)},${py(21.6)} ${px(41.6)},${py(19.2)} ${px(43.5)},${py(15.6)}"
      stroke="#ffb020" stroke-width="1.6" stroke-dasharray="5 5" fill="none" opacity=".85"/>
    <text x="${px(38.7)}" y="${py(21.6)}" fill="#ffb020" font-size="10.5">→ 曼德海峡</text>
    <text x="${px(38.6)}" y="${py(26.4)}" fill="#6f82a8" font-size="11">红海</text>
    <text x="${px(45.6)}" y="${py(22.6)}" fill="#6f82a8" font-size="11">阿拉伯半岛</text>
    <text x="${px(48.6)}" y="${py(27.7)}" fill="#4a86c8" font-size="11">波斯湾</text>
  </svg>`;
  map.insertAdjacentHTML('afterbegin', html);
  const tip=$('#mapTooltip');
  $$('#map .mk', map).forEach(m=>{
    m.addEventListener('mousemove',e=>{
      const [t,k]=m.dataset.info.split(':');
      let txt='';
      if(t==='site'){
        const s=D.sites[k]; const ps=D.plants.filter(p=>p.site===k);
        txt=`<b>${esc(s.name)}</b><br>${esc(s.region)} · ${esc(s.coast)}<br>装置 ${ps.length} 套 · 名义 ${fmt(ps.reduce((a,p)=>a+p.capacity_kt,0))} kt/a<br>`+ps.map(p=>`· ${esc(p.company.split('(')[0])} ${fmt(p.capacity_kt)}kt`).join('<br>');
      }else{
        const p=D.logistics.ports.find(x=>x.id===k);
        txt=`<b>${esc(p.name)}</b><br>${esc(p.coast)} · ${esc(p.role)}`;
      }
      tip.innerHTML=txt; tip.style.display='block';
      const r=map.getBoundingClientRect();
      tip.style.left=Math.max(8,Math.min(e.clientX-r.left+14, r.width-250))+'px';
      tip.style.top=Math.max(8,Math.min(e.clientY-r.top+14, r.height-80))+'px';
    });
    m.addEventListener('mouseleave',()=>tip.style.display='none');
    m.addEventListener('click',()=>{
      const [t,k]=m.dataset.info.split(':');
      if(t==='port') openPort(k);
    });
  });
}

/* ================= 渲染与交互 ================= */
function renderAll(){
  $('#main').innerHTML = TABS.map(t=>{
    let html='';
    if(t.id==='overview') html=renderOverview();
    if(t.id==='capacity') html=renderCapacity();
    if(t.id==='chain')    html=renderChain();
    if(t.id==='trade')    html=renderTrade();
    if(t.id==='logistics')html=renderLogistics();
    if(t.id==='policy')   html=renderPolicy();
    if(t.id==='sources')  html=renderSources();
    return `<section class="panel ${t.id==='overview'?'on':''}" id="tab-${t.id}">${html}</section>`;
  }).join('');
  $('#footerNote').innerHTML = `本报告为采购研究用途，非报价文件。数据截止 ${D.meta.research_date}；所有关键数字均标注口径与来源，未经验证的内容已列为数据缺口。<br>
    生成工具：海外供应市场研究 Skill v1.0（模板 + data.js 数据驱动）。`;
  bindTableClicks();
  /* 初次渲染时只有概览 tab 可见，故只画概览的图表；
     其它区块（贸易/政策/物流地图）在切换到对应 tab 时按需绘制。 */
  renderCharts();
}
function bindTableClicks(){
  $$('[data-co]').forEach(el=>el.onclick=()=>openCompany(el.dataset.co));
  $$('[data-plant]').forEach(el=>el.onclick=()=>openPlant(el.dataset.plant));
  $$('[data-port]').forEach(el=>el.onclick=()=>openPort(el.dataset.port));
  $$('#capacity .filters .chip').forEach(ch=>{
    ch.onclick=()=>{
      $$('#capacity .filters .chip').forEach(c=>c.classList.remove('on')); ch.classList.add('on');
      const f=ch.dataset.f;
      $$('#plantTable tbody tr').forEach(tr=>{
        if(!tr.dataset.plant) { tr.classList.remove('hidden'); return; }
        const p=D.plants.find(x=>x.id===tr.dataset.plant);
        let show=true;
        if(f==='A') show=p.evidence_level.indexOf('A')>=0;
        else if(f==='unverified') show=!!p.unverified;
        else if(f!=='all') show=p.site===f;
        tr.classList.toggle('hidden',!show);
      });
    };
  });
}
/* 图表：隐藏面板内 clientWidth=0，需在面板可见后重绘 */
function renderCharts(){
  const yrs=D.trade.by_year.map(y=>String(y.year));
  const visible = el => el && el.offsetParent !== null;
  if(visible($('#c-exports'))) {
    barChart($('#c-exports'),[
      {type:'bar',name:'出口总量',data:D.trade.by_year.map(y=>y.world_kt),color:'#3ea6ff',unit:'kt'},
      {type:'bar',name:'对华出口',data:D.trade.by_year.map(y=>y.china_kt),color:'#26d0a8',unit:'kt'},
      {type:'line',name:'出口均价',data:D.trade.unit_prices_usd_t.map(p=>p.world),color:'#ffb020',unit:' 美元/吨'}
    ],yrs,{height:290,rAxis:true,rMax:800});
  }
  if(visible($('#c-coast'))) donut($('#c-coast'),[
    {l:'东海岸·朱拜勒',v:eastCap,c:'#3ea6ff',u:' kt/a'},
    {l:'西海岸·延布+拉比格',v:westCap,c:'#26d0a8',u:' kt/a'}
  ]);
  if(visible($('#c-t1'))) barChart($('#c-t1'),[
    {type:'bar',name:'出口总量',data:D.trade.by_year.map(y=>y.world_kt),color:'#3ea6ff',unit:'kt'},
    {type:'bar',name:'对华',data:D.trade.by_year.map(y=>y.china_kt),color:'#26d0a8',unit:'kt'}
  ],yrs,{height:260});
  if(visible($('#c-t2'))) barChart($('#c-t2'),[
    {type:'bar',name:'对华占比',data:D.trade.by_year.map(y=>+(y.china_kt/y.world_kt*100).toFixed(1)),color:'#ffb020',unit:'%'}
  ],yrs,{height:260});
  if(visible($('#c-china'))) barChart($('#c-china'),[
    {type:'bar',name:'对华量',data:D.trade.by_year.map(y=>y.china_kt),color:'#26d0a8',unit:'kt'},
    {type:'line',name:'对华额',data:D.trade.by_year.map(y=>y.china_musd),color:'#ffb020',unit:' 百万美元'}
  ],yrs,{height:270,rAxis:true,rMax:2100});
  if(visible($('#c-dest'))){
    const parts=D.trade.partners_2025_full.slice(0,8).map((p,i)=>({l:p.p,v:p.kt,c:['#3ea6ff','#26d0a8','#7c5cff','#ffb020','#ff7085','#4fe0b8','#8ab4ff','#c792ff'][i]}));
    parts.push({l:'其他',v:latest.world_kt-parts.reduce((a,p)=>a+p.v,0),c:'#54648c'});
    donut($('#c-dest'),parts.map(p=>({...p,u:' kt'})));
    $('#c-dest').querySelector('svg')?.setAttribute('height','280');
  }
  if(visible($('#c-destbar'))) hBars($('#c-destbar'),D.trade.partners_2025_full.slice(0,10).map(p=>({l:p.p,v:p.kt/latest.world_kt})));
  if(visible($('#c-ev'))){
    const m={}; D.events.forEach(e=>m[e.impact]=(m[e.impact]||0)+1);
    const order=['极高','高','中','低','正向'];
    const tot=D.events.length;
    hBars($('#c-ev'),order.filter(k=>m[k]).map(k=>({l:k,v:m[k]/tot,c:k==='极高'||k==='高'?'linear-gradient(90deg,#ff5c72,#ff9a7a)':k==='正向'?'linear-gradient(90deg,#2ecc8f,#26d0a8)':'linear-gradient(90deg,#ffb020,#ffd166)'})));
    $('#c-ev').insertAdjacentHTML('beforeend',`<div style="font-size:11.5px;color:var(--txt3);margin-top:8px">共 ${tot} 个事件；其中"极高/高"影响 ${(m['极高']||0)+(m['高']||0)} 个，且集中在 2026 年。</div>`);
  }
}

renderAll();
</script>
</body>
</html>
