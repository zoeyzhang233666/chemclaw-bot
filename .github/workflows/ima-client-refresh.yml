name: Refresh ima client bundle

on:
  push:
    branches: [feat/ima-openapi-connector]
    paths:
      - .github/workflows/ima-client-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ima-openapi-connector
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: chemclaw-bot
      - run: npm run build
        working-directory: chemclaw-bot
      - name: Commit generated client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chemclaw-bot/client.js
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate ima connector client bundle"
            git push origin HEAD:feat/ima-openapi-connector
          fi
