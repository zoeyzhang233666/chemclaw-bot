# Temporary PR-only build artifact job for syncing generated client.js.
name: Classic Native Bundle Export
on:
  pull_request:
    paths:
      - '.github/workflows/classic-native-bundle.yml'
      - 'chemclaw-bot/src/client/**'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --prefix chemclaw-bot --no-fund --no-audit
      - run: npm run build --prefix chemclaw-bot
      - uses: actions/upload-artifact@v4
        with:
          name: classic-native-client
          path: chemclaw-bot/client.js
          if-no-files-found: error
