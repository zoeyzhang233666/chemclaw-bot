# Temporary PR-only build artifact job for syncing generated client.js.
name: Classic Native Bundle Export
on:
  pull_request:
    paths:
      - '.github/workflows/classic-native-bundle.yml'
      - 'chemclaw-bot/src/client/**'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --prefix chemclaw-bot --no-fund --no-audit
      - run: npm run build --prefix chemclaw-bot
      - name: Commit the exact generated bundle to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemclaw-bot/client.js
          if ! git diff --cached --quiet; then
            git commit -m "build(classic): sync generated client.js for native show_view"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: classic-native-client
          path: chemclaw-bot/client.js
          if-no-files-found: error
