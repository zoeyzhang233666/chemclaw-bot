# Temporary PR-only job: regenerate client.js from current UI source.
name: Classic Native Bundle Export
on:
  pull_request:
    paths:
      - '.github/workflows/classic-native-bundle.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --prefix chemclaw-bot --no-fund --no-audit
      - run: npm run build --prefix chemclaw-bot
      - name: Commit generated bundle to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemclaw-bot/client.js
          if ! git diff --cached --quiet; then
            git commit -m "build(classic): remove native view debug block from generated bundle"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
