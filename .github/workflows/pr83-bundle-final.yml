name: Temporary PR83 bundle refresh

on:
  push:
    branches: [feat/upstream-616-stop-room-work-20261030]

permissions:
  contents: write

jobs:
  bundle:
    if: github.repository == 'zoeyzhang233666/chemclaw-bot' && github.ref == 'refs/heads/feat/upstream-616-stop-room-work-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - working-directory: chemclaw-bot
        run: npm ci --no-fund --no-audit
      - working-directory: chemclaw-bot
        run: npm run build
      - name: Commit generated bundle
        shell: bash
        run: |
          set -euo pipefail
          git add -- chemclaw-bot/client.js chemclaw-bot/runtime/chart-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(client): restore stop controls for later turns'
          git push origin HEAD:refs/heads/feat/upstream-616-stop-room-work-20261030
