name: Refresh DSH rc.5 npm locks (temporary)
on:
  push:
    branches:
      - chore/bump-dsh-0.2.1-rc.5
    paths:
      - .github/workflows/dsh-rc5-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'zoeyzhang233666/chemclaw-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and write the new npm lockfiles
        run: |
          npm install --prefix chemclaw-bot/dev/harness --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix app --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs')
          const pinned = '0.2.1-rc.5'
          for (const path of ['app', 'chemclaw-bot/dev/harness']) {
            const pkg = JSON.parse(fs.readFileSync(path + '/package.json', 'utf8'))
            const lock = JSON.parse(fs.readFileSync(path + '/package-lock.json', 'utf8'))
            for (const [name, version] of Object.entries(pkg.dependencies)) {
              if (!name.startsWith('@deepseek-ai/dsh')) continue
              if (version !== pinned || lock.packages[''].dependencies[name] !== pinned ||
                lock.packages['node_modules/' + name]?.version !== pinned)
                throw new Error(path + ' DSH mismatch: ' + name)
            }
            console.log(path + ': npm lockfiles verified at DSH ' + pinned)
          }
          NODE
      - name: Commit refreshed lockfiles to the upgrade branch
        env:
          BRANCH: chore/bump-dsh-0.2.1-rc.5
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git add app/package-lock.json chemclaw-bot/dev/harness/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update was generated"
            exit 1
          fi
          git commit -m "chore: regenerate DeepSeek Harness rc.5 lockfiles"
          git push origin "HEAD:refs/heads/$BRANCH"
