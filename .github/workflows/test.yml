name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} · DSH pinned by app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
    defaults:
      run:
        shell: bash
        working-directory: chemclaw-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --no-fund --no-audit
      # Test the exact DSH version bundled with the desktop app. Never downgrade it
      # just for CI: retired DSH versions can fail unrelated timing-sensitive tests.
      - name: Install current desktop-pinned DSH
        run: |
          dsh_version="$(node -p 'require("../app/package.json").dependencies["@deepseek-ai/dsh"]')"
          test -n "$dsh_version" && test "$dsh_version" != undefined
          echo "Testing DSH $dsh_version (pinned by app/package.json)"
          npm run harness -- --no-save "@deepseek-ai/dsh@$dsh_version"
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  app:
    name: Desktop app profile
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The test composes the profile and starts no window, so it needs no Electron binary.
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Install the published plugin shape in an empty directory
        run: |
          archive="$(cd ../chemclaw-bot && npm pack --silent --pack-destination "$RUNNER_TEMP")"
          test -f "$RUNNER_TEMP/$archive"
          root="$RUNNER_TEMP/chemclaw-fresh-install"
          mkdir -p "$root"
          npm install --prefix "$root" --ignore-scripts --legacy-peer-deps --no-fund --no-audit "$RUNNER_TEMP/$archive"
          node -e 'const fs=require("node:fs");const path=require("node:path");const root=process.argv[1];const plugin=require(path.join(root,"node_modules/chemclaw-bot/package.json"));const genui=require(path.join(root,"node_modules/@changfenhuang/dsh-genui/package.json"));if(genui.version!==plugin.dependencies["@changfenhuang/dsh-genui"])throw Error("GenUI missing or incorrect in fresh plugin install");const patch=fs.readFileSync(path.join(root,"node_modules/chemclaw-bot/cordis.patch.yml"),"utf8");if(!patch.includes("@changfenhuang/dsh-genui"))throw Error("GenUI bundle patch missing from plugin archive");' "$root"

  app-source:
    name: Source GUI installs GenUI and renders timeline (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install source and app dependencies
        run: |
          npm ci --prefix chemclaw-bot --no-fund --no-audit
          npm ci --prefix app --no-fund --no-audit
      - name: Reproduce a stale source checkout with GenUI missing
        run: |
          rm -rf app/node_modules/@changfenhuang/dsh-genui
          test ! -e app/node_modules/@changfenhuang/dsh-genui
      - name: Source launcher must repair missing dependency without reinstalling all modules
        run: node scripts/launch-chemclaw.mjs --no-picker --source . --sync-only
      - name: Verify GenUI is installed and locked at the expected version
        run: |
          cd app
          npm ls @changfenhuang/dsh-genui --all
      - name: Start source GUI with isolated test profile and render GenUI timeline
        run: node app/scripts/check-packed.mjs --source

  app-package:
    name: Desktop app package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check native Bot browser operations
        run: node scripts/run-browser-check.mjs
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      # The runner is a fresh machine, so the installer may run here. It must install for the
      # current user only, the installed app must pass the same check, and the uninstaller must
      # remove it again.
      - name: Install and check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'ChemClaw*' }
          }
          $installer = Get-Item dist-pack/ChemClaw-*-win-x64.exe
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ChemClaw'
          $exe = Join-Path $dir 'ChemClaw.exe'
          if (-not (Test-Path $exe)) { throw "The installer did not put the app in $dir" }
          $entry = Find-Entry 'HKCU:'
          if (-not $entry) { throw 'No uninstall entry for the current user' }
          if (Find-Entry 'HKLM:') { throw 'The installer installed for all users' }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its check' }

      # The update builds the app a second time, so it runs only for changes to the app or the
      # workflows. A build of the next version is the feed; the installed app downloads it, checks
      # its sha512, and installs it as it quits.
      - name: Does the change touch the app?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(app/|\.github/workflows/)'; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the next version
        if: steps.scope.outputs.update == 'true'
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: Update the installed app and check it
        if: steps.scope.outputs.update == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\ChemClaw\ChemClaw.exe'
          node scripts/check-update.mjs $exe dist-next
          if ($LASTEXITCODE -ne 0) { throw 'The installed app did not take the update' }
          # The installer goes on after the app has quit.
          function Installed-Version {
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -like 'ChemClaw*' } |
              Select-Object -ExpandProperty DisplayVersion
          }
          $deadline = (Get-Date).AddSeconds(240)
          while ((Installed-Version) -ne $env:NEXT_VERSION -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if ((Installed-Version) -ne $env:NEXT_VERSION) { throw "The installed version is $(Installed-Version), not $env:NEXT_VERSION" }
          while ((Get-Process | Where-Object { $_.Path -like '*chemclaw-updater*' }) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The updated app failed its check' }

      - name: Uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'ChemClaw*' }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ChemClaw'
          $exe = Join-Path $dir 'ChemClaw.exe'
          # The uninstaller removes the program only: the data location and the app's own data stay.
          $kept = foreach ($folder in (Join-Path $HOME '.chemclaw'), (Join-Path $env:APPDATA 'ChemClaw')) {
            New-Item -ItemType Directory -Force $folder | Out-Null
            $file = Join-Path $folder 'kept.txt'
            Set-Content $file 'kept'
            $file
          }
          $uninstaller = Join-Path $dir 'Uninstall ChemClaw.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/currentuser', '/S' -Wait
          # The uninstaller goes on from a copy in the temp folder, so wait for its result.
          $deadline = (Get-Date).AddSeconds(120)
          while (((Test-Path $exe) -or (Find-Entry 'HKCU:')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'The uninstaller left the app in place' }
          if (Find-Entry 'HKCU:') { throw 'The uninstaller left its uninstall entry' }
          foreach ($file in $kept) { if (-not (Test-Path $file)) { throw "The uninstaller removed $file" } }

  app-package-macos:
    name: Desktop app package (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ${{ runner.temp }}/electron-builder-cache
          key: desktop-tools-v3-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - run: npm run pack
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          # Ad-hoc identity '-' uses no certificate or secret, so PR signing is safe; otherwise electron-builder skips signing and leaves an unsealed bundle.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the signed app and update path
        run: |
          folder=mac
          if [ "${{ matrix.arch }}" = arm64 ]; then folder=mac-arm64; fi
          app="dist-pack/$folder/ChemClaw.app"
          exe="$app/Contents/MacOS/ChemClaw"
          test -n "$(find "$HOME/Library/Caches/electron" -name "electron-v*-darwin-${{ matrix.arch }}.zip" -print -quit)"
          codesign --verify --deep --strict "$app"
          file "$exe"
          expected="${{ matrix.arch }}"
          if [ "$expected" = x64 ]; then expected=x86_64; fi
          file -b "$exe" | grep -F "$expected"
          node scripts/check-packed.mjs "$exe"
          node scripts/run-browser-check.mjs
          node scripts/check-update.mjs "$exe" 99.0.0

  app-package-linux:
    name: Desktop app package (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-tools-v3-Linux-x64-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packages
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "dist-pack/ChemClaw-$version-linux-x86_64.AppImage"
          test -f "dist-pack/ChemClaw-$version-linux-amd64.deb"
          test -f dist-pack/latest-linux.yml
      # An AppImage mounts through FUSE 2, and Ubuntu 24.04's AppArmor blocks the unprivileged
      # user namespaces that Chromium's sandbox needs; a throwaway runner may lift that.
      - name: Prepare to run the app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2t64 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check native Bot browser operations
        run: xvfb-run -a node scripts/run-browser-check.mjs
      - name: Check the packaged app
        run: xvfb-run -a node scripts/check-packed.mjs
      # apt-get, not dpkg: it also installs the deb's dependencies. The ./ prefix makes apt-get
      # read a file; without it the path is taken for a package name.
      - name: Install the deb and check
        run: |
          version="$(node -p "require('./package.json').version")"
          sudo apt-get install -y "./dist-pack/ChemClaw-$version-linux-amd64.deb"
          test -f /usr/share/applications/chemclaw.desktop
          xvfb-run -a node scripts/check-packed.mjs "/opt/ChemClaw/chemclaw"
      # A deb cannot update itself: it points at the release page, as on macOS.
      - name: The deb's app hears of a new version
        run: xvfb-run -a node scripts/check-update.mjs "/opt/ChemClaw/chemclaw" 99.0.0
      # The update builds the app a second time, so it runs only for changes to the app or the
      # workflows. The AppImage downloads the new one and replaces itself as it quits.
      - name: Does the change touch the app?
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qE '^(app/|\.github/workflows/)'; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the next version
        if: steps.scope.outputs.update == 'true'
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: The AppImage takes the update
        if: steps.scope.outputs.update == 'true'
        run: |
          tmp="$(mktemp -d)"
          cp dist-pack/ChemClaw-*-linux-x86_64.AppImage "$tmp/chemclaw.AppImage"
          chmod +x "$tmp/chemclaw.AppImage"
          xvfb-run -a node scripts/check-update.mjs "$tmp/chemclaw.AppImage" dist-next
          pkill -f "$tmp/chemclaw" || true
          next="$(ls dist-next/ChemClaw-*-linux-x86_64.AppImage)"
          test "$(sha512sum "$tmp/chemclaw.AppImage" | cut -d' ' -f1)" = "$(sha512sum "$next" | cut -d' ' -f1)"
      - name: Uninstall
        run: |
          sudo apt-get remove -y chemclaw
          test ! -e "/opt/ChemClaw/chemclaw"

  docker:
    name: Docker startup and data migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker build -f docker/Dockerfile -t chemclaw:test .
      - run: node docker/test.mjs chemclaw:test
      - name: Publish the tested image
        if: github.event_name == 'push' && github.repository == 'zoeyzhang233666/chemclaw-bot'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_BRANCH: ${{ github.ref_name }}
          GHCR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GHCR_REPOSITORY,,}"
          case "$GHCR_BRANCH" in
            main) tag=latest ;;
            *) exit 0 ;;
          esac
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag chemclaw:test "$image:sha-$GHCR_SHA"
          docker tag chemclaw:test "$image:$tag"
          docker push "$image:sha-$GHCR_SHA"
          docker push "$image:$tag"

  # The one check that branch rules require. A job whose needs failed is skipped,
  # and GitHub counts a skipped required check as passed, so this job always runs
  # and fails unless the matrix, leak scan, app, app package and Docker checks passed.
  result:
    name: Test result
    needs: [test, scan, app, app-source, app-package, app-package-macos, app-package-linux, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.scan.result }}" = success && test "${{ needs.app.result }}" = success && test "${{ needs.app-source.result }}" = success && test "${{ needs.app-package.result }}" = success && test "${{ needs.app-package-macos.result }}" = success && test "${{ needs.app-package-linux.result }}" = success && test "${{ needs.docker.result }}" = success
