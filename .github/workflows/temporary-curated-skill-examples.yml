name: Temporary curated skill example bundle regeneration
# Rerun after prioritizing curated overlap examples
on:
  push:
    branches:
      - fix/skill-library-builtin-catalog-zh
    paths:
      - .github/workflows/temporary-curated-skill-examples.yml
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'zoeyzhang233666/chemclaw-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: chemclaw-bot
      - run: node --test test/new-skill-examples.test.js test/skill-presentation.test.js
        working-directory: chemclaw-bot
      - run: npm run build
        working-directory: chemclaw-bot
      - name: Commit generated frontend to PR branch
        run: |
          if ! git diff --quiet -- chemclaw-bot/client.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add chemclaw-bot/client.js
            git commit -m 'build: refresh curated skill example client'
            git push origin HEAD:fix/skill-library-builtin-catalog-zh
          fi
