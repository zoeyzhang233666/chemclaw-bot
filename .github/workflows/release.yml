name: Release

# Releases chemclaw-bot: attach the npm pack .tgz and ChemClaw desktop installers to the
# GitHub release. Windows updates from latest.yml; macOS opens the release page for a manual download.
#
# npm Trusted Publishing (optional): set repository variable ENABLE_NPM_PUBLISH=true after
# configuring Trusted Publisher on npmjs.com for package chemclaw-bot → GitHub Actions,
# owner zoeyzhang233666, repository chemclaw-bot, workflow release.yml, no environment.
# Until then the Publish step is skipped; the .tgz is still attached to the release.
#
# The release tag must be v<version in chemclaw-bot/package.json> and must point at a commit on
# main. A version with a pre-release part (0.2.0-rc.1) goes to the npm tag "next".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the package, but do not publish
        type: boolean
        default: true
      benchmark_mac_zip:
        description: Compare macOS ZIP compression time and size (dry run only)
        type: boolean
        default: false

permissions:
  # write: attach the package file to the release.
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        shell: bash
        working-directory: chemclaw-bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 --no-fund --no-audit

      - name: Check the tag and the branch
        id: release
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          TAG="v$version"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $TAG."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Publish from main."
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 && [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG already points at another commit. Use a new version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

      - name: Check the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('../app/package.json').version")"
          if [ "$app" != "$version" ]; then
            echo "::error::app/package.json has version $app, but chemclaw-bot/package.json has $version. Give both the same version."
            exit 1
          fi

      - run: npm ci --no-fund --no-audit
      - run: npm run harness
      - run: npm test
      - run: node scripts/build-client.mjs --check
      - run: npm run lint

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Prepare the draft release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo '::error::This version is already published. Use a new version.'; exit 1; }
          else
            notes="../docs/releases/$TAG.md"
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            if [ -f "$notes" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --draft "${prerelease[@]}" --title "ChemClaw $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --draft "${prerelease[@]}" --title "ChemClaw $TAG" --generate-notes
            fi
          fi

      - name: Publish
        if: (github.event_name == 'push' || !inputs.dry_run) && vars.ENABLE_NPM_PUBLISH == 'true'
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

      # The release keeps the package file for installs without npm.
      - name: Attach the package to the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm pack
          gh release upload "$TAG" "chemclaw-bot-$(node -p "require('./package.json').version").tgz" --clobber

  app-windows:
    name: Desktop app installer (Windows)
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the installer for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ChemClaw-win-x64
          path: app/dist-pack/ChemClaw-*-win-x64.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach the installer to the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          installer="dist-pack/ChemClaw-$(node -p "require('./package.json').version")-win-x64.exe"
          gh release upload "$TAG" "$installer" "$installer.blockmap" dist-pack/latest.yml --clobber

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ${{ runner.temp }}/electron-builder-cache
          key: desktop-tools-v3-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - run: npm run pack
        env:
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Create the Mac ZIP
        run: |
          folder=mac
          if [ "${{ matrix.arch }}" = arm64 ]; then folder=mac-arm64; fi
          app="dist-pack/$folder/ChemClaw.app"
          zip="dist-pack/ChemClaw-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          codesign --verify --deep --strict "$app"
          /usr/bin/time -p ditto -c -k --sequesterRsrc --keepParent --zlibCompressionLevel 6 "$app" "$zip"
      - name: Install from the zip and check
        run: |
          zip="dist-pack/ChemClaw-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          target="$RUNNER_TEMP/chemclaw-archive-check"
          mkdir -p "$target"
          ditto -x -k "$zip" "$target"
          app="$target/ChemClaw.app"
          exe="$app/Contents/MacOS/ChemClaw"
          codesign --verify --deep --strict "$app"
          expected="${{ matrix.arch }}"
          if [ "$expected" = x64 ]; then expected=x86_64; fi
          file -b "$exe" | grep -F "$expected"
          node scripts/check-packed.mjs "$exe"
          node scripts/check-update.mjs "$exe" 99.0.0
      - name: Compare ZIP compression
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.benchmark_mac_zip
        run: |
          folder=mac
          if [ "${{ matrix.arch }}" = arm64 ]; then folder=mac-arm64; fi
          node scripts/benchmark-mac-zip.mjs "dist-pack/$folder/ChemClaw.app" "$RUNNER_TEMP/chemclaw-zip-benchmark"
      - name: Keep the zip for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ChemClaw-mac-${{ matrix.arch }}
          path: app/dist-pack/ChemClaw-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the zip to the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          zip="dist-pack/ChemClaw-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "$zip" --clobber

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: desktop-tools-v3-Linux-x64-${{ hashFiles('app/package-lock.json') }}
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        # The dry run never uploads, so it checks here that every file the release attaches exists.
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/ChemClaw-$version-linux-x86_64.AppImage" "dist-pack/ChemClaw-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Keep the packages for real-device checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ChemClaw-linux-x64
          path: |
            app/dist-pack/ChemClaw-*-linux-x86_64.AppImage
            app/dist-pack/ChemClaw-*-linux-amd64.deb
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the packages to the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        # The AppImage carries its block map inside the file, so there is no .blockmap to attach.
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "$TAG" "dist-pack/ChemClaw-$version-linux-x86_64.AppImage" "dist-pack/ChemClaw-$version-linux-amd64.deb" dist-pack/latest-linux.yml --clobber

  complete:
    name: Publish the complete release
    needs: [publish, app-windows, app-macos, app-linux]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release view "$TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' > "$RUNNER_TEMP/assets"
          for file in "chemclaw-bot-$version.tgz" "ChemClaw-$version-win-x64.exe" "ChemClaw-$version-win-x64.exe.blockmap" latest.yml "ChemClaw-$version-mac-arm64.zip" "ChemClaw-$version-mac-x64.zip" "ChemClaw-$version-linux-x86_64.AppImage" "ChemClaw-$version-linux-amd64.deb" latest-linux.yml; do
            grep -Fx "$file" "$RUNNER_TEMP/assets"
          done
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
