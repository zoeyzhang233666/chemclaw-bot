name: Temporary full skill prompt preview build
on:
  push:
    branches:
      - fix/skill-library-builtin-catalog-zh
    paths:
      - .github/workflows/temporary-full-skill-prompts.yml
permissions:
  contents: write
jobs:
  validate-and-build:
    if: github.repository == 'zoeyzhang233666/chemclaw-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: chemclaw-bot
      - name: Validate all domain and native skill examples
        working-directory: chemclaw-bot
        run: node --test test/domain-skill-prompts.test.js test/new-skill-examples.test.js test/skill-presentation.test.js
      - name: Regenerate front-end bundle
        working-directory: chemclaw-bot
        run: npm run build
      - name: Ensure committed client stays synced with source
        working-directory: chemclaw-bot
        run: node scripts/build-client.mjs --check
      - name: Commit generated client.js to PR branch
        run: |
          if ! git diff --quiet -- chemclaw-bot/client.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add chemclaw-bot/client.js
            git commit -m 'build: regenerate skill prompt examples'
            git fetch origin fix/skill-library-builtin-catalog-zh
            git rebase origin/fix/skill-library-builtin-catalog-zh
            git push origin HEAD:fix/skill-library-builtin-catalog-zh
          fi
