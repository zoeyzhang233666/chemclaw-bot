name: P0 DSH Harness lockfile regeneration (one-shot)
on:
  push:
    branches: ['fix/p0-dsh-022-rc1-rc2-compat-20261112']
    paths: ['.github/workflows/p0-harness-lock-sync.yml']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Regenerate test harness lock
        working-directory: chemclaw-bot/dev/harness
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm all direct Harness DSH dependencies are pinned to rc.1
        working-directory: chemclaw-bot/dev/harness
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('package.json','utf8')); const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); for(const [name,version] of Object.entries(m.dependencies)){ if(name.startsWith('@deepseek-ai/dsh') && (version !== '0.2.2-rc.1' || lock.packages['node_modules/'+name]?.version !== version)) throw Error('Harness mismatch: '+name) }"
      - name: Commit harness lock to isolated PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemclaw-bot/dev/harness/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(lock): pin test harness to DSH 0.2.2-rc.1"
            git push origin HEAD:refs/heads/fix/p0-dsh-022-rc1-rc2-compat-20261112
          fi
