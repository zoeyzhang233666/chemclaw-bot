name: Build native candlestick preview assets
on:
  push:
    branches:
      - feat/inline-candlestick-chart
permissions:
  contents: write
jobs:
  build-preview-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - name: Build checked-in client and chart engine
        working-directory: chemclaw-bot
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated assets only to PR #94
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chemclaw-bot/client.js chemclaw-bot/runtime/chart-engine.js
          if ! git diff --cached --quiet; then
            git commit -m "build: sync native candlestick preview assets"
            git push origin HEAD:feat/inline-candlestick-chart
          fi
