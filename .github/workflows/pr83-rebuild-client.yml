name: Temporary PR 83 client rebuild

on:
  push:
    branches:
      - feat/upstream-616-stop-room-work-20261030

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'zoeyzhang233666/chemclaw-bot' && github.ref == 'refs/heads/feat/upstream-616-stop-room-work-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chemclaw-bot/package-lock.json
      - name: Install dependencies
        working-directory: chemclaw-bot
        run: npm ci --no-fund --no-audit
      - name: Rebuild generated UI
        working-directory: chemclaw-bot
        run: npm run build
      - name: Commit only the generated artifacts to PR 83 branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- chemclaw-bot/client.js chemclaw-bot/runtime/chart-engine.js
          if git diff --cached --quiet; then
            echo 'Generated artifacts are already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(client): regenerate checked-in bundle for group stop-all'
          git push origin HEAD:refs/heads/feat/upstream-616-stop-room-work-20261030
